<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="500" fill="#000000"/>

  <text x="600" y="40" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Deployment Architecture
  </text>

  <!-- LangWatch stack -->
  <text x="290" y="80" font-size="17" fill="#8888FF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">LangWatch — self-hosted</text>

  <rect x="200" y="105" width="180" height="50" fill="#151530" stroke="#8888FF" stroke-width="2"/>
  <text x="290" y="135" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">LLM app</text>

  <line x1="290" y1="155" x2="290" y2="180" stroke="#8888FF" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="200" y="185" width="180" height="50" fill="#151530" stroke="#8888FF" stroke-width="2"/>
  <text x="290" y="215" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">LangWatch SDK</text>

  <line x1="290" y1="235" x2="290" y2="260" stroke="#8888FF" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="200" y="265" width="180" height="50" fill="#151530" stroke="#8888FF" stroke-width="2"/>
  <text x="290" y="290" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">LangWatch server</text>
  <text x="290" y="308" font-size="10" fill="#AAAAFF" text-anchor="middle" font-family="'Geist Mono', monospace">you operate this</text>

  <line x1="290" y1="315" x2="290" y2="340" stroke="#8888FF" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="200" y="345" width="180" height="50" fill="#151530" stroke="#8888FF" stroke-width="2"/>
  <text x="290" y="375" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Database</text>

  <text x="290" y="430" font-size="12" fill="#8888FF" text-anchor="middle" font-family="'Geist Mono', monospace">4 services you deploy,</text>
  <text x="290" y="448" font-size="12" fill="#8888FF" text-anchor="middle" font-family="'Geist Mono', monospace">patch, and scale</text>

  <!-- Uncoil stack -->
  <text x="910" y="80" font-size="17" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil — managed</text>

  <rect x="820" y="105" width="180" height="50" fill="#0f1f0f" stroke="#44FF44" stroke-width="2"/>
  <text x="910" y="135" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">LLM app</text>

  <line x1="910" y1="155" x2="910" y2="180" stroke="#44FF44" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="820" y="185" width="180" height="50" fill="#0f1f0f" stroke="#44FF44" stroke-width="2"/>
  <text x="910" y="215" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil SDK</text>

  <line x1="910" y1="235" x2="910" y2="260" stroke="#44FF44" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="790" y="265" width="110" height="130" fill="#0f1f0f" stroke="#44FF44" stroke-width="2"/>
  <text x="845" y="295" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Tinybird</text>
  <text x="845" y="315" font-size="10" fill="#AAFFAA" text-anchor="middle" font-family="'Geist Mono', monospace">raw spans</text>

  <rect x="920" y="265" width="110" height="130" fill="#0f1f0f" stroke="#44FF44" stroke-width="2"/>
  <text x="975" y="295" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Convex</text>
  <text x="975" y="315" font-size="10" fill="#AAFFAA" text-anchor="middle" font-family="'Geist Mono', monospace">run summaries</text>
  <text x="975" y="332" font-size="10" fill="#AAFFAA" text-anchor="middle" font-family="'Geist Mono', monospace">+ evaluations</text>

  <text x="910" y="430" font-size="12" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace">0 services you deploy —</text>
  <text x="910" y="448" font-size="12" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace">managed ingest + storage</text>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8888FF"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#44FF44"/>
    </marker>
  </defs>
</svg>