<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="42" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Total Cost of Ownership: 75k Calls / Month, 12-Person Team
  </text>
  <text x="600" y="66" font-size="13" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    Platform fee + the engineering time each model actually requires
  </text>

  <!-- gridlines shared baseline -->
  <line x1="60" y1="550" x2="1150" y2="550" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="60" y1="345" x2="1150" y2="345" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="60" y1="140" x2="1150" y2="140" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============ LEFT CHART: MONTHLY ============ -->
  <text x="290" y="118" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Monthly recurring cost
  </text>

  <!-- Braintrust bar: $3,250 of $3,500 max -> height 381 -->
  <rect x="110" y="169" width="150" height="381" fill="#FF8844" opacity="0.85"/>
  <text x="185" y="155" font-size="17" font-weight="bold" fill="#FF8844" text-anchor="middle" font-family="'Geist Mono', monospace">$3,250</text>
  <text x="185" y="575" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Braintrust</text>

  <!-- Uncoil bar: $1,450 -> height 170 -->
  <rect x="330" y="380" width="150" height="170" fill="#FFFF00" opacity="0.9"/>
  <text x="405" y="366" font-size="17" font-weight="bold" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">$1,450</text>
  <text x="405" y="575" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil</text>

  <!-- ============ RIGHT CHART: ANNUAL ============ -->
  <text x="920" y="118" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Annual cost (12 months)
  </text>

  <!-- Braintrust annual: $39,000 -> height 381 -->
  <rect x="700" y="169" width="150" height="381" fill="#FF8844" opacity="0.85"/>
  <text x="775" y="155" font-size="17" font-weight="bold" fill="#FF8844" text-anchor="middle" font-family="'Geist Mono', monospace">$39,000</text>
  <text x="775" y="575" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Braintrust</text>

  <!-- Uncoil annual: $17,400 -->
  <rect x="920" y="380" width="150" height="170" fill="#FFFF00" opacity="0.9"/>
  <text x="995" y="366" font-size="17" font-weight="bold" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">$17,400</text>
  <text x="995" y="575" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil</text>

  <!-- divider between the two charts -->
  <line x1="590" y1="140" x2="590" y2="550" stroke="#333333" stroke-width="1"/>

  <!-- breakdown text -->
  <g font-family="'Geist Mono', monospace" font-size="10.5" fill="#AAAAAA">
    <text x="185" y="595">Platform $450 + evaluator</text>
    <text x="185" y="609">upkeep $1,500 + cost-data</text>
    <text x="185" y="623">bridge $600 + exp. infra $700</text>

    <text x="405" y="595">Platform $950 (tracing + eval</text>
    <text x="405" y="609">+ cost + experiments) +</text>
    <text x="405" y="623">maintenance $500</text>

    <text x="775" y="595">Setup (one-time, not shown</text>
    <text x="775" y="609">above): $1,400 to first</text>
    <text x="775" y="623">quality gate in ~2-3 weeks</text>

    <text x="995" y="595">Setup (one-time, not shown</text>
    <text x="995" y="609">above): $450 to first</text>
    <text x="995" y="623">quality gate in ~2-3 days</text>
  </g>

  <!-- savings callout -->
  <rect x="60" y="650" width="1090" height="40" fill="none" stroke="#FFFF00" stroke-width="2"/>
  <text x="600" y="675" font-size="14" font-weight="bold" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    Uncoil saves $21,600/year (55% lower) at this scale — the gap is engineering time, not the invoice
  </text>
</svg>
