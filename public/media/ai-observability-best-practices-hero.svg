<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bpHeroTitle bpHeroDesc">
  <title id="bpHeroTitle">A four-phase rollout path from a single instrumented workflow to organization-wide coverage</title>
  <desc id="bpHeroDesc">A black canvas shows four connected cream and acid-yellow stepping stones labeled pilot one workflow, expand with alerting, standardize the schema, and govern across teams, arranged left to right with a rising baseline, illustrating a staged rollout of AI observability practice across an organization.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="800" y="60" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">THE FOUR-PHASE ROLLOUT</text>

  <g font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="80" y="560" width="300" height="100" fill="#f6f1e6"/>
    <text x="230" y="605" fill="#0a0a0a">1. PILOT</text>
    <text x="230" y="628" fill="#0a0a0a" font-size="11">one workflow</text>

    <rect x="460" y="460" width="300" height="100" fill="#f6f1e6"/>
    <text x="610" y="505" fill="#0a0a0a">2. EXPAND</text>
    <text x="610" y="528" fill="#0a0a0a" font-size="11">add alerting</text>

    <rect x="840" y="360" width="300" height="100" fill="#f4d44d"/>
    <text x="990" y="405" fill="#0a0a0a">3. STANDARDIZE</text>
    <text x="990" y="428" fill="#0a0a0a" font-size="11">shared schema</text>

    <rect x="1220" y="260" width="300" height="100" fill="#f4d44d"/>
    <text x="1370" y="305" fill="#0a0a0a">4. GOVERN</text>
    <text x="1370" y="328" fill="#0a0a0a" font-size="11">org-wide</text>

    <line x1="380" y1="600" x2="460" y2="510" stroke="#f4d44d" stroke-width="3"/>
    <line x1="760" y1="500" x2="840" y2="410" stroke="#f4d44d" stroke-width="3"/>
    <line x1="1140" y1="400" x2="1220" y2="310" stroke="#f4d44d" stroke-width="3"/>
  </g>

  <text x="800" y="820" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="14">uncoil.dev · earn each phase with evidence from the last one before expanding scope</text>
</svg>
