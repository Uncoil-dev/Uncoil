<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="instTriageTitle instTriageDesc">
  <title id="instTriageTitle">A failure triage funnel narrowing from all failed runs down to the single root-cause span</title>
  <desc id="instTriageDesc">A black canvas shows a downward-narrowing funnel made of four acid-yellow and cream bands labeled all failed runs, grouped by failure signature, grouped by first divergent span, and root-cause span, showing counts shrinking from thousands to one, illustrating a triage method that narrows failures by grouping instead of reading transcripts one at a time.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="800" y="60" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">FAILURE TRIAGE FUNNEL</text>

  <polygon points="260,140 1340,140 1140,320 460,320" fill="#f6f1e6"/>
  <text x="800" y="215" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="16" font-weight="700">ALL FAILED RUNS</text>
  <text x="800" y="240" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="13">2,140 runs this week</text>

  <polygon points="460,340 1140,340 990,500 610,500" fill="#f4d44d"/>
  <text x="800" y="410" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="16" font-weight="700">GROUPED BY FAILURE SIGNATURE</text>
  <text x="800" y="435" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="13">14 distinct signatures</text>

  <polygon points="610,520 990,520 880,650 720,650" fill="#f6f1e6"/>
  <text x="800" y="575" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="15" font-weight="700">GROUPED BY FIRST DIVERGENT SPAN</text>
  <text x="800" y="600" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="13">3 candidate spans</text>

  <polygon points="720,670 880,670 830,780 770,780" fill="#f4d44d"/>
  <text x="800" y="820" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="16" font-weight="700">ROOT-CAUSE SPAN</text>
  <text x="800" y="845" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="13">1 tool schema regression</text>

  <text x="800" y="880" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="13">uncoil.dev · group before you read; read only the group that explains the pattern</text>
</svg>
