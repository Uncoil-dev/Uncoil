<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#000000"/>

  <!-- Title -->
  <text x="600" y="40" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Cost-Quality Correlation: The Integrated Advantage
  </text>

  <!-- Axes -->
  <line x1="150" y1="600" x2="1100" y2="600" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="150" y1="100" x2="150" y2="600" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="600" y="660" font-size="16" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">
    Cost Spent ($)
  </text>
  <text x="50" y="350" font-size="16" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold" transform="rotate(-90, 50, 350)">
    Quality/Insight Gained
  </text>

  <!-- Competitors plotted -->

  <!-- Braintrust: High cost, good quality (evaluation-only) -->
  <circle cx="320" cy="250" r="12" fill="#FF8844" opacity="0.8"/>
  <text x="320" y="220" font-size="12" fill="#FF8844" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">
    Braintrust
  </text>
  <text x="320" y="280" font-size="10" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">
    Eval-focused
  </text>

  <!-- Langfuse: Medium cost, good quality -->
  <circle cx="480" cy="300" r="12" fill="#8888FF" opacity="0.8"/>
  <text x="480" y="270" font-size="12" fill="#8888FF" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">
    Langfuse
  </text>
  <text x="480" y="330" font-size="10" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">
    Open-source
  </text>

  <!-- Datadog: High cost, lower quality for agents -->
  <circle cx="700" cy="450" r="12" fill="#FF6B6B" opacity="0.8"/>
  <text x="700" y="420" font-size="12" fill="#FF6B6B" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">
    Datadog
  </text>
  <text x="700" y="480" font-size="10" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">
    Expensive for agents
  </text>

  <!-- Laminar: Low cost, medium quality (compression tradeoff) -->
  <circle cx="540" cy="420" r="12" fill="#FFAA44" opacity="0.8"/>
  <text x="540" y="390" font-size="12" fill="#FFAA44" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">
    Laminar
  </text>
  <text x="540" y="450" font-size="10" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">
    Compression tradeoff
  </text>

  <!-- Uncoil: Best value (cost + quality) -->
  <circle cx="900" cy="200" r="16" fill="#44FF44" opacity="0.9" stroke="#FFFF00" stroke-width="2"/>
  <text x="900" y="170" font-size="14" fill="#44FF44" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">
    Uncoil
  </text>
  <text x="900" y="240" font-size="11" fill="#FFFF00" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">
    Integrated advantage
  </text>

  <!-- Efficiency frontier line -->
  <line x1="200" y1="550" x2="950" y2="150" stroke="#FFFF00" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  <text x="750" y="350" font-size="12" fill="#FFFF00" opacity="0.5" font-family="'Geist Mono', monospace" font-style="italic">
    Efficiency Frontier
  </text>

  <!-- Grid -->
  <line x1="150" y1="200" x2="1100" y2="200" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="150" y1="300" x2="1100" y2="300" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="150" y1="400" x2="1100" y2="400" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Key insight -->
  <rect x="100" y="30" width="1000" height="50" fill="none" stroke="#44FF44" stroke-width="2" rx="5"/>
  <text x="600" y="62" font-size="14" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">
    Uncoil: Maximum quality gain per dollar spent (integrated traces + cost + evaluation + experiments)
  </text>
</svg>