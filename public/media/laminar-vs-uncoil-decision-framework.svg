<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lamUncoilDecisionTitle">
  <title id="lamUncoilDecisionTitle">Decision grid crossing iteration cadence against monthly trace volume: Uncoil wins whenever iteration is medium or high, Laminar only wins at low iteration cadence, and only the low-cadence plus over 500 million trace cell is a clean compression win</title>
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="42" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    WHEN COMPRESSION WINS, WHEN IT DOESN'T
  </text>
  <text x="600" y="66" font-size="14" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">
    Iteration cadence x monthly trace volume
  </text>

  <!-- Column headers (trace volume) -->
  <text x="380" y="108" font-size="14" fill="#FFFF00" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">&lt; 100M / MONTH</text>
  <text x="660" y="108" font-size="14" fill="#FFFF00" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">100M–500M / MONTH</text>
  <text x="940" y="108" font-size="14" fill="#FFFF00" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">&gt; 500M / MONTH</text>

  <!-- Row headers (iteration cadence) -->
  <text x="145" y="200" font-size="13" fill="#FFFF00" text-anchor="end" font-weight="bold" font-family="'Geist Mono', monospace">HIGH</text>
  <text x="145" y="222" font-size="11" fill="#888888" text-anchor="end" font-family="'Geist Mono', monospace">&gt;8 deploys/mo</text>
  <text x="145" y="350" font-size="13" fill="#FFFF00" text-anchor="end" font-weight="bold" font-family="'Geist Mono', monospace">MEDIUM</text>
  <text x="145" y="372" font-size="11" fill="#888888" text-anchor="end" font-family="'Geist Mono', monospace">2–8 deploys/mo</text>
  <text x="145" y="500" font-size="13" fill="#FFFF00" text-anchor="end" font-weight="bold" font-family="'Geist Mono', monospace">LOW</text>
  <text x="145" y="522" font-size="11" fill="#888888" text-anchor="end" font-family="'Geist Mono', monospace">&lt;2 deploys/mo</text>

  <!-- Grid: 3 columns x 250,530,810 to 250+250; 3 rows y 130,280,430 to +130 -->
  <!-- Row 1 (High cadence) : all Uncoil -->
  <rect x="250" y="130" width="250" height="130" fill="#224422" stroke="#44FF44" stroke-width="2"/>
  <text x="375" y="188" font-size="17" fill="#66FF66" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">UNCOIL</text>
  <text x="375" y="210" font-size="11" fill="#AAFFAA" text-anchor="middle" font-family="'Geist Mono', monospace">evaluation ROI dominates</text>

  <rect x="530" y="130" width="250" height="130" fill="#224422" stroke="#44FF44" stroke-width="2"/>
  <text x="655" y="188" font-size="17" fill="#66FF66" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">UNCOIL</text>
  <text x="655" y="210" font-size="11" fill="#AAFFAA" text-anchor="middle" font-family="'Geist Mono', monospace">evaluation ROI dominates</text>

  <rect x="810" y="130" width="250" height="130" fill="#224422" stroke="#44FF44" stroke-width="2"/>
  <text x="935" y="188" font-size="17" fill="#66FF66" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">UNCOIL</text>
  <text x="935" y="210" font-size="11" fill="#AAFFAA" text-anchor="middle" font-family="'Geist Mono', monospace">evaluation ROI dominates</text>

  <!-- Row 2 (Medium cadence) -->
  <rect x="250" y="280" width="250" height="130" fill="#224422" stroke="#44FF44" stroke-width="2"/>
  <text x="375" y="338" font-size="17" fill="#66FF66" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">UNCOIL</text>
  <text x="375" y="360" font-size="11" fill="#AAFFAA" text-anchor="middle" font-family="'Geist Mono', monospace">storage delta is small</text>

  <rect x="530" y="280" width="250" height="130" fill="#4d4d22" stroke="#FFFF00" stroke-width="2"/>
  <text x="655" y="338" font-size="16" fill="#FFFF66" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">HYBRID</text>
  <text x="655" y="360" font-size="11" fill="#DDDD88" text-anchor="middle" font-family="'Geist Mono', monospace">possible, adds ops cost</text>

  <rect x="810" y="280" width="250" height="130" fill="#552222" stroke="#FF4444" stroke-width="2"/>
  <text x="935" y="330" font-size="15" fill="#FF6666" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">LAMINAR +</text>
  <text x="935" y="350" font-size="15" fill="#FF6666" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">custom eval</text>
  <text x="935" y="372" font-size="11" fill="#DD9999" text-anchor="middle" font-family="'Geist Mono', monospace">build the gap yourself</text>

  <!-- Row 3 (Low cadence) -->
  <rect x="250" y="430" width="250" height="130" fill="#552222" stroke="#FF4444" stroke-width="2"/>
  <text x="375" y="488" font-size="17" fill="#FF6666" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">LAMINAR</text>
  <text x="375" y="510" font-size="11" fill="#DD9999" text-anchor="middle" font-family="'Geist Mono', monospace">verify eval needs first</text>

  <rect x="530" y="430" width="250" height="130" fill="#552222" stroke="#FF4444" stroke-width="2"/>
  <text x="655" y="488" font-size="17" fill="#FF6666" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">LAMINAR</text>
  <text x="655" y="510" font-size="11" fill="#DD9999" text-anchor="middle" font-family="'Geist Mono', monospace">verify eval needs first</text>

  <rect x="810" y="430" width="250" height="130" fill="#552222" stroke="#FF4444" stroke-width="3"/>
  <text x="935" y="488" font-size="17" fill="#FF8888" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">LAMINAR</text>
  <text x="935" y="510" font-size="11" fill="#FFAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">the one clean win</text>

  <!-- Breakeven annotation -->
  <rect x="250" y="580" width="810" height="40" fill="none" stroke="#FFFF00" stroke-width="1"/>
  <text x="655" y="605" font-size="12" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    Compression only wins with &gt;200M traces/month AND zero evaluation needs AND rare incidents
  </text>

  <!-- Scenario markers -->
  <circle cx="935" cy="185" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="950" y="190" font-size="11" fill="#FFFFFF" font-family="'Geist Mono', monospace">Scenario 1: support agent, 40M/mo, weekly ships</text>

  <circle cx="375" cy="185" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="30" y="640" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">Scenario 2 (loan routing, high stakes) and Scenario 3 (hybrid) both sit left of the breakeven line — full fidelity or a routed mix, not pure compression.</text>
</svg>
