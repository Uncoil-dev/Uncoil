<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="45" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">New Relic vs Uncoil: Instrumentation Scope</text>
  <text x="600" y="75" font-size="13" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Full-stack instrumentation pyramid vs agent-native trace funnel</text>

  <text x="310" y="118" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">NEW RELIC</text>
  <text x="890" y="118" font-size="20" font-weight="bold" fill="#FFD400" text-anchor="middle" font-family="'Geist Mono', monospace">UNCOIL</text>

  <!-- New Relic pyramid: base = infra, mid = APM, top = AI monitoring bolted on -->
  <polygon points="80,560 540,560 487,480 133,480" fill="#151515" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="133,480 487,480 433,400 187,400" fill="#151515" stroke="#CCCCCC" stroke-width="2"/>
  <polygon points="187,400 433,400 380,320 240,320" fill="#151515" stroke="#FFD400" stroke-width="2" stroke-dasharray="6,4"/>

  <text x="310" y="515" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">INFRASTRUCTURE</text>
  <text x="310" y="533" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">hosts, containers, network</text>

  <text x="310" y="435" font-size="12" font-weight="bold" fill="#DDDDDD" text-anchor="middle" font-family="'Geist Mono', monospace">APPLICATION / APM</text>
  <text x="310" y="451" font-size="10" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">services, DB calls, traces</text>

  <text x="310" y="363" font-size="11" font-weight="bold" fill="#FFD400" text-anchor="middle" font-family="'Geist Mono', monospace">AI MONITORING</text>

  <line x1="380" y1="320" x2="540" y2="270" stroke="#FFD400" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="550" y="248" font-size="11" fill="#FFD400" font-family="'Geist Mono', monospace">Added later:</text>
  <text x="550" y="266" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">LLM visibility layered onto</text>
  <text x="550" y="282" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">the same APM ingest model.</text>
  <text x="550" y="298" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">Billed as more GB, not a</text>
  <text x="550" y="314" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">new pricing unit.</text>

  <!-- Uncoil funnel: wide raw spans narrowing to trace = billing + eval unit -->
  <polygon points="660,320 1120,320 1067,400 713,400" fill="#151515" stroke="#FFD400" stroke-width="2" opacity="0.55"/>
  <polygon points="713,400 1067,400 1013,480 767,480" fill="#151515" stroke="#FFD400" stroke-width="2" opacity="0.78"/>
  <polygon points="767,480 1013,480 960,560 820,560" fill="#151515" stroke="#FFD400" stroke-width="2.5"/>

  <text x="890" y="357" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">RAW SPANS</text>
  <text x="890" y="374" font-size="10" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">LLM calls, tool calls, retries</text>

  <text x="890" y="437" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">AGENT TRACE</text>
  <text x="890" y="453" font-size="10" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">one interaction, session-linked</text>

  <text x="890" y="524" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle" font-family="'Geist Mono', monospace">COST + EVAL</text>

  <line x1="820" y1="560" x2="660" y2="600" stroke="#FFD400" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="470" y="590" font-size="11" fill="#FFD400" font-family="'Geist Mono', monospace" text-anchor="end">The trace, not the span,</text>
  <text x="470" y="606" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace" text-anchor="end">is the billing and</text>
  <text x="470" y="622" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace" text-anchor="end">evaluation unit.</text>

  <!-- Bottom insight boxes -->
  <rect x="60" y="620" width="520" height="65" fill="#151515" stroke="#FFFFFF" stroke-width="2"/>
  <text x="80" y="643" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="'Geist Mono', monospace">New Relic: three layers, one meter</text>
  <text x="80" y="662" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">Infra, APM, and AI monitoring share one GB-priced ingest bill.</text>
  <text x="80" y="678" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">Verbose agent payloads just inflate that same meter.</text>

  <rect x="620" y="620" width="520" height="65" fill="#151515" stroke="#FFD400" stroke-width="2"/>
  <text x="640" y="643" font-size="13" font-weight="bold" fill="#FFD400" font-family="'Geist Mono', monospace">Uncoil: one funnel, one price</text>
  <text x="640" y="662" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">Every agent run collapses into a single trace record. Cost</text>
  <text x="640" y="678" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">and evaluation attach there, not to internal span count.</text>
</svg>
