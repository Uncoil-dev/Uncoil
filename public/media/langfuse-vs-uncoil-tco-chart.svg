<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="#000000"/>

  <text x="600" y="44" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Steady-state annual TCO — 100k calls/month, 12 engineers
  </text>
  <text x="600" y="68" font-size="13" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    Platform cost + operations time, year two onward (setup cost excluded)
  </text>

  <!-- axis -->
  <line x1="140" y1="500" x2="1100" y2="500" stroke="#444444" stroke-width="1"/>
  <text x="120" y="505" font-size="11" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$0</text>
  <line x1="140" y1="380" x2="1100" y2="380" stroke="#222222" stroke-width="1"/>
  <text x="120" y="385" font-size="11" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$50k</text>
  <line x1="140" y1="260" x2="1100" y2="260" stroke="#222222" stroke-width="1"/>
  <text x="120" y="265" font-size="11" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$100k</text>
  <line x1="140" y1="140" x2="1100" y2="140" stroke="#222222" stroke-width="1"/>
  <text x="120" y="145" font-size="11" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$150k</text>

  <!-- Bar 1: Langfuse self-hosted $129,600 -->
  <rect x="220" y="188" width="180" height="312" fill="#FFFFFF"/>
  <text x="310" y="172" font-size="20" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$129,600</text>
  <text x="310" y="530" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Langfuse</text>
  <text x="310" y="548" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">self-hosted</text>
  <text x="310" y="568" font-size="11" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">0.6 FTE ops dominates cost</text>

  <!-- Bar 2: Langfuse Cloud $51,000 -->
  <rect x="500" y="378" width="180" height="122" fill="#AAAAAA"/>
  <text x="590" y="362" font-size="20" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$51,000</text>
  <text x="590" y="530" font-size="14" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">Langfuse</text>
  <text x="590" y="548" font-size="14" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">cloud</text>
  <text x="590" y="568" font-size="11" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">Eval still built by hand</text>

  <!-- Bar 3: Uncoil $30,600 -->
  <rect x="780" y="427" width="180" height="73" fill="#FFFF00"/>
  <text x="870" y="411" font-size="20" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$30,600</text>
  <text x="870" y="530" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil</text>
  <text x="870" y="548" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">(all-in)</text>
  <text x="870" y="568" font-size="11" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">Tracing + eval + cost + sessions</text>

  <text x="600" y="595" font-size="12" fill="#777777" text-anchor="middle" font-family="'Geist Mono', monospace">
    Langfuse self-hosted is ~4.2x Uncoil's cost; the gap is engineering operations time, not platform license fees
  </text>
</svg>
