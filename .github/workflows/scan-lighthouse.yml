name: Scan Lighthouse

on:
  schedule:
    - cron: "10 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run Lighthouse
        run: |
          npx --yes @lhci/cli@0.14.0 collect \
            --url=https://www.uncoil.dev/ \
            --url=https://www.uncoil.dev/pricing \
            --url=https://www.uncoil.dev/docs \
            --numberOfRuns=1 \
            --settings.chromeFlags="--no-sandbox --headless=new"
          npx --yes @lhci/cli@0.14.0 upload --target=temporary-public-storage || true
      - name: Open issues for low scores
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scan-lighthouse.mjs --open-issues
