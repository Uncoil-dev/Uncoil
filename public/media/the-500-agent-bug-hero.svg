<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hT hD"><title id="hT">A paper receipt uncoiling from a spool, printing the same failed invoice lookup over and over while the price stamps climb</title><desc id="hD">A black scene with a cream spool of receipt paper on the left. The paper unrolls to the right in a long wave. Each printed line repeats the same call, lookup_invoice with an invoice id that contains a letter O instead of a zero, and the same error. Yellow price stamps beside the lines grow from a few cents to forty-four cents.</desc><rect width="1600" height="640" fill="#0a0a0a"/><text x="70" y="55" fill="#f4d44d" font-family="monospace" font-size="18" text-anchor="start" opacity="1" font-weight="normal" letter-spacing="2">THE $500 AGENT BUG</text><text x="70" y="82" fill="#f6f1e6" font-family="monospace" font-size="13" text-anchor="start" opacity="0.6" font-weight="normal" letter-spacing="0">a demo trace: one repeated call, ninety runs, one weekend</text><polyline points="280.0,340.0 280.4,342.5 280.4,345.0 280.2,347.6 279.6,350.2 278.6,352.7 277.4,355.2 275.8,357.6 273.8,359.8 271.6,361.7 269.1,363.5 266.4,364.9 263.4,366.0 260.3,366.7 257.0,367.1 253.7,367.0 250.3,366.6 247.0,365.7 243.7,364.3 240.6,362.6 237.6,360.5 234.9,358.0 232.5,355.1 230.4,351.9 228.7,348.4 227.4,344.6 226.6,340.7 226.2,336.7 226.4,332.5 227.0,328.4 228.2,324.3 229.9,320.3 232.0,316.5 234.7,313.0 237.8,309.7 241.3,306.8 245.2,304.4 249.5,302.3 254.0,300.9 258.7,299.9 263.6,299.5 268.5,299.7 273.4,300.5 278.3,302.0 283.0,304.0 287.4,306.6 291.6,309.8 295.4,313.5 298.8,317.6 301.7,322.2 304.0,327.2 305.7,332.5 306.8,338.0 307.2,343.6 306.9,349.4 306.0,355.1 304.3,360.7 301.9,366.1 298.9,371.3 295.3,376.1 291.0,380.4 286.2,384.3 280.9,387.6 275.2,390.3 269.2,392.2 262.9,393.5 256.4,393.9 249.9,393.6 243.4,392.5 237.0,390.6 230.9,388.0 225.0,384.5 219.6,380.4 214.6,375.6 210.2,370.2 206.5,364.2 203.5,357.8 201.3,351.0 199.9,343.9 199.3,336.6