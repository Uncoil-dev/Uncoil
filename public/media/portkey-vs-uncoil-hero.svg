<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="46" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Portkey vs Uncoil — where each one sits in the request path
  </text>
  <text x="600" y="72" font-size="14" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    A gateway that moves the request vs. a platform that explains it
  </text>

  <!-- Portkey path: app -> gateway -> providers -->
  <text x="180" y="112" font-size="16" fill="#FFFFFF" font-family="'Geist Mono', monospace" font-weight="bold">Portkey — inline request gateway</text>

  <rect x="60" y="130" width="150" height="60" fill="#0a0a0a" stroke="#666666" stroke-width="1"/>
  <text x="135" y="165" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Your app</text>

  <line x1="210" y1="160" x2="255" y2="160" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowW1)"/>

  <rect x="260" y="120" width="220" height="80" fill="#1a1a08" stroke="#FFFF00" stroke-width="2"/>
  <text x="370" y="148" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Portkey gateway</text>
  <text x="370" y="168" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">route · retry · fail over</text>
  <text x="370" y="185" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">cache · virtual key</text>

  <line x1="480" y1="160" x2="525" y2="160" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowW1)"/>

  <rect x="530" y="115" width="180" height="34" fill="#0a0a0a" stroke="#666666" stroke-width="1"/>
  <text x="620" y="137" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Anthropic</text>
  <rect x="530" y="155" width="180" height="34" fill="#0a0a0a" stroke="#666666" stroke-width="1"/>
  <text x="620" y="177" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">OpenAI</text>
  <rect x="530" y="195" width="180" height="34" fill="#0a0a0a" stroke="#666666" stroke-width="1"/>
  <text x="620" y="217" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Open-weight / local</text>

  <text x="370" y="252" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Every call passes through the gateway.</text>
  <text x="370" y="270" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">It decides *where* the request goes next.</text>

  <line x1="70" y1="300" x2="1130" y2="300" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Uncoil path: app -> providers directly, Uncoil observes -->
  <text x="180" y="336" font-size="16" fill="#FFFFFF" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil — native observability, no gateway hop</text>

  <rect x="60" y="354" width="150" height="60" fill="#0a0a0a" stroke="#666666" stroke-width="1"/>
  <text x="135" y="389" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Your app</text>

  <line x1="210" y1="384" x2="255" y2="384" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowW2)"/>

  <rect x="260" y="339" width="180" height="34" fill="#0a0a0a" stroke="#666666" stroke-width="1"/>
  <text x="350" y="361" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Anthropic</text>
  <rect x="260" y="379" width="180" height="34" fill="#0a0a0a" stroke="#666666" stroke-width="1"/>
  <text x="350" y="401" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">OpenAI</text>
  <rect x="260" y="419" width="180" height="34" fill="#0a0a0a" stroke="#666666" stroke-width="1"/>
  <text x="350" y="441" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Open-weight / local</text>

  <text x="350" y="472" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Calls go straight to the provider —</text>
  <text x="350" y="490" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">no extra network hop, no gateway SPOF.</text>

  <!-- dashed lines up to Uncoil (out of band) -->
  <line x1="135" y1="354" x2="135" y2="330" stroke="#FFFF00" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="350" y1="339" x2="350" y2="330" stroke="#FFFF00" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="135" y1="330" x2="900" y2="330" stroke="#FFFF00" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="350" y1="330" x2="900" y2="330" stroke="#FFFF00" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="900" y1="330" x2="900" y2="360" stroke="#FFFF00" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowY1)"/>

  <rect x="760" y="354" width="280" height="290" fill="#1a1a08" stroke="#FFFF00" stroke-width="2"/>
  <text x="900" y="384" font-size="15" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil (async, out-of-band)</text>
  <text x="900" y="404" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">spans stream in alongside the call</text>

  <rect x="782" y="420" width="236" height="40" fill="#151505" stroke="#666666" stroke-width="1"/>
  <text x="800" y="444" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">Full trace + span tree</text>

  <rect x="782" y="468" width="236" height="40" fill="#151505" stroke="#666666" stroke-width="1"/>
  <text x="800" y="492" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">Evaluation + LLM-as-judge</text>

  <rect x="782" y="516" width="236" height="40" fill="#151505" stroke="#666666" stroke-width="1"/>
  <text x="800" y="540" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">Per-call cost breakdown</text>

  <rect x="782" y="564" width="236" height="40" fill="#151505" stroke="#666666" stroke-width="1"/>
  <text x="800" y="588" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">Experiments + regressions</text>

  <text x="900" y="626" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Observes what happened; does not sit inline</text>

  <text x="600" y="680" font-size="13" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    Portkey changes where the request goes. Uncoil explains what the request did. Most production stacks need both answers.
  </text>

  <defs>
    <marker id="arrowW1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#FFFFFF"/></marker>
    <marker id="arrowW2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#FFFFFF"/></marker>
    <marker id="arrowY1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#FFFF00"/></marker>
  </defs>
</svg>
