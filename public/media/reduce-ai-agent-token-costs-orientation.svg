<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Five cost levers in order: count, trim, reuse, route, cap</title><desc id="d">Five cards in a row connected by arrows. The first, count, is yellow. Each card names a lever and the kind of risk it carries, ordered from no risk to a safety net.</desc><rect width="1600" height="760" fill="#0a0a0a"/><g font-family="monospace"><text x="70" y="150" fill="#f6f1e6" font-size="22" letter-spacing="3">FIVE LEVERS, LOWEST RISK FIRST</text><text x="70" y="190" fill="#f6f1e6" font-size="17">Each lever is only worth pulling once the one before it has been measured.</text><rect x="70" y="250" width="260" height="230" fill="#f4d44d" stroke="#0a0a0a" stroke-width="3"/><text x="94" y="310" fill="#0a0a0a" font-size="30" letter-spacing="3">1. COUNT</text><text x="94" y="360" fill="#0a0a0a" font-size="17">measure tokens per step</text><line x1="94" y1="410" x2="306" y2="410" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="8 6"/><text x="94" y="450" fill="#0a0a0a" font-size="17">no risk</text><path d="M334 365 L366 365" stroke="#f6f1e6" stroke-width="4"/><path d="M358 355 L368 365 L358 375" fill="none" stroke="#f6f1e6" stroke-width="4"/><rect x="370" y="250" width="260" height="230" fill="#f6f1e6" stroke="#0a0a0a" stroke-width="3"/><text x="394" y="310" fill="#0a0a0a" font-size="30" letter-spacing="3">2. TRIM</text><text x="394" y="360" fill="#0a0a0a" font-size="17">send less each step</text><line x1="394" y1="410" x2="606" y2="410" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="8 6"/><text x="394" y="450" fill="#0a0a0a" font-size="17">low risk</text><path d="M634 365 L666 365" stroke="#f6f1e6" stroke-width="4"/><path d="M658 355 L668 365 L658 375" fill="none" stroke="#f6f1e6" stroke-width="4"/><rect x="670" y="250" width="260" height="230" fill="#f6f1e6" stroke="#0a0a0a" stroke-width="3"/><text x="694" y="310" fill="#0a0a0a" font-size="30" letter-spacing="3">3. REUSE</text><text x="694" y="360" fill="#0a0a0a" font-size="17">cache the stable prefix</text><line x1="694" y1="410" x2="906" y2="410" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="8 6"/><text x="694" y="450" fill="#0a0a0a" font-size="17">low risk</text><path d="M934 365 L966 365" stroke="#f6f1e6" stroke-width="4"/><path d="M958 355 L968 365 L958 375" fill="none" stroke="#f6f1e6" stroke-width="4"/><rect x="970" y="250" width="260" height="230" fill="#f6f1e6" stroke="#0a0a0a" stroke-width="3"/><text x="994" y="310" fill="#0a0a0a" font-size="30" letter-spacing="3">4. ROUTE</text><text x="994" y="360" fill="#0a0a0a" font-size="17">match model to step</text><line x1="994" y1="410" x2="1206" y2="410" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="8 6"/><text x="994" y="450" fill="#0a0a0a" font-size="17">needs evals</text><path d="M1234 365 L1266 365" stroke="#f6f1e6" stroke-width="4"/><path d="M1258 355 L1268 365 L1258 375" fill="none" stroke="#f6f1e6" stroke-width="4"/><rect x="1270" y="250" width="260" height="230" fill="#f6f1e6" stroke="#0a0a0a" stroke-width="3"/><text x="1294" y="310" fill="#0a0a0a" font-size="30" letter-spacing="3">5. CAP</text><text x="1294" y="360" fill="#0a0a0a" font-size="17">stop runaway runs</text><line x1="1294" y1="410" x2="1506" y2="410" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="8 6"/><text x="1294" y="450" fill="#0a0a0a" font-size="17">safety net</text></g></svg>