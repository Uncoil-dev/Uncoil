<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="500" fill="#000000"/>

  <text x="600" y="40" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Three Personas, Three Answers
  </text>

  <rect x="60" y="80" width="340" height="360" fill="#0a0a0a" stroke="#8888FF" stroke-width="2"/>
  <text x="230" y="115" font-size="16" fill="#8888FF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">SRE, mixed fleet</text>
  <text x="230" y="140" font-size="11" fill="#AAAAFF" text-anchor="middle" font-family="'Geist Mono', monospace">80 services, 5% agent traffic</text>
  <line x1="90" y1="160" x2="370" y2="160" stroke="#8888FF" stroke-width="1"/>
  <text x="90" y="190" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">Keep New Relic for the</text>
  <text x="90" y="208" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">fleet. Skip Uncoil — agent</text>
  <text x="90" y="226" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">slice too small to matter.</text>
  <text x="230" y="410" font-size="20" fill="#8888FF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">→ New Relic</text>

  <rect x="430" y="80" width="340" height="360" fill="#0a0a0a" stroke="#FFFF00" stroke-width="2"/>
  <text x="600" y="115" font-size="16" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Platform lead, growing agent</text>
  <text x="600" y="140" font-size="11" fill="#CCCC00" text-anchor="middle" font-family="'Geist Mono', monospace">40 services, 35% agent traffic</text>
  <line x1="460" y1="160" x2="740" y2="160" stroke="#FFFF00" stroke-width="1"/>
  <text x="460" y="190" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">Run both. New Relic for the</text>
  <text x="460" y="208" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">fleet, Uncoil for the agent</text>
  <text x="460" y="226" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">slice. Revisit at 12mo growth.</text>
  <text x="600" y="410" font-size="20" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">→ Both</text>

  <rect x="800" y="80" width="340" height="360" fill="#0a0a0a" stroke="#44FF44" stroke-width="2"/>
  <text x="970" y="115" font-size="16" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Founder, agent-native product</text>
  <text x="970" y="140" font-size="11" fill="#88FF88" text-anchor="middle" font-family="'Geist Mono', monospace">3 services, 90% agent traffic</text>
  <line x1="830" y1="160" x2="1110" y2="160" stroke="#44FF44" stroke-width="1"/>
  <text x="830" y="190" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">Uncoil is the whole story.</text>
  <text x="830" y="208" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">New Relic's per-GB billing on</text>
  <text x="830" y="226" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">agent spans has no upside.</text>
  <text x="970" y="410" font-size="20" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">→ Uncoil</text>
</svg>