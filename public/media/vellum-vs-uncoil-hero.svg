<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="45" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Vellum vs Uncoil
  </text>
  <text x="600" y="70" font-size="13" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">
    build-time workflow platform vs. production-time observability platform
  </text>

  <!-- Vellum panel: visual workflow canvas + prompt versioning -->
  <rect x="80" y="95" width="480" height="480" fill="#0a0a0a" stroke="#FFA83D" stroke-width="2"/>
  <text x="320" y="128" font-size="18" fill="#FFA83D" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Vellum — workflow canvas</text>

  <!-- workflow nodes -->
  <rect x="110" y="150" width="120" height="44" fill="#241804" stroke="#FFA83D" stroke-width="1"/>
  <text x="170" y="177" font-size="11" fill="#FFD199" text-anchor="middle" font-family="'Geist Mono', monospace">Input node</text>

  <line x1="230" y1="172" x2="290" y2="172" stroke="#FFA83D" stroke-width="2"/>

  <rect x="290" y="150" width="130" height="44" fill="#241804" stroke="#FFA83D" stroke-width="1"/>
  <text x="355" y="170" font-size="11" fill="#FFD199" text-anchor="middle" font-family="'Geist Mono', monospace">Prompt block</text>
  <text x="355" y="185" font-size="9" fill="#FFA83D" text-anchor="middle" font-family="'Geist Mono', monospace">v7 (active)</text>

  <line x1="420" y1="172" x2="480" y2="172" stroke="#FFA83D" stroke-width="2"/>

  <rect x="480" y="150" width="60" height="44" fill="#241804" stroke="#FFA83D" stroke-width="1"/>
  <text x="510" y="177" font-size="10" fill="#FFD199" text-anchor="middle" font-family="'Geist Mono', monospace">Router</text>

  <line x1="355" y1="194" x2="355" y2="220" stroke="#FFA83D" stroke-width="2"/>

  <rect x="255" y="220" width="200" height="44" fill="#241804" stroke="#FFA83D" stroke-width="1"/>
  <text x="355" y="247" font-size="11" fill="#FFD199" text-anchor="middle" font-family="'Geist Mono', monospace">Tool call: retrieve_docs</text>

  <line x1="355" y1="264" x2="355" y2="290" stroke="#FFA83D" stroke-width="2"/>

  <rect x="270" y="290" width="170" height="44" fill="#241804" stroke="#FFA83D" stroke-width="1"/>
  <text x="355" y="317" font-size="11" fill="#FFD199" text-anchor="middle" font-family="'Geist Mono', monospace">Output node</text>

  <!-- prompt version history -->
  <rect x="110" y="350" width="420" height="90" fill="#151007" stroke="#FFA83D" stroke-width="1"/>
  <text x="130" y="373" font-size="12" fill="#FFA83D" font-family="'Geist Mono', monospace">Prompt version history</text>
  <text x="130" y="394" font-size="11" fill="#FFD199" font-family="'Geist Mono', monospace">v5 → v6: +4pt eval score, reviewed by 2</text>
  <text x="130" y="412" font-size="11" fill="#FFD199" font-family="'Geist Mono', monospace">v6 → v7: -$0.003/call, A/B tested in canvas</text>
  <text x="130" y="430" font-size="11" fill="#FFD199" font-family="'Geist Mono', monospace">v7: deployed to staging environment</text>

  <rect x="110" y="455" width="420" height="95" fill="#151007" stroke="#FFA83D" stroke-width="1"/>
  <text x="130" y="480" font-size="11" fill="#FFD199" font-family="'Geist Mono', monospace">Collaborative development</text>
  <text x="130" y="500" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">PM edits copy · Eng wires tool calls</text>
  <text x="130" y="518" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">Shared canvas, one source of truth</text>
  <text x="130" y="540" font-size="22" fill="#FFA83D" font-family="'Geist Mono', monospace" font-weight="bold">No production traces</text>

  <!-- Uncoil panel: trace viewer + cost dashboard -->
  <rect x="640" y="95" width="480" height="480" fill="#0a0a0a" stroke="#44FF44" stroke-width="2"/>
  <text x="880" y="128" font-size="18" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil — production trace</text>

  <rect x="670" y="150" width="420" height="150" fill="#0f1f0f" stroke="#44FF44" stroke-width="1"/>
  <text x="690" y="173" font-size="12" fill="#88FF88" font-family="'Geist Mono', monospace">run_8f21 · support-agent · 2.4s</text>

  <rect x="690" y="185" width="90" height="14" fill="#44FF44"/>
  <text x="785" y="196" font-size="10" fill="#CCFFCC" font-family="'Geist Mono', monospace">router (40ms)</text>

  <rect x="700" y="205" width="220" height="14" fill="#33CC33"/>
  <text x="925" y="216" font-size="10" fill="#CCFFCC" font-family="'Geist Mono', monospace">llm.call gpt-4 (890ms)</text>

  <rect x="720" y="225" width="140" height="14" fill="#22AA22"/>
  <text x="865" y="236" font-size="10" fill="#CCFFCC" font-family="'Geist Mono', monospace">tool.retrieve_docs (410ms)</text>

  <rect x="700" y="245" width="260" height="14" fill="#44FF44"/>
  <text x="965" y="256" font-size="10" fill="#CCFFCC" font-family="'Geist Mono', monospace">llm.call claude (1.1s)</text>

  <text x="690" y="280" font-size="12" fill="#88FF88" font-family="'Geist Mono', monospace">status: ok · cost: $0.041 · 3 spans</text>

  <rect x="670" y="310" width="420" height="130" fill="#0f1f0f" stroke="#44FF44" stroke-width="1"/>
  <text x="690" y="333" font-size="12" fill="#88FF88" font-family="'Geist Mono', monospace">Cost by model (30 days)</text>
  <rect x="690" y="348" width="180" height="14" fill="#44FF44"/>
  <rect x="690" y="368" width="120" height="14" fill="#33CC33"/>
  <rect x="690" y="388" width="70" height="14" fill="#22AA22"/>
  <text x="690" y="420" font-size="11" fill="#CCFFCC" font-family="'Geist Mono', monospace">$4,210 gpt-4 · $2,840 claude · $960 mixtral</text>

  <rect x="670" y="450" width="420" height="100" fill="#0f1f0f" stroke="#44FF44" stroke-width="1"/>
  <text x="690" y="475" font-size="11" fill="#88FF88" font-family="'Geist Mono', monospace">Evaluation gate: regression-check-v3</text>
  <text x="690" y="495" font-size="11" fill="#CCFFCC" font-family="'Geist Mono', monospace">pass rate 96.2% · 3 alerts this week</text>
  <text x="690" y="530" font-size="22" fill="#44FF44" font-family="'Geist Mono', monospace" font-weight="bold">Full production visibility</text>

  <text x="600" y="640" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    Same LLM lifecycle, different center of gravity
  </text>
  <text x="600" y="662" font-size="13" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    Vellum: iterate before ship. Uncoil: verify after ship.
  </text>
</svg>
