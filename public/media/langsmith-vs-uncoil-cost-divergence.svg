<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#000000"/>

  <!-- Title -->
  <text x="600" y="40" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    LangSmith vs Uncoil: Cost Divergence at Scale
  </text>

  <!-- Axes -->
  <line x1="120" y1="600" x2="1100" y2="600" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="120" y1="100" x2="120" y2="600" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Y-axis labels (Cost) -->
  <text x="100" y="610" font-size="14" fill="#FFFFFF" text-anchor="end">$0</text>
  <text x="100" y="510" font-size="14" fill="#FFFFFF" text-anchor="end">$5K</text>
  <text x="100" y="410" font-size="14" fill="#FFFFFF" text-anchor="end">$10K</text>
  <text x="100" y="310" font-size="14" fill="#FFFFFF" text-anchor="end">$15K</text>

  <!-- X-axis labels (Traces/month) -->
  <text x="180" y="630" font-size="14" fill="#FFFFFF" text-anchor="middle">100K</text>
  <text x="380" y="630" font-size="14" fill="#FFFFFF" text-anchor="middle">1M</text>
  <text x="580" y="630" font-size="14" fill="#FFFFFF" text-anchor="middle">10M</text>
  <text x="780" y="630" font-size="14" fill="#FFFFFF" text-anchor="middle">50M</text>
  <text x="980" y="630" font-size="14" fill="#FFFFFF" text-anchor="middle">100M</text>

  <!-- Axis titles -->
  <text x="600" y="680" font-size="16" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    Monthly Traces
  </text>
  <text x="30" y="350" font-size="16" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" transform="rotate(-90, 30, 350)">
    Monthly Cost
  </text>

  <!-- Grid lines -->
  <line x1="180" y1="100" x2="180" y2="600" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="380" y1="100" x2="380" y2="600" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="580" y1="100" x2="580" y2="600" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="780" y1="100" x2="780" y2="600" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="980" y1="100" x2="980" y2="600" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- LangSmith line (red - steep curve with overages) -->
  <polyline points="180,560 380,480 580,280 780,150 980,80" stroke="#FF4444" stroke-width="3" fill="none"/>

  <!-- Uncoil line (green - flat/shallow) -->
  <polyline points="180,550 380,540 580,530 780,520 980,515" stroke="#44FF44" stroke-width="3" fill="none"/>

  <!-- Legend -->
  <rect x="800" y="120" width="280" height="100" fill="#1a1a1a" stroke="#FFFFFF" stroke-width="1"/>

  <line x1="820" y1="145" x2="860" y2="145" stroke="#FF4444" stroke-width="3"/>
  <text x="880" y="150" font-size="14" fill="#FFFFFF" font-family="'Geist Mono', monospace">
    LangSmith (per-trace overage)
  </text>

  <line x1="820" y1="180" x2="860" y2="180" stroke="#44FF44" stroke-width="3"/>
  <text x="880" y="185" font-size="14" fill="#FFFFFF" font-family="'Geist Mono', monospace">
    Uncoil (flat pricing)
  </text>

  <!-- Annotation: Crossover point -->
  <circle cx="380" cy="510" r="8" fill="none" stroke="#FFFF00" stroke-width="2"/>
  <text x="380" y="460" font-size="13" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">
    Crossover
  </text>
  <text x="380" y="478" font-size="13" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    ~1M traces
  </text>

  <!-- Key insight -->
  <rect x="120" y="30" width="400" height="45" fill="none" stroke="#FFFF00" stroke-width="2"/>
  <text x="320" y="55" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">
    At 100M traces: 22-26x cost difference
  </text>
</svg>