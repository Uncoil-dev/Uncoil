<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="42" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Feature depth by dimension (0-10 scale)
  </text>

  <!-- legend -->
  <rect x="380" y="58" width="16" height="16" fill="#FFA83D"/>
  <text x="402" y="71" font-size="13" fill="#FFA83D" font-family="'Geist Mono', monospace">Vellum</text>
  <rect x="480" y="58" width="16" height="16" fill="#44FF44"/>
  <text x="502" y="71" font-size="13" fill="#44FF44" font-family="'Geist Mono', monospace">Uncoil</text>

  <!-- axis baseline -->
  <line x1="330" y1="105" x2="330" y2="640" stroke="#333333" stroke-width="1"/>

  <!-- Row 1: Workflow composition -->
  <text x="310" y="128" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">Workflow composition</text>
  <rect x="330" y="112" width="324" height="16" fill="#FFA83D"/>
  <text x="664" y="125" font-size="12" fill="#FFA83D" font-family="'Geist Mono', monospace">9 · visual canvas, branching, tool nodes</text>
  <rect x="330" y="132" width="72" height="16" fill="#44FF44"/>
  <text x="412" y="145" font-size="12" fill="#44FF44" font-family="'Geist Mono', monospace">2 · not a builder</text>

  <!-- Row 2: Instrumentation depth -->
  <text x="310" y="196" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">Production instrumentation</text>
  <rect x="330" y="180" width="180" height="16" fill="#FFA83D"/>
  <text x="520" y="193" font-size="12" fill="#FFA83D" font-family="'Geist Mono', monospace">5 · workflow-run logs</text>
  <rect x="330" y="200" width="324" height="16" fill="#44FF44"/>
  <text x="664" y="213" font-size="12" fill="#44FF44" font-family="'Geist Mono', monospace">9 · full span-level tracing at scale</text>

  <!-- Row 3: Testing and evaluation -->
  <text x="310" y="264" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">Testing and evaluation</text>
  <rect x="330" y="248" width="216" height="16" fill="#FFA83D"/>
  <text x="556" y="261" font-size="12" fill="#FFA83D" font-family="'Geist Mono', monospace">6 · dev-time prompt test suites</text>
  <rect x="330" y="268" width="324" height="16" fill="#44FF44"/>
  <text x="664" y="281" font-size="12" fill="#44FF44" font-family="'Geist Mono', monospace">9 · LLM-as-judge, regression gates</text>

  <!-- Row 4: Cost tracking -->
  <text x="310" y="332" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">Production cost tracking</text>
  <rect x="330" y="316" width="144" height="16" fill="#FFA83D"/>
  <text x="484" y="329" font-size="12" fill="#FFA83D" font-family="'Geist Mono', monospace">4 · execution counts only</text>
  <rect x="330" y="336" width="324" height="16" fill="#44FF44"/>
  <text x="664" y="349" font-size="12" fill="#44FF44" font-family="'Geist Mono', monospace">9 · per-call, per-session cost</text>

  <!-- Row 5: Deployment -->
  <text x="310" y="400" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">Deployment and hosting</text>
  <rect x="330" y="384" width="324" height="16" fill="#FFA83D"/>
  <text x="664" y="397" font-size="12" fill="#FFA83D" font-family="'Geist Mono', monospace">9 · workflow-to-endpoint in one click</text>
  <rect x="330" y="404" width="108" height="16" fill="#44FF44"/>
  <text x="448" y="417" font-size="12" fill="#44FF44" font-family="'Geist Mono', monospace">3 · not a deployment target</text>

  <!-- Row 6: Multi-agent session tracking -->
  <text x="310" y="468" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">Multi-turn session tracking</text>
  <rect x="330" y="452" width="144" height="16" fill="#FFA83D"/>
  <text x="484" y="465" font-size="12" fill="#FFA83D" font-family="'Geist Mono', monospace">4 · single-workflow scope</text>
  <rect x="330" y="472" width="324" height="16" fill="#44FF44"/>
  <text x="664" y="485" font-size="12" fill="#44FF44" font-family="'Geist Mono', monospace">9 · native cross-call sessions</text>

  <!-- Row 7: Collaborative iteration -->
  <text x="310" y="536" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">Non-engineer collaboration</text>
  <rect x="330" y="520" width="288" height="16" fill="#FFA83D"/>
  <text x="628" y="533" font-size="12" fill="#FFA83D" font-family="'Geist Mono', monospace">8 · PMs edit prompts directly</text>
  <rect x="330" y="540" width="108" height="16" fill="#44FF44"/>
  <text x="448" y="553" font-size="12" fill="#44FF44" font-family="'Geist Mono', monospace">3 · engineering-facing dashboards</text>

  <text x="600" y="610" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    Vellum wins composition and deployment; Uncoil wins production depth
  </text>
  <text x="600" y="632" font-size="13" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    Neither profile is "more advanced" overall — they optimize different stages
  </text>
</svg>
