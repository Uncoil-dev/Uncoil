[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uncoil-sdk"
version = "0.6.0"
authors = [
  { name="Uncoil Team", email="hello@uncoil.dev" },
]
description = "Observability, runtime enforcement, and tracing for AI agents."
license = "MIT"
keywords = ["ai", "agents", "observability", "tracing", "llm", "llm-observability", "agent-tracing", "opentelemetry", "cost-tracking", "langchain", "openai", "anthropic"]
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
    "httpx>=0.24.0",
]

[project.scripts]
uncoil-doctor = "uncoil.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://www.uncoil.dev"
"Documentation" = "https://www.uncoil.dev/docs"
"Bug Tracker" = "https://github.com/Uncoil-dev/Uncoil/issues"
"Source" = "https://github.com/Uncoil-dev/Uncoil"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
langgraph = ["langchain-core>=0.2", "langgraph>=0.2"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx2==2.13.1", "openai==3.31.0", "anthropic==1.14.0", "langgraph==1.2.15", "langchain-core==1.6.10"]
