<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">A request budget drawn as one bar with five input lines and a yellow reserved answer block</title><desc id="d">One wide bar is split into system, tools, history, retrieved, user and a yellow answer reserve.</desc><rect width="1600" height="760" fill="#0a0a0a"/><g font-family="monospace"><text x="100" y="90" fill="#f4d44d" font-size="20" letter-spacing="2">ONE REQUEST, ONE PLAN</text><rect x="100" y="300" width="130" height="150" fill="#1c1c1c" stroke="#f6f1e6" stroke-width="2"/><text x="165.0" y="380.0" fill="#f6f1e6" font-size="15" text-anchor="middle">SYSTEM</text><rect x="230" y="300" width="170" height="150" fill="#1c1c1c" stroke="#f6f1e6" stroke-width="2"/><text x="315.0" y="380.0" fill="#f6f1e6" font-size="15" text-anchor="middle">TOOLS</text><rect x="400" y="300" width="340" height="150" fill="#1c1c1c" stroke="#f6f1e6" stroke-width="2"/><text x="570.0" y="380.0" fill="#f6f1e6" font-size="15" text-anchor="middle">HISTORY</text><rect x="740" y="300" width="260" height="150" fill="#1c1c1c" stroke="#f6f1e6" stroke-width="2"/><text x="870.0" y="380.0" fill="#f6f1e6" font-size="15" text-anchor="middle">RETRIEVED</text><rect x="1000" y="300" width="90" height="150" fill="#1c1c1c" stroke="#f6f1e6" stroke-width="2"/><text x="1045.0" y="380.0" fill="#f6f1e6" font-size="15" text-anchor="middle">USER</text><rect x="1090" y="300" width="410" height="150" fill="#f4d44d" stroke="#f6f1e6" stroke-width="2"/><text x="1295.0" y="380.0" fill="#0a0a0a" font-size="15" text-anchor="middle">ANSWER RESERVE</text><text x="100" y="520" fill="#f6f1e6" font-size="16">Reserve, allocate, trim, escalate</text></g></svg>