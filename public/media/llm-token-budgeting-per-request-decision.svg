<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">A decision flow from assembling a prompt to sending, routing, summarizing or rejecting</title><desc id="d">Boxes show assemble, compare to ceiling, trim to floors, check fit, then send fit, send trimmed, or route, summarize or reject.</desc><rect width="1600" height="760" fill="#f6f1e6"/><g font-family="monospace"><text x="100" y="80" fill="#0a0a0a" font-size="20" letter-spacing="2">DECISION FLOW FOR ONE REQUEST</text><rect x="100" y="200" width="260" height="90" fill="#f6f1e6" stroke="#0a0a0a" stroke-width="2"/><text x="230.0" y="250.0" fill="#0a0a0a" font-size="15" text-anchor="middle">assemble prompt</text><rect x="450" y="200" width="260" height="90" fill="#f6f1e6" stroke="#0a0a0a" stroke-width="2"/><text x="580.0" y="250.0" fill="#0a0a0a" font-size="15" text-anchor="middle">over ceiling?</text><rect x="800" y="200" width="300" height="90" fill="#f4d44d" stroke="#0a0a0a" stroke-width="2"/><text x="950.0" y="250.0" fill="#0a0a0a" font-size="15" text-anchor="middle">trim to floors in order</text><rect x="1190" y="200" width="260" height="90" fill="#f6f1e6" stroke="#0a0a0a" stroke-width="2"/><text x="1320.0" y="250.0" fill="#0a0a0a" font-size="15" text-anchor="middle">fits now?</text><line x1="360" y1="245" x2="450" y2="245" stroke="#0a0a0a" stroke-width="3"/><line x1="710" y1="245" x2="800" y2="245" stroke="#0a0a0a" stroke-width="3"/><line x1="1100" y1="245" x2="1190" y2="245" stroke="#0a0a0a" stroke-width="3"/><rect x="450" y="420" width="260" height="90" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="2"/><text x="580.0" y="470.0" fill="#f6f1e6" font-size="15" text-anchor="middle">send: fit</text><rect x="1190" y="420" width="260" height="90" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="2"/><text x="1320.0" y="470.0" fill="#f6f1e6" font-size="15" text-anchor="middle">send: trimmed</text><rect x="800" y="600" width="650" height="90" fill="#f6f1e6" stroke="#0a0a0a" stroke-width="2"/><text x="1125.0" y="650.0" fill="#0a0a0a" font-size="15" text-anchor="middle">route, summarize or reject, then record verdict</text><line x1="580" y1="290" x2="580" y2="420" stroke="#0a0a0a" stroke-width="3"/><line x1="1320" y1="290" x2="1320" y2="420" stroke="#0a0a0a" stroke-width="3"/><line x1="1320" y1="510" x2="1320" y2="600" stroke="#0a0a0a" stroke-width="3"/><text x="595" y="365" fill="#0a0a0a" font-size="14">no</text><text x="590" y="228" fill="#0a0a0a" font-size="14"> </text><text x="1335" y="365" fill="#0a0a0a" font-size="14">yes</text><text x="1335" y="560" fill="#0a0a0a" font-size="14">no</text></g></svg>