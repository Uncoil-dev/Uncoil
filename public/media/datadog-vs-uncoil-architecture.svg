<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="42" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Ingestion Pipeline: Datadog vs Uncoil
  </text>

  <!-- Column headers -->
  <text x="290" y="82" font-size="17" fill="#FF6B6B" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Datadog (span-first)</text>
  <text x="900" y="82" font-size="17" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil (trace-first)</text>

  <!-- Datadog pipeline boxes -->
  <rect x="130" y="110" width="320" height="50" fill="#1a1a1a" stroke="#FF6B6B" stroke-width="2"/>
  <text x="290" y="140" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Agent code (OTel / dd-trace SDK)</text>

  <line x1="290" y1="160" x2="290" y2="190" stroke="#FF6B6B" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="130" y="190" width="320" height="50" fill="#1a1a1a" stroke="#FF6B6B" stroke-width="2"/>
  <text x="290" y="220" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Datadog Agent (per-host collector)</text>

  <line x1="290" y1="240" x2="290" y2="270" stroke="#FF6B6B" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="130" y="270" width="320" height="50" fill="#1a1a1a" stroke="#FF6B6B" stroke-width="2"/>
  <text x="290" y="300" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Intake API (span-by-span ingest)</text>

  <line x1="290" y1="320" x2="290" y2="350" stroke="#FF6B6B" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="130" y="350" width="320" height="60" fill="#1a1a1a" stroke="#FF6B6B" stroke-width="2"/>
  <text x="290" y="376" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">APM backend</text>
  <text x="290" y="396" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">spans + custom metrics + logs</text>

  <line x1="290" y1="410" x2="290" y2="440" stroke="#FF6B6B" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="130" y="440" width="320" height="60" fill="#2a1414" stroke="#FF6B6B" stroke-width="2"/>
  <text x="290" y="466" font-size="14" fill="#FF6B6B" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Billing meter</text>
  <text x="290" y="486" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">per ingested span + per custom metric</text>

  <!-- Uncoil pipeline boxes -->
  <rect x="740" y="110" width="320" height="50" fill="#0f1a0f" stroke="#44FF44" stroke-width="2"/>
  <text x="900" y="140" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil SDK (Python / Node / TS)</text>

  <line x1="900" y1="160" x2="900" y2="190" stroke="#44FF44" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="740" y="190" width="320" height="50" fill="#0f1a0f" stroke="#44FF44" stroke-width="2"/>
  <text x="900" y="220" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">POST /api/ingest</text>

  <line x1="900" y1="240" x2="900" y2="270" stroke="#44FF44" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="740" y="270" width="320" height="50" fill="#0f1a0f" stroke="#44FF44" stroke-width="2"/>
  <text x="900" y="300" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Inngest (async grouping by trace)</text>

  <line x1="900" y1="320" x2="900" y2="350" stroke="#44FF44" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="740" y="350" width="150" height="60" fill="#0f1a0f" stroke="#44FF44" stroke-width="2"/>
  <text x="815" y="376" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Tinybird</text>
  <text x="815" y="394" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">raw spans</text>

  <rect x="910" y="350" width="150" height="60" fill="#0f1a0f" stroke="#44FF44" stroke-width="2"/>
  <text x="985" y="376" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Convex</text>
  <text x="985" y="394" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">run summaries</text>

  <line x1="815" y1="410" x2="900" y2="440" stroke="#44FF44" stroke-width="2"/>
  <line x1="985" y1="410" x2="900" y2="440" stroke="#44FF44" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="740" y="440" width="320" height="60" fill="#142a14" stroke="#44FF44" stroke-width="2"/>
  <text x="900" y="466" font-size="14" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Billing meter</text>
  <text x="900" y="486" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">once per complete trace (interaction)</text>

  <!-- markers -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FF6B6B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#44FF44"/>
    </marker>
  </defs>

  <!-- Bottom summary -->
  <rect x="130" y="560" width="930" height="100" fill="#1a1a1a" stroke="#FFFF00" stroke-width="2"/>
  <text x="150" y="586" font-size="14" fill="#FFFF00" font-weight="bold" font-family="'Geist Mono', monospace">Where the billing unit diverges:</text>
  <text x="150" y="610" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">Datadog meters at the intake API, before spans are grouped -- every LLM call, tool call, and retry is a separate billable span.</text>
  <text x="150" y="632" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">Uncoil meters after Inngest groups spans into one trace -- an agent interaction with 15 internal spans is still one billing event.</text>
</svg>
