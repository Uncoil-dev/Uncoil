<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="500" fill="#000000"/>

  <text x="600" y="40" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    The hybrid loop: design in Vellum, observe in Uncoil
  </text>

  <!-- Stage 1: Vellum design -->
  <rect x="50" y="90" width="230" height="140" fill="#151007" stroke="#FFA83D" stroke-width="2"/>
  <text x="165" y="118" font-size="14" fill="#FFA83D" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">1. Design (Vellum)</text>
  <text x="70" y="145" font-size="11" fill="#FFD199" font-family="'Geist Mono', monospace">Build workflow on canvas</text>
  <text x="70" y="165" font-size="11" fill="#FFD199" font-family="'Geist Mono', monospace">Version prompt: v6 → v7</text>
  <text x="70" y="185" font-size="11" fill="#FFD199" font-family="'Geist Mono', monospace">Run offline eval suite</text>
  <text x="70" y="205" font-size="11" fill="#FFD199" font-family="'Geist Mono', monospace">PM + eng review together</text>

  <line x1="280" y1="160" x2="350" y2="160" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- Stage 2: Deploy -->
  <rect x="350" y="90" width="200" height="140" fill="#0a0a0a" stroke="#FFFFFF" stroke-width="2"/>
  <text x="450" y="118" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">2. Deploy</text>
  <text x="370" y="145" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">Vellum publishes v7</text>
  <text x="370" y="165" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">as a hosted endpoint</text>
  <text x="370" y="195" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">App calls that endpoint,</text>
  <text x="370" y="215" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">instrumented with Uncoil SDK</text>

  <line x1="550" y1="160" x2="620" y2="160" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- Stage 3: Uncoil observe -->
  <rect x="620" y="90" width="230" height="140" fill="#0f1f0f" stroke="#44FF44" stroke-width="2"/>
  <text x="735" y="118" font-size="14" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">3. Observe (Uncoil)</text>
  <text x="640" y="145" font-size="11" fill="#CCFFCC" font-family="'Geist Mono', monospace">Trace every production call</text>
  <text x="640" y="165" font-size="11" fill="#CCFFCC" font-family="'Geist Mono', monospace">Track cost per session</text>
  <text x="640" y="185" font-size="11" fill="#CCFFCC" font-family="'Geist Mono', monospace">Run regression evaluations</text>
  <text x="640" y="205" font-size="11" fill="#CCFFCC" font-family="'Geist Mono', monospace">Alert on quality drops</text>

  <line x1="850" y1="160" x2="920" y2="160" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- Stage 4: Findings -->
  <rect x="920" y="90" width="230" height="140" fill="#0a0a0a" stroke="#FFFF00" stroke-width="2"/>
  <text x="1035" y="118" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">4. Findings</text>
  <text x="940" y="145" font-size="11" fill="#FFFFAA" font-family="'Geist Mono', monospace">"gpt-4 routes cost 3x</text>
  <text x="940" y="163" font-size="11" fill="#FFFFAA" font-family="'Geist Mono', monospace">more, quality flat"</text>
  <text x="940" y="190" font-size="11" fill="#FFFFAA" font-family="'Geist Mono', monospace">"tool call fails 4% on</text>
  <text x="940" y="208" font-size="11" fill="#FFFFAA" font-family="'Geist Mono', monospace">long context inputs"</text>

  <!-- feedback loop back to Vellum -->
  <path d="M 1035 235 C 1035 340, 165 340, 165 235" stroke="#FFFF00" stroke-width="2" fill="none" stroke-dasharray="6,5" marker-end="url(#arrowY)"/>
  <text x="600" y="330" font-size="13" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    Findings become the next prompt version — loop repeats
  </text>

  <text x="600" y="400" font-size="13" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">
    Vellum owns steps 1-2 (author, version, deploy). Uncoil owns steps 3-4 (measure, learn).
  </text>
  <text x="600" y="422" font-size="13" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">
    Neither platform needs to do the other's job for the loop to close.
  </text>

  <defs>
    <marker id="arrowW" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/>
    </marker>
    <marker id="arrowY" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FFFF00"/>
    </marker>
  </defs>
</svg>
