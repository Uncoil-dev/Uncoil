<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="46" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Illustrative monthly cost — 50,000 requests/month
  </text>
  <text x="600" y="72" font-size="13" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    Worked example: platform spend plus the engineering time each approach requires. Not vendor list pricing.
  </text>

  <!-- Gridlines -->
  <line x1="150" y1="560" x2="1050" y2="560" stroke="#FFFFFF" stroke-width="2"/>
  <g font-family="'Geist Mono', monospace" font-size="12" fill="#666666">
    <line x1="150" y1="560" x2="1050" y2="560" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="150" y1="460" x2="1050" y2="460" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="150" y1="360" x2="1050" y2="360" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="150" y1="260" x2="1050" y2="260" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="150" y1="160" x2="1050" y2="160" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="140" y="565" text-anchor="end">$0</text>
    <text x="140" y="465" text-anchor="end">$1,000</text>
    <text x="140" y="365" text-anchor="end">$2,000</text>
    <text x="140" y="265" text-anchor="end">$3,000</text>
    <text x="140" y="165" text-anchor="end">$4,000</text>
  </g>

  <!-- Latitude stacked bar: platform 450, manual eval eng time 3000, cost-tracking glue 350 -->
  <!-- scale: 100px per $1000 -->
  <rect x="260" y="525" width="220" height="35" fill="#444444" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="260" y="225" width="220" height="300" fill="#FFFF00" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="260" y="190" width="220" height="35" fill="#888888" stroke="#FFFFFF" stroke-width="1"/>

  <text x="370" y="170" font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$3,800/mo</text>
  <text x="370" y="600" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Latitude + external eval stack</text>
  <text x="370" y="620" font-size="12" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">$45,600/yr</text>

  <!-- Uncoil stacked bar: platform 950, ops/maintenance 600 -->
  <rect x="720" y="500" width="220" height="60" fill="#FFFFFF" stroke="#FFFF00" stroke-width="1"/>
  <rect x="720" y="405" width="220" height="95" fill="#888888" stroke="#FFFF00" stroke-width="1"/>

  <text x="830" y="385" font-size="18" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$1,550/mo</text>
  <text x="830" y="600" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil (integrated pipeline)</text>
  <text x="830" y="620" font-size="12" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">$18,600/yr</text>

  <!-- Legend -->
  <rect x="150" y="645" width="16" height="16" fill="#444444"/>
  <text x="174" y="658" font-size="12" fill="#CCCCCC" font-family="'Geist Mono', monospace">Platform / tracing</text>

  <rect x="360" y="645" width="16" height="16" fill="#FFFF00"/>
  <text x="384" y="658" font-size="12" fill="#CCCCCC" font-family="'Geist Mono', monospace">Manual eval engineering time (Latitude path)</text>

  <rect x="740" y="645" width="16" height="16" fill="#888888"/>
  <text x="764" y="658" font-size="12" fill="#CCCCCC" font-family="'Geist Mono', monospace">Ops / maintenance (Uncoil path)</text>

  <text x="1040" y="658" font-size="12" fill="#666666" font-family="'Geist Mono', monospace" text-anchor="end">2.5x apart</text>
</svg>
