name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, commit or deployment you are using.
  - type: dropdown
    id: sdk
    attributes:
      label: SDK
      options:
        - TypeScript SDK
        - Python SDK
        - Not using an SDK
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets or API keys before pasting.
