<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lamUncoilHeroTitle">
  <title id="lamUncoilHeroTitle">Same LLM call traced two ways: Laminar compresses every field to 0.7 KB average, dropping precision and truncating output, while Uncoil stores the same call at 3.5 KB average with every field intact</title>
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="46" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    ONE TRACE, TWO STORAGE STRATEGIES
  </text>
  <text x="600" y="72" font-size="14" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">
    Same agent call: a loan-routing decision with a tool lookup
  </text>

  <!-- Laminar column -->
  <rect x="50" y="100" width="530" height="40" fill="#552222" stroke="#FF4444" stroke-width="1"/>
  <text x="315" y="126" font-size="18" font-weight="bold" fill="#FF6666" text-anchor="middle" font-family="'Geist Mono', monospace">LAMINAR — COMPRESSED</text>

  <!-- Uncoil column -->
  <rect x="620" y="100" width="530" height="40" fill="#224422" stroke="#44FF44" stroke-width="1"/>
  <text x="885" y="126" font-size="18" font-weight="bold" fill="#66FF66" text-anchor="middle" font-family="'Geist Mono', monospace">UNCOIL — FULL FIDELITY</text>

  <!-- Row backgrounds -->
  <rect x="50" y="150" width="530" height="410" fill="#0a0a0a" stroke="#552222" stroke-width="1"/>
  <rect x="620" y="150" width="530" height="410" fill="#0a0a0a" stroke="#224422" stroke-width="1"/>

  <!-- Row 1: timestamp -->
  <text x="66" y="176" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">timestamp</text>
  <text x="66" y="195" font-size="13" fill="#FF8888" font-family="'Geist Mono', monospace">bucketed to the minute, ms lost</text>
  <text x="636" y="176" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">timestamp</text>
  <text x="636" y="195" font-size="13" fill="#AAFFAA" font-family="'Geist Mono', monospace">2026-08-14T09:12:03.482Z exact</text>
  <line x1="50" y1="207" x2="580" y2="207" stroke="#331515" stroke-width="1"/>
  <line x1="620" y1="207" x2="1150" y2="207" stroke="#133313" stroke-width="1"/>

  <!-- Row 2: input -->
  <text x="66" y="230" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">input</text>
  <text x="66" y="249" font-size="13" fill="#FF8888" font-family="'Geist Mono', monospace">envelope dropped, prompt hash only</text>
  <text x="636" y="230" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">input</text>
  <text x="636" y="249" font-size="13" fill="#AAFFAA" font-family="'Geist Mono', monospace">full prompt text, 612 tokens</text>
  <line x1="50" y1="261" x2="580" y2="261" stroke="#331515" stroke-width="1"/>
  <line x1="620" y1="261" x2="1150" y2="261" stroke="#133313" stroke-width="1"/>

  <!-- Row 3: output -->
  <text x="66" y="284" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">output</text>
  <text x="66" y="303" font-size="13" fill="#FF8888" font-family="'Geist Mono', monospace">truncated at 100 characters</text>
  <text x="636" y="284" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">output</text>
  <text x="636" y="303" font-size="13" fill="#AAFFAA" font-family="'Geist Mono', monospace">full response text, 512 tokens</text>
  <line x1="50" y1="315" x2="580" y2="315" stroke="#331515" stroke-width="1"/>
  <line x1="620" y1="315" x2="1150" y2="315" stroke="#133313" stroke-width="1"/>

  <!-- Row 4: tool_result -->
  <text x="66" y="338" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">tool_result</text>
  <text x="66" y="357" font-size="13" fill="#FF8888" font-family="'Geist Mono', monospace">first / last array element only</text>
  <text x="636" y="338" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">tool_result</text>
  <text x="636" y="357" font-size="13" fill="#AAFFAA" font-family="'Geist Mono', monospace">complete nested result, 14 fields</text>
  <line x1="50" y1="369" x2="580" y2="369" stroke="#331515" stroke-width="1"/>
  <line x1="620" y1="369" x2="1150" y2="369" stroke="#133313" stroke-width="1"/>

  <!-- Row 5: token_counts -->
  <text x="66" y="392" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">token_counts</text>
  <text x="66" y="411" font-size="13" fill="#FF8888" font-family="'Geist Mono', monospace">rounded to the nearest 10</text>
  <text x="636" y="392" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">token_counts</text>
  <text x="636" y="411" font-size="13" fill="#AAFFAA" font-family="'Geist Mono', monospace">exact: 612 in / 512 out</text>
  <line x1="50" y1="423" x2="580" y2="423" stroke="#331515" stroke-width="1"/>
  <line x1="620" y1="423" x2="1150" y2="423" stroke="#133313" stroke-width="1"/>

  <!-- Row 6: routing_probability -->
  <text x="66" y="446" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">routing_probability</text>
  <text x="66" y="465" font-size="13" fill="#FF8888" font-family="'Geist Mono', monospace">omitted, not stored</text>
  <text x="636" y="446" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">routing_probability</text>
  <text x="636" y="465" font-size="13" fill="#AAFFAA" font-family="'Geist Mono', monospace">0.87, model A over model B</text>
  <line x1="50" y1="477" x2="580" y2="477" stroke="#331515" stroke-width="1"/>
  <line x1="620" y1="477" x2="1150" y2="477" stroke="#133313" stroke-width="1"/>

  <!-- Row 7: latency -->
  <text x="66" y="500" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">latency</text>
  <text x="66" y="519" font-size="13" fill="#FF8888" font-family="'Geist Mono', monospace">single binned aggregate</text>
  <text x="636" y="500" font-size="12" fill="#888888" font-family="'Geist Mono', monospace">latency</text>
  <text x="636" y="519" font-size="13" fill="#AAFFAA" font-family="'Geist Mono', monospace">route 340ms / llm 8.5s / tool 1.2s</text>

  <!-- Size badges -->
  <rect x="50" y="580" width="530" height="60" fill="none" stroke="#FF4444" stroke-width="2"/>
  <text x="315" y="608" font-size="16" fill="#FF6666" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">0.7 KB average per trace</text>
  <text x="315" y="628" font-size="12" fill="#CC8888" text-anchor="middle" font-family="'Geist Mono', monospace">cannot be decompressed or replayed</text>

  <rect x="620" y="580" width="530" height="60" fill="none" stroke="#44FF44" stroke-width="2"/>
  <text x="885" y="608" font-size="16" fill="#66FF66" text-anchor="middle" font-weight="bold" font-family="'Geist Mono', monospace">3.5 KB average per trace</text>
  <text x="885" y="628" font-size="12" fill="#88CC88" text-anchor="middle" font-family="'Geist Mono', monospace">queryable, evaluable, and exact</text>

  <text x="600" y="672" font-size="13" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    5x smaller storage footprint vs. 5x the detail available for evaluation and debugging
  </text>
</svg>
