title: Remake the Uncoil dashboard
summary: Redesign and rebuild the Uncoil dashboard with a cleaner layout, improved overview, and working charts — all verified end-to-end.
tools:
  builtin:
    - grep
    - ls
    - cat
    - rg
    - git
  read:
    - path: ./src/app/\(frontend\)/dashboard/page.tsx
    - path: ./src/components/dashboard/dashboard-shell.tsx
    - path: ./src/components/dashboard/dashboard-sidebar.tsx
    - path: ./src/components/dashboard/dashboard-topbar.tsx
    - path: ./src/components/dashboard/dashboard-overview.tsx
    - path: ./src/components/dashboard/dashboard-primitives.tsx
    - path: ./src/components/dashboard/runs-table.tsx
    - path: ./src/components/dashboard/orchestration-savings.tsx
    - path: ./src/components/dashboard/fail-open-alert.tsx
    - path: ./src/components/dashboard/analytics-refresh-control.tsx
    - path: ./convex/schema.ts
    - path: ./src/hooks/use-project-stats.ts
    - path: ./src/components/ui/card.tsx
    - path: ./src/components/ui/button.tsx
    - path: ./src/components/ui/input.tsx
    - path: ./src/components/ui/skeleton.tsx
    - path: ./src/components/ui/dialog.tsx
    - path: ./src/components/ui/pagination.tsx
    - path: ./src/components/ui/badge.tsx
    - path: ./src/components/ui/dropdown-menu.tsx
    - path: ./src/lib/utils.ts
    - path: ./src/lib/regions.ts
    - path: ./package.json
    - path: ./.github/workflows/release.yml
    - path: ./AGENTS.md
    - path: ./.agents/skills/convex-setup-auth/agents/openai.yaml
  write:
    - path: ./src/app/\(frontend\)/dashboard/page.tsx
    - path: ./src/components/dashboard/dashboard-shell.tsx
    - path: ./src/components/dashboard/dashboard-sidebar.tsx
    - path: ./src/components/dashboard/dashboard-topbar.tsx
    - path: ./src/components/dashboard/dashboard-overview.tsx
    - path: ./src/components/dashboard/dashboard-primitives.tsx
    - path: ./src/components/dashboard/runs-table.tsx
    - path: ./src/components/dashboard/orchestration-savings.tsx
    - path: ./src/components/dashboard/fail-open-alert.tsx
    - path: ./src/components/dashboard/analytics-refresh-control.tsx
    - path: ./src/hooks/use-project-stats.ts
    - path: ./src/lib/utils.ts
    - path: ./src/lib/format-graph-currency.ts
    - path: ./.github/workflows/release.yml
  terminal:
    - command: npm run typecheck
      timeout: 180000
    - command: npm run build
      timeout: 180000
    - command: npm run lint
      timeout: 120000
    - command: cd convex && npx convex codegen 2>&1 | tail -20
      timeout: 120000
    - command: git diff --stat
      timeout: 30000
    - command: git log --oneline -5
      timeout: 30000
    - command: cat package.json | python3 -c "import sys,json; d=json.load(sys.stdin); [print(f'{k}: {v}') for k,v in sorted(d.get('dependencies',{}).items())]"
      timeout: 30000

agent:
  model: gpt-6-astra
  permission_mode: YOLO

hooks:
  after_agent_loop:
    - cmd: npm run typecheck 2>&1 | tail -30
      timeout: 180000
    - cmd: npm run build 2>&1 | tail -30
      timeout: 180000
    - cmd: cd convex && npx convex codegen 2>&1 | tail -20
      timeout: 120000

plan:
  - Read the entire current dashboard: shell, sidebar, topbar, overview page, primitives, runs-table, orchestration-savings, fail-open-alert, analytics-refresh-control, use-project-stats hook.
  - Read convex/schema.ts to understand the data model.
  - Read package.json to confirm the design system.
  - Read AGENTS.md and the convex-setup-auth agent yaml for conventions.
  - Design a cleaner dashboard: keep the existing route structure and Convex queries intact, but rewrite the UI layer (shell/sidebar/topbar/overview) to be simpler, more cohesive, and better organized.
  - Replace the current dashboard shell, sidebar, topbar, and overview page with the new versions — replace files in place, don't add parallel files.
  - Keep all existing component imports that still work; only change what's needed.
  - When rewriting overview, preserve all Convex queries and the useProjectStats hook.
  - Create a new utility module for formatGraphCurrency and related formatting helpers if not already present.
  - Ensure every changed file typechecks and the full project builds cleanly.
  - Run typecheck, build, and lint. Fix any errors in the files you changed.
  - Commit the changes on the current branch (codex/dashboard-redesign) with a clear commit message.
  - Push the branch to origin.
  - Create a draft PR from the branch to main using gh pr create.
  - Report the PR URL and what changed.

rules:
  - Do NOT change Convex schema, Convex queries, or API routes — only the UI layer.
  - Do NOT remove any existing dashboard routes (runs, costs, evaluation, sessions, traces, settings, docs, manage, etc.).
  - Do NOT delete any existing components unless you're replacing them in the same commit.
  - Do NOT change package.json dependencies.
  - Keep the same design tokens: cream (#fafaf9), yellow (#eab308), black (#000000), zinc scales, Geist fonts, 0 border-radius, font-mono throughout.
  - Keep the same color class conventions: border-zinc-800, bg-zinc-900, text-zinc-100, text-zinc-400, hover:bg-zinc-800, etc.
  - Keep the same sidebar widths (48px collapsed, 184px expanded) and the same localStorage keys for collapsed state.
  - Keep the same topbar structure (org switcher, project menu, docs/help, settings, logout).
  - Keep responsive behavior: mobile sidebar overlay, desktop sidebar rail.
  - Preserve shadcn component usage (Card, Button, Input, Skeleton, Dialog, Badge, DropdownMenu) with the same import paths.
  - Preserve Recharts usage (ResponsiveContainer, LineChart, Bar, ComposedChart, etc.) with the same import paths.
  - Preserve all lucide-react icon imports currently used.
  - If anything is unclear, read the file first — don't guess.
  - When in doubt about whether a change is safe, read the importing file.
  - Commit atomically: one commit for the whole dashboard redesign, with a descriptive message.
  - Push only after a successful build.
  - The PR must be a draft.

dos:
  - Read every file you're going to modify before modifying it.
  - Run typecheck after every batch of related changes.
  - Run full build before committing.
  - Run lint and fix any issues in files you touched.
  - Commit with a clear, conventional commit message.
  - Push and create a draft PR in the same agent loop iteration.

donts:
  - Don't create new parallel dashboard files — replace the existing ones in place.
  - Don't change route paths or add new routes.
  - Don't modify Convex code (schema, queries, mutations, http endpoints).
  - Don't change auth, onboarding, or billing flows.
  - Don't touch packages/ (TS SDK, Python SDK).
  - Don't change CI workflows except the release workflow if needed for the dashboard.
  - Don't add new npm dependencies.
  - Don't ship broken builds — if build fails, fix it before committing.
