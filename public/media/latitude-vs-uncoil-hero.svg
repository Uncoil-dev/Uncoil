<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="48" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Latitude vs Uncoil — where each pipeline ends
  </text>
  <text x="600" y="76" font-size="14" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    Deep framework-execution tracing vs. one pipeline for tracing, evaluation, cost, and experiments
  </text>

  <!-- Latitude pipeline -->
  <rect x="60" y="110" width="500" height="470" fill="#0a0a0a" stroke="#FFFFFF" stroke-width="2"/>
  <text x="310" y="142" font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Latitude — framework-native tracer</text>
  <text x="310" y="163" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Built to explain agent decisions during development</text>

  <rect x="90" y="185" width="440" height="58" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="110" y="212" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">Agent runtime (your framework: graph, crew,</text>
  <text x="110" y="230" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">or custom orchestration)</text>

  <line x1="310" y1="243" x2="310" y2="263" stroke="#666666" stroke-width="2"/>
  <polygon points="310,270 303,258 317,258" fill="#666666"/>

  <rect x="90" y="272" width="440" height="66" fill="#151515" stroke="#FFFF00" stroke-width="1"/>
  <text x="110" y="298" font-size="13" fill="#FFFF00" font-family="'Geist Mono', monospace">Step-level decision tree: tool calls, state</text>
  <text x="110" y="316" font-size="13" fill="#FFFF00" font-family="'Geist Mono', monospace">transitions, branch logic — the deep part</text>

  <line x1="310" y1="338" x2="310" y2="358" stroke="#666666" stroke-width="2"/>
  <polygon points="310,365 303,353 317,353" fill="#666666"/>

  <rect x="90" y="367" width="440" height="58" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="110" y="394" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">Manual evaluation: scripts you write,</text>
  <text x="110" y="412" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">wired to an external judge or test runner</text>

  <line x1="310" y1="425" x2="310" y2="445" stroke="#666666" stroke-width="2"/>
  <polygon points="310,452 303,440 317,440" fill="#666666"/>

  <rect x="90" y="454" width="440" height="58" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="110" y="481" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">Manual cost math: tokens out, your own</text>
  <text x="110" y="499" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">pricing sheet in</text>

  <line x1="310" y1="512" x2="310" y2="532" stroke="#666666" stroke-width="2"/>
  <polygon points="310,539 303,527 317,527" fill="#666666"/>

  <rect x="90" y="541" width="440" height="48" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="310" y="571" font-size="13" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">Output: a debugging insight, mostly pre-production</text>

  <!-- Uncoil pipeline -->
  <rect x="640" y="110" width="500" height="470" fill="#0a0a0a" stroke="#FFFF00" stroke-width="2"/>
  <text x="890" y="142" font-size="18" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil — one integrated pipeline</text>
  <text x="890" y="163" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Tracing, evaluation, cost, and experiments together</text>

  <rect x="670" y="185" width="440" height="58" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="690" y="212" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">Agent runtime (any framework, or none —</text>
  <text x="690" y="230" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">no framework lock-in required)</text>

  <line x1="890" y1="243" x2="890" y2="263" stroke="#666666" stroke-width="2"/>
  <polygon points="890,270 883,258 897,258" fill="#666666"/>

  <rect x="670" y="272" width="440" height="290" fill="#1a1a08" stroke="#FFFF00" stroke-width="1"/>
  <text x="690" y="300" font-size="14" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Tracing + spans + multi-turn sessions</text>
  <text x="690" y="330" font-size="14" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Native evaluation: test library + judges</text>
  <text x="690" y="360" font-size="14" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Automatic per-call, per-model cost</text>
  <text x="690" y="390" font-size="14" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Experiment framework (prompt / routing)</text>
  <text x="690" y="420" font-size="14" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Regression + cost-threshold alerts</text>
  <text x="690" y="460" font-size="12" fill="#CCCCCC" font-family="'Geist Mono', monospace">Same pipeline runs in development</text>
  <text x="690" y="480" font-size="12" fill="#CCCCCC" font-family="'Geist Mono', monospace">and in production — no second build</text>

  <rect x="670" y="572" width="440" height="0" fill="none"/>
  <rect x="670" y="541" width="440" height="48" fill="#1a1a08" stroke="#FFFF00" stroke-width="1"/>
  <text x="890" y="571" font-size="13" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">Output: a quality gate, in every environment</text>

  <text x="600" y="655" font-size="13" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">
    Latitude goes deeper on one stage (framework decision-path tracing). Uncoil covers all four stages as one product.
  </text>
  <text x="600" y="680" font-size="12" fill="#666666" text-anchor="middle" font-family="'Geist Mono', monospace">
    Worked scenarios, feature-by-feature detail, and cost tables are in the article below.
  </text>
</svg>
