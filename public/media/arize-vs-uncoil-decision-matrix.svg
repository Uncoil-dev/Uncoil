<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="42" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Decision Framework</text>
  <text x="600" y="68" font-size="14" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Plot your system against both axes to find your starting platform</text>

  <!-- Quadrant field -->
  <rect x="180" y="100" width="840" height="480" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="600" y1="100" x2="600" y2="580" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="180" y1="340" x2="1020" y2="340" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Axis labels -->
  <text x="600" y="614" font-size="15" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Agent-Observability Completeness Needed &#8594;</text>
  <text x="60" y="340" font-size="15" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold" transform="rotate(-90, 60, 340)">Model-Monitoring Depth Needed &#8594;</text>

  <!-- Quadrant: top-left = Arize -->
  <text x="390" y="150" font-size="17" font-weight="bold" fill="#FF8844" text-anchor="middle" font-family="'Geist Mono', monospace">ARIZE</text>
  <text x="390" y="176" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">mature ground-truth pipeline,</text>
  <text x="390" y="192" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">single-model prediction API,</text>
  <text x="390" y="208" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">regulated / compliance-driven</text>

  <!-- Quadrant: top-right = Hybrid -->
  <text x="810" y="150" font-size="17" font-weight="bold" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">HYBRID</text>
  <text x="810" y="176" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">multi-model agents feeding a</text>
  <text x="810" y="192" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">specialized scoring or ranking</text>
  <text x="810" y="208" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">model that needs drift alarms</text>

  <!-- Quadrant: bottom-left = Minimal tooling -->
  <text x="390" y="440" font-size="17" font-weight="bold" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">MINIMAL TOOLING</text>
  <text x="390" y="466" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">low-stakes internal scripts,</text>
  <text x="390" y="482" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">pre-production prototypes,</text>
  <text x="390" y="498" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">basic logs may be enough</text>

  <!-- Quadrant: bottom-right = Uncoil -->
  <text x="810" y="440" font-size="17" font-weight="bold" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace">UNCOIL</text>
  <text x="810" y="466" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">multi-agent orchestration,</text>
  <text x="810" y="482" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">cost control across routes,</text>
  <text x="810" y="498" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">fast time-to-confidence</text>

  <!-- Example marker: customer-support agent -->
  <circle cx="860" cy="230" r="9" fill="#44FF44" stroke="#FFFFFF" stroke-width="2"/>
  <text x="860" y="215" font-size="11" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">support agent</text>

  <!-- Example marker: churn model -->
  <circle cx="330" cy="150" r="9" fill="#FF8844" stroke="#FFFFFF" stroke-width="2"/>
  <text x="330" y="135" font-size="11" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">churn model</text>

  <!-- axis end labels -->
  <text x="195" y="595" font-size="11" fill="#888888" text-anchor="start" font-family="'Geist Mono', monospace">low</text>
  <text x="1005" y="595" font-size="11" fill="#888888" text-anchor="end" font-family="'Geist Mono', monospace">high</text>
  <text x="170" y="575" font-size="11" fill="#888888" text-anchor="end" font-family="'Geist Mono', monospace">low</text>
  <text x="170" y="115" font-size="11" fill="#888888" text-anchor="end" font-family="'Geist Mono', monospace">high</text>
</svg>
