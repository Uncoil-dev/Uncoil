<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="42" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">12-Month TCO: 500k Calls / Month</text>
  <text x="600" y="68" font-size="14" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Recurring annual cost by line item (one-time setup excluded)</text>

  <!-- Axis -->
  <line x1="140" y1="600" x2="1080" y2="600" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Gridlines -->
  <line x1="140" y1="500" x2="1080" y2="500" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="120" y="504" font-size="11" fill="#666666" text-anchor="end" font-family="'Geist Mono', monospace">$18k</text>
  <line x1="140" y1="400" x2="1080" y2="400" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="120" y="404" font-size="11" fill="#666666" text-anchor="end" font-family="'Geist Mono', monospace">$36k</text>
  <line x1="140" y1="300" x2="1080" y2="300" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="120" y="304" font-size="11" fill="#666666" text-anchor="end" font-family="'Geist Mono', monospace">$54k</text>
  <line x1="140" y1="200" x2="1080" y2="200" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="120" y="204" font-size="11" fill="#666666" text-anchor="end" font-family="'Geist Mono', monospace">$72k</text>
  <line x1="140" y1="100" x2="1080" y2="100" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="120" y="104" font-size="11" fill="#666666" text-anchor="end" font-family="'Geist Mono', monospace">$90k</text>

  <!-- Arize stacked bar: platform 36000 (200px), ground truth 48000 (266.67px), external tracing 6000 (33.33px) -->
  <g>
    <rect x="300" y="400" width="200" height="200" fill="#444444" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="400" y="504" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Platform $36.0k</text>

    <rect x="300" y="133" width="200" height="267" fill="#FF8844" stroke="#FFFFFF" stroke-width="1.5" opacity="0.85"/>
    <text x="400" y="270" font-size="12" fill="#000000" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Ground truth</text>
    <text x="400" y="286" font-size="12" fill="#000000" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">labeling $48.0k</text>

    <rect x="300" y="100" width="200" height="33" fill="#888888" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="400" y="122" font-size="10" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">External tracing $6.0k</text>

    <text x="400" y="80" font-size="20" font-weight="bold" fill="#FF8844" text-anchor="middle" font-family="'Geist Mono', monospace">$90,000 / yr</text>
    <text x="400" y="630" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">ARIZE</text>
  </g>

  <!-- Uncoil stacked bar: platform 36000 (200px), external drift 6000 (33.33px), eval maintenance 9600 (53.33px) -->
  <g>
    <rect x="700" y="400" width="200" height="200" fill="#444444" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="800" y="504" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Platform $36.0k</text>

    <rect x="700" y="367" width="200" height="33" fill="#888888" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="800" y="388" font-size="10" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">External drift $6.0k</text>

    <rect x="700" y="313" width="200" height="54" fill="#44FF44" stroke="#FFFFFF" stroke-width="1.5" opacity="0.85"/>
    <text x="800" y="336" font-size="11" fill="#000000" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Eval maintenance</text>
    <text x="800" y="350" font-size="11" fill="#000000" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$9.6k</text>

    <text x="800" y="293" font-size="20" font-weight="bold" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace">$51,600 / yr</text>
    <text x="800" y="630" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">UNCOIL</text>
  </g>

  <!-- Savings callout -->
  <rect x="960" y="130" width="200" height="150" fill="none" stroke="#FFFF00" stroke-width="2"/>
  <text x="1060" y="160" font-size="13" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">ANNUAL GAP</text>
  <text x="1060" y="195" font-size="24" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$38,400</text>
  <text x="1060" y="220" font-size="12" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">43% lower TCO</text>
  <text x="1060" y="248" font-size="10" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">driven mostly by</text>
  <text x="1060" y="264" font-size="10" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">ground truth labor</text>

  <text x="600" y="675" font-size="11" fill="#666666" text-anchor="middle" font-family="'Geist Mono', monospace">Figures reflect worked example in this article; actual costs vary by volume and team structure.</text>
</svg>
