name: Warm caches

# Refreshes package and Next build caches on main so pull request runs can reuse them.

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-caches
  cancel-in-progress: true

jobs:
  warm:
    name: Warm (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: [marketing, cloud]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_UNCOIL_DEPLOYMENT_KIND: ${{ matrix.site }}
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://example.convex.site
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ matrix.site }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ matrix.site }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
