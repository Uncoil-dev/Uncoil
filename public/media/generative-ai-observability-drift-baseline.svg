<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="genDriftTitle genDriftDesc">
  <title id="genDriftTitle">A quality metric compared against a fixed baseline versus a rolling recent-week comparison</title>
  <desc id="genDriftTitle2">A black canvas shows two overlapping lines: a flat cream dashed line representing a fixed historical baseline, and a stepped acid-yellow line representing week-over-week comparison, with the week-over-week line failing to flag a slow decline that the fixed baseline comparison catches clearly near the right edge.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="800" y="60" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">FIXED BASELINE vs WEEK-OVER-WEEK</text>

  <line x1="180" y1="740" x2="180" y2="140" stroke="#f6f1e6" stroke-width="2"/>
  <line x1="180" y1="740" x2="1450" y2="740" stroke="#f6f1e6" stroke-width="2"/>

  <line x1="180" y1="260" x2="1440" y2="260" stroke="#f6f1e6" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="1250" y="245" fill="#f6f1e6" font-family="monospace" font-size="13">fixed baseline</text>

  <path d="M 180 270 L 350 285 L 520 300 L 690 320 L 860 345 L 1030 375 L 1200 410 L 1440 460" fill="none" stroke="#f4d44d" stroke-width="4"/>
  <text x="1250" y="480" fill="#f4d44d" font-family="monospace" font-size="13">actual quality (slow decline)</text>

  <rect x="1300" y="420" width="140" height="90" fill="none" stroke="#e2543a" stroke-width="3"/>
  <text x="1370" y="450" text-anchor="middle" fill="#e2543a" font-family="monospace" font-size="11">gap only visible</text>
  <text x="1370" y="468" text-anchor="middle" fill="#e2543a" font-family="monospace" font-size="11">vs fixed baseline</text>

  <text x="800" y="820" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="14">uncoil.dev · week-over-week deltas stay small enough to never trip a threshold on their own</text>
</svg>
