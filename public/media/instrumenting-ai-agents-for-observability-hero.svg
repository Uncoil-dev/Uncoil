<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="instHeroTitle instHeroDesc">
  <title id="instHeroTitle">A single agent run unfolding into a nested tree of spans across model call, tool call, and retrieval steps</title>
  <desc id="instHeroDesc">A black canvas shows a horizontal timeline labeled run at the top, branching downward into a nested tree of acid-yellow and cream span blocks labeled plan, retrieve, tool call, model call, and verify, each stamped with a small duration tag, illustrating that instrumentation is the discipline of turning one opaque run into a readable, timed tree of spans.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="800" y="60" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">ONE RUN, A TREE OF SPANS</text>

  <line x1="120" y1="150" x2="1480" y2="150" stroke="#f6f1e6" stroke-width="3"/>
  <rect x="120" y="120" width="220" height="60" fill="#f6f1e6"/>
  <text x="230" y="158" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="15" font-weight="700">RUN root span</text>

  <line x1="230" y1="180" x2="230" y2="260" stroke="#f4d44d" stroke-width="3"/>
  <rect x="120" y="260" width="220" height="60" fill="#f4d44d"/>
  <text x="230" y="298" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="14" font-weight="700">PLAN · 180ms</text>

  <line x1="340" y1="150" x2="620" y2="150" stroke="#f6f1e6" stroke-width="2"/>
  <line x1="620" y1="150" x2="620" y2="260" stroke="#f4d44d" stroke-width="3"/>
  <rect x="500" y="260" width="240" height="60" fill="#f4d44d"/>
  <text x="620" y="298" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="14" font-weight="700">RETRIEVE · 310ms</text>

  <line x1="620" y1="320" x2="620" y2="400" stroke="#f6f1e6" stroke-width="2"/>
  <rect x="500" y="400" width="240" height="60" fill="#f6f1e6"/>
  <text x="620" y="438" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="13" font-weight="700">vector query · 12 docs</text>

  <line x1="620" y1="150" x2="960" y2="150" stroke="#f6f1e6" stroke-width="2"/>
  <line x1="960" y1="150" x2="960" y2="260" stroke="#f4d44d" stroke-width="3"/>
  <rect x="840" y="260" width="240" height="60" fill="#f4d44d"/>
  <text x="960" y="298" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="14" font-weight="700">MODEL CALL · 1.4s</text>

  <line x1="960" y1="320" x2="960" y2="400" stroke="#f6f1e6" stroke-width="2"/>
  <rect x="840" y="400" width="240" height="60" fill="#f6f1e6"/>
  <text x="960" y="438" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="13" font-weight="700">2,340 tokens · $0.018</text>

  <line x1="960" y1="150" x2="1300" y2="150" stroke="#f6f1e6" stroke-width="2"/>
  <line x1="1300" y1="150" x2="1300" y2="260" stroke="#f4d44d" stroke-width="3"/>
  <rect x="1180" y="260" width="240" height="60" fill="#f4d44d"/>
  <text x="1300" y="298" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="14" font-weight="700">TOOL CALL · 640ms</text>

  <line x1="1300" y1="320" x2="1300" y2="400" stroke="#f6f1e6" stroke-width="2"/>
  <rect x="1180" y="400" width="240" height="60" fill="#f6f1e6"/>
  <text x="1300" y="438" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="13" font-weight="700">refund_api · retry x1</text>

  <rect x="640" y="560" width="320" height="70" fill="#f6f1e6"/>
  <text x="800" y="592" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="14" font-weight="700">VERIFY · pass/fail</text>
  <text x="800" y="614" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="12">attached at run close</text>
  <line x1="800" y1="470" x2="800" y2="560" stroke="#f4d44d" stroke-width="3"/>

  <text x="800" y="850" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="14">uncoil.dev · an unspanned run is a black box; a spanned run is a readable tree</text>
</svg>
