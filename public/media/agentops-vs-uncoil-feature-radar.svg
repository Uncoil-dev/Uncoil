<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="45" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Where Each Platform Wins, By Category
  </text>

  <!-- 5 category bars, each split AgentOps (blue) vs Uncoil (green) as a 0-10 strength score -->
  <!-- Instrumentation speed: AgentOps 9, Uncoil 6 -->
  <text x="60" y="110" font-size="14" fill="#FFFFFF" font-family="'Geist Mono', monospace">Setup speed</text>
  <rect x="260" y="95" width="360" height="22" fill="#151530" stroke="#8888FF" stroke-width="1"/>
  <rect x="260" y="95" width="324" height="22" fill="#8888FF"/>
  <text x="590" y="111" font-size="11" fill="#000000" text-anchor="end" font-family="'Geist Mono', monospace">AgentOps 9/10</text>
  <rect x="630" y="95" width="360" height="22" fill="#0f1f0f" stroke="#44FF44" stroke-width="1"/>
  <rect x="630" y="95" width="216" height="22" fill="#44FF44"/>
  <text x="850" y="111" font-size="11" fill="#000000" text-anchor="end" font-family="'Geist Mono', monospace">Uncoil 6/10</text>

  <!-- Session replay fidelity: AgentOps 10, Uncoil 6 -->
  <text x="60" y="170" font-size="14" fill="#FFFFFF" font-family="'Geist Mono', monospace">Replay fidelity</text>
  <rect x="260" y="155" width="360" height="22" fill="#151530" stroke="#8888FF" stroke-width="1"/>
  <rect x="260" y="155" width="360" height="22" fill="#8888FF"/>
  <text x="615" y="171" font-size="11" fill="#000000" text-anchor="end" font-family="'Geist Mono', monospace">AgentOps 10/10</text>
  <rect x="630" y="155" width="360" height="22" fill="#0f1f0f" stroke="#44FF44" stroke-width="1"/>
  <rect x="630" y="155" width="216" height="22" fill="#44FF44"/>
  <text x="850" y="171" font-size="11" fill="#000000" text-anchor="end" font-family="'Geist Mono', monospace">Uncoil 6/10</text>

  <!-- Evaluation depth: AgentOps 2, Uncoil 9 -->
  <text x="60" y="230" font-size="14" fill="#FFFFFF" font-family="'Geist Mono', monospace">Evaluation depth</text>
  <rect x="260" y="215" width="360" height="22" fill="#151530" stroke="#8888FF" stroke-width="1"/>
  <rect x="260" y="215" width="72" height="22" fill="#8888FF"/>
  <text x="340" y="231" font-size="11" fill="#FFFFFF" text-anchor="start" font-family="'Geist Mono', monospace">AgentOps 2/10</text>
  <rect x="630" y="215" width="360" height="22" fill="#0f1f0f" stroke="#44FF44" stroke-width="1"/>
  <rect x="630" y="215" width="324" height="22" fill="#44FF44"/>
  <text x="960" y="231" font-size="11" fill="#000000" text-anchor="end" font-family="'Geist Mono', monospace">Uncoil 9/10</text>

  <!-- Cost tracking precision: AgentOps 3, Uncoil 9 -->
  <text x="60" y="290" font-size="14" fill="#FFFFFF" font-family="'Geist Mono', monospace">Cost tracking</text>
  <rect x="260" y="275" width="360" height="22" fill="#151530" stroke="#8888FF" stroke-width="1"/>
  <rect x="260" y="275" width="108" height="22" fill="#8888FF"/>
  <text x="376" y="291" font-size="11" fill="#FFFFFF" text-anchor="start" font-family="'Geist Mono', monospace">AgentOps 3/10</text>
  <rect x="630" y="275" width="360" height="22" fill="#0f1f0f" stroke="#44FF44" stroke-width="1"/>
  <rect x="630" y="275" width="324" height="22" fill="#44FF44"/>
  <text x="960" y="291" font-size="11" fill="#000000" text-anchor="end" font-family="'Geist Mono', monospace">Uncoil 9/10</text>

  <!-- Experimentation: AgentOps 1, Uncoil 8 -->
  <text x="60" y="350" font-size="14" fill="#FFFFFF" font-family="'Geist Mono', monospace">Experimentation</text>
  <rect x="260" y="335" width="360" height="22" fill="#151530" stroke="#8888FF" stroke-width="1"/>
  <rect x="260" y="335" width="36" height="22" fill="#8888FF"/>
  <text x="304" y="351" font-size="11" fill="#FFFFFF" text-anchor="start" font-family="'Geist Mono', monospace">AgentOps 1/10</text>
  <rect x="630" y="335" width="360" height="22" fill="#0f1f0f" stroke="#44FF44" stroke-width="1"/>
  <rect x="630" y="335" width="288" height="22" fill="#44FF44"/>
  <text x="930" y="351" font-size="11" fill="#000000" text-anchor="end" font-family="'Geist Mono', monospace">Uncoil 8/10</text>

  <!-- legend -->
  <rect x="260" y="400" width="18" height="18" fill="#8888FF"/>
  <text x="286" y="414" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">AgentOps</text>
  <rect x="630" y="400" width="18" height="18" fill="#44FF44"/>
  <text x="656" y="414" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">Uncoil</text>

  <rect x="100" y="460" width="1000" height="90" fill="none" stroke="#FFFF00" stroke-width="2" rx="4"/>
  <text x="600" y="490" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">
    AgentOps wins on setup speed and replay fidelity.
  </text>
  <text x="600" y="515" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">
    Uncoil wins on evaluation, cost precision, and experimentation.
  </text>
  <text x="600" y="538" font-size="12" fill="#CCCC00" text-anchor="middle" font-family="'Geist Mono', monospace">
    The split tracks the debugging-vs-production-confidence divide almost exactly.
  </text>
</svg>