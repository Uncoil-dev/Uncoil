<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="44" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Choosing by Agent-Workload Share
  </text>
  <text x="600" y="72" font-size="14" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">
    What share of your monthly observability volume comes from agent/LLM interactions vs traditional services?
  </text>

  <!-- Spectrum bar -->
  <defs>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="45%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#FFFF00"/>
      <stop offset="65%" stop-color="#FFFF00"/>
      <stop offset="70%" stop-color="#44FF44"/>
      <stop offset="100%" stop-color="#44FF44"/>
    </linearGradient>
  </defs>

  <rect x="120" y="160" width="960" height="46" fill="url(#spectrum)" opacity="0.85"/>
  <rect x="120" y="160" width="960" height="46" fill="none" stroke="#555555" stroke-width="2"/>

  <!-- tick labels -->
  <text x="120" y="230" font-size="13" fill="#FFFFFF" text-anchor="start" font-family="'Geist Mono', monospace">0%</text>
  <text x="600" y="230" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">50%</text>
  <text x="1080" y="230" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">100%</text>
  <text x="600" y="252" font-size="13" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">share of monthly traces generated by agent / LLM workloads</text>

  <!-- Zone 1: 0-45% -->
  <rect x="120" y="300" width="312" height="230" fill="#1a1010" stroke="#FF6B6B" stroke-width="2"/>
  <text x="276" y="330" font-size="16" fill="#FF6B6B" font-weight="bold" text-anchor="middle" font-family="'Geist Mono', monospace">0-45%</text>
  <text x="276" y="354" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="'Geist Mono', monospace">Datadog</text>
  <text x="140" y="382" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">Agents are a minority</text>
  <text x="140" y="402" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">workload alongside dozens</text>
  <text x="140" y="422" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">of microservices.</text>
  <text x="140" y="452" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">Existing instrumentation,</text>
  <text x="140" y="472" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">dashboards, and on-call</text>
  <text x="140" y="492" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">runbooks outweigh the</text>
  <text x="140" y="512" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">per-span cost premium.</text>

  <!-- Zone 2: 45-70% -->
  <rect x="432" y="300" width="336" height="230" fill="#1a1a10" stroke="#FFFF00" stroke-width="2"/>
  <text x="600" y="330" font-size="16" fill="#FFFF00" font-weight="bold" text-anchor="middle" font-family="'Geist Mono', monospace">45-70%</text>
  <text x="600" y="354" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="'Geist Mono', monospace">Evaluate both</text>
  <text x="452" y="382" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">Mixed estate. Run the cost</text>
  <text x="452" y="402" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">math for your own volume</text>
  <text x="452" y="422" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">(see the tables above).</text>
  <text x="452" y="452" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">Weigh operational cost of</text>
  <text x="452" y="472" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">running two platforms</text>
  <text x="452" y="492" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">against agent-specific</text>
  <text x="452" y="512" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">features you would gain.</text>

  <!-- Zone 3: 70-100% -->
  <rect x="768" y="300" width="312" height="230" fill="#101a10" stroke="#44FF44" stroke-width="2"/>
  <text x="924" y="330" font-size="16" fill="#44FF44" font-weight="bold" text-anchor="middle" font-family="'Geist Mono', monospace">70-100%</text>
  <text x="924" y="354" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil</text>
  <text x="788" y="382" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">Agent-first or agent-only</text>
  <text x="788" y="402" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">product. Per-span billing</text>
  <text x="788" y="422" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">cost and missing evaluation</text>
  <text x="788" y="452" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">tooling both compound.</text>
  <text x="788" y="472" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">Trace-native billing and</text>
  <text x="788" y="492" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">built-in evals map directly</text>
  <text x="788" y="512" font-size="12" fill="#DDDDDD" font-family="'Geist Mono', monospace">to how the product ships.</text>

  <!-- Footer note -->
  <rect x="120" y="560" width="960" height="70" fill="#111111" stroke="#555555" stroke-width="1"/>
  <text x="140" y="586" font-size="12" fill="#AAAAAA" font-family="'Geist Mono', monospace">Two hard overrides regardless of workload share: on-prem/data-residency requirements point to Datadog;</text>
  <text x="140" y="608" font-size="12" fill="#AAAAAA" font-family="'Geist Mono', monospace">a hard requirement for built-in agent evaluation without extra tooling points to Uncoil.</text>
</svg>
