<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fT fD"><title id="fT">The same failing request before and after the fix: twenty-five model calls costing five dollars sixty-one, against two attempts and a hand-off costing two and a half cents</title><desc id="fD">Two rows of tiles. The top row, labelled before, has twenty-five tiles that get taller and redder from left to right, ending at five dollars sixty-one. The bottom row, labelled after, has three small tiles: two identical attempts and a yellow hand-off tile, totalling two and a half cents.</desc><rect width="1600" height="640" fill="#0a0a0a"/><text x="70" y="55" fill="#f4d44d" font-family="monospace" font-size="18" text-anchor="start" opacity="1" font-weight="normal" letter-spacing="2">SAME REQUEST, TWO RELEASES</text><text x="70" y="82" fill="#f6f1e6" font-family="monospace" font-size="13" text-anchor="start" opacity="0.6" font-weight="normal" letter-spacing="0">the fix does not make the agent smarter — it makes the failure short and cheap</text><text x="70" y="150" fill="#e2694f" font-family="monospace" font-size="14" text-anchor="start" opacity="1" font-weight="bold" letter-spacing="2">BEFORE</text><text x="70" y="170" fill="#f6f1e6" font-family="monospace" font-size="12" text-anchor="start" opacity="0.7" font-weight="normal" letter-spacing="0">error returns the whole record · only a step limit</text><rect x="70" y="316" width="40" height="14" fill="#e2694f" fill-opacity="0.35"/><rect x="122" y="312" width="40" height="18" fill="#e2694f" fill-opacity="0.38"/><rect x="174" y="307" width="40" height="23" fill="#e2694f" fill-opacity="0.40"/><rect x="226" y="303" width="40" height="27" fill="#e2694f" fill-opacity="0.43"/><rect x="278" y="298" width="40" height="32" fill="#e2694f" fill-opacity="0.46"/><rect x="330" y="294" width="40" height="36" fill="#e2694f" fill-opacity="0.49"/><rect x="382" y="289" width="40" height="41" fill="#e2694f" fill-opacity="0.51"/><rect x="434" y="285" width="40" height="45" fill="#e2694f" fill-opacity="0.54"/><rect x="486" y="280" width="40" height="50" fill="#e2694f" fill-opacity="0.57"/><rect x="538" y="276" width="40" height="54" fill="#e2694f" fill-opacity="0.59"/><rect x="590" y="271" width="40" height="59" fill="#e2694f" fill-opacity="0.62"/><rect x="642" y="267" width="40" height="63" fill="#e2694f" fill-opacity="0.65"/><rect x="694" y="262" width="40" height="68" fill="#e2694f" fill-opacity="0.68"/><rect x="746" y="258" width="40" height="72" fill="#e2694f" fill-opacity="0.70"/><rect x="798" y="253" width="40" height="77" fill="#e2694f" fill-opacity="0.73"/><rect x="850" y="249" width="40" height="81" fill="#e2694f" fill-opacity="0.76"/><rect x="902" y="244" width="40" height="86" fill="#e2694f" fill-opacity="0.78"/><rect x="954" y="240" width="40" height="90" fill="#e2694f" fill-opacity="0.81"/><rect x="1006" y="235" width="40" height="95" fill="#e2694f" fill-opacity="0.84"/><rect x="1058" y="231" width="40" height="99" fill="#e2694f" fill-opacity="0.86"/><rect x="1110" y="226" width="40" height="104" fill="#e2694f" fill-opacity="0.89"/><rect x="1162" y="222" width="40" height="108" fill="#e2694f" fill-opacity="0.92"/><rect x="1214" y="217" width="40" height="113" fill="#e2694f" fill-opacity="0.95"/><rect x="1266" y="213" width="40" height="117" fill="#e2694f" fill-opacity="0.97"/><rect x="1318" y="208" width="40" height="122" fill="#e2694f" fill-opacity="1.00"/><text x="1500" y="205" fill="#f6f1e6" font-family="monospace" font-size="20" text-anchor="end" opacity="1" font-weight="bold" letter-spacing="0">25 calls</text><text x="1500" y="262" fill="#e2694f" font-family="monospace" font-size="44" text-anchor="end" opacity="1" font-weight="bold" letter-spacing="0">$5.61</text><line x1="70" y1="370" x2="1530" y2="370" stroke="#f6f1e6" stroke-opacity="0.25"/><text x="70" y="420" fill="#f4d44d" font-family="monospace" font-size="14" text-anchor="start" opacity="1" font-weight="bold" letter-spacing="2">AFTER</text><text x="70" y="440" fill="#f6f1e6" font-family="monospace" font-size="12" text-anchor="start" opacity="0.7" font-weight="normal" letter-spacing="0">short error · stop after 2 identical calls · hand off to a person</text><rect x="70" y="470" width="130" height="64" fill="#f6f1e6" fill-opacity="0.8"/><text x="135" y="508" fill="#0a0a0a" font-family="monospace" font-size="14" text-anchor="middle" opacity="1" font-weight="bold" letter-spacing="0">try</text><rect x="220" y="470" width="130" height="64" fill="#f6f1e6" fill-opacity="0.8"/><text x="285" y="508" fill="#0a0a0a" font-family="monospace" font-size="14" text-anchor="middle" opacity="1" font-weight="bold" letter-spacing="0">try again</text><rect x="370" y="470" width="130" height="64" fill="#f4d44d" fill-opacity="0.9"/><text x="435" y="508" fill="#0a0a0a" font-family="monospace" font-size="14" text-anchor="middle" opacity="1" font-weight="bold" letter-spacing="0">hand off</text><text x="1500" y="500" fill="#f6f1e6" font-family="monospace" font-size="20" text-anchor="end" opacity="1" font-weight="bold" letter-spacing="0">3 calls</text><text x="1500" y="540" fill="#f4d44d" font-family="monospace" font-size="36" text-anchor="end" opacity="1" font-weight="bold" letter-spacing="0">$0.0251</text><text x="70" y="600" fill="#f6f1e6" font-family="monospace" font-size="12" text-anchor="start" opacity="0.6" font-weight="normal" letter-spacing="0">Same 90 requests: $504.56 before, $2.26 after. The customer gets a person instead of a loop.</text></svg>
