name: Documentation problem
description: Docs are missing, unclear or wrong
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the docs page or name the missing topic.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
