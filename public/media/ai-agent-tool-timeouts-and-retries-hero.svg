<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hT hD">
  <title id="hT">One tool call, three attempts, one shared deadline</title>
  <desc id="hD">A horizontal timeline in which an agent step has a total deadline bar and three attempt bars separated by growing backoff gaps, the last attempt clipped to the time left on the deadline.</desc>
  <rect width="1600" height="800" fill="#eceae3"/>
  <text x="80" y="110" fill="#090909" font-family="monospace" font-size="28" font-weight="700">STEP DEADLINE: 30 s</text>
  <rect x="80" y="140" width="1440" height="36" fill="#090909"/>
  <text x="80" y="250" fill="#090909" font-family="monospace" font-size="20">attempt 1</text>
  <rect x="80" y="270" width="480" height="60" fill="#f4d44d" stroke="#090909" stroke-width="3"/>
  <text x="100" y="308" fill="#090909" font-family="monospace" font-size="20">timeout 10 s</text>
  <rect x="560" y="270" width="48" height="60" fill="none" stroke="#090909" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="570" y="360" fill="#090909" font-family="monospace" font-size="18">backoff 1 s</text>
  <text x="608" y="420" fill="#090909" font-family="monospace" font-size="20">attempt 2</text>
  <rect x="608" y="440" width="480" height="60" fill="#f4d44d" stroke="#090909" stroke-width="3"/>
  <text x="628" y="478" fill="#090909" font-family="monospace" font-size="20">timeout 10 s</text>
  <rect x="1088" y="440" width="96" height="60" fill="none" stroke="#090909" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="1090" y="530" fill="#090909" font-family="monospace" font-size="18">backoff 2 s</text>
  <text x="1184" y="590" fill="#090909" font-family="monospace" font-size="20">attempt 3</text>
  <rect x="1184" y="610" width="336" height="60" fill="#090909"/>
  <text x="1204" y="648" fill="#f4d44d" font-family="monospace" font-size="20">clipped to remaining 7 s</text>
  <text x="80" y="740" fill="#090909" font-family="monospace" font-size="20">Each attempt gets the smaller of its own timeout and the time left on the shared deadline.</text>
</svg>
