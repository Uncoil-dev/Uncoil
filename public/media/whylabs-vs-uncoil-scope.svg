<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="46" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    WhyLabs vs Uncoil — where each platform's scope ends
  </text>
  <text x="600" y="72" font-size="14" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    A narrow, deep drift-detection specialist vs an integrated agent observability platform
  </text>

  <!-- WhyLabs box -->
  <rect x="70" y="105" width="500" height="470" fill="#0a0a0a" stroke="#FFFFFF" stroke-width="2"/>
  <text x="320" y="138" font-size="19" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">WhyLabs — drift &amp; quality specialist</text>
  <text x="320" y="159" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Profile-based statistical monitoring</text>

  <rect x="100" y="178" width="440" height="30" fill="#151515"/>
  <text x="112" y="199" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">✓ Data &amp; prediction drift detection</text>

  <rect x="100" y="212" width="440" height="30" fill="#151515"/>
  <text x="112" y="233" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">✓ Model performance degradation alerts</text>

  <rect x="100" y="246" width="440" height="30" fill="#151515"/>
  <text x="112" y="267" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">✓ LangKit text metrics (toxicity, PII, sentiment)</text>

  <rect x="100" y="280" width="440" height="30" fill="#151515"/>
  <text x="112" y="301" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">✓ Privacy-preserving profiling, not raw storage</text>

  <text x="320" y="336" font-size="12" fill="#777777" text-anchor="middle" font-family="'Geist Mono', monospace">not native to the platform</text>

  <rect x="100" y="350" width="440" height="30" fill="#1a0a0a" stroke="#552222" stroke-width="1"/>
  <text x="112" y="371" font-size="13" fill="#CC8888" font-family="'Geist Mono', monospace">✗ Distributed agent/tool-call tracing</text>

  <rect x="100" y="384" width="440" height="30" fill="#1a0a0a" stroke="#552222" stroke-width="1"/>
  <text x="112" y="405" font-size="13" fill="#CC8888" font-family="'Geist Mono', monospace">✗ Per-call cost tracking</text>

  <rect x="100" y="418" width="440" height="30" fill="#1a0a0a" stroke="#552222" stroke-width="1"/>
  <text x="112" y="439" font-size="13" fill="#CC8888" font-family="'Geist Mono', monospace">✗ Native evaluation test cases</text>

  <rect x="100" y="452" width="440" height="30" fill="#1a0a0a" stroke="#552222" stroke-width="1"/>
  <text x="112" y="473" font-size="13" fill="#CC8888" font-family="'Geist Mono', monospace">✗ Experimentation / prompt A-B framework</text>

  <rect x="100" y="500" width="440" height="56" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="120" y="522" font-size="12" fill="#CCCCCC" font-family="'Geist Mono', monospace">Signal coverage for a full agent stack</text>
  <text x="120" y="545" font-size="20" fill="#FFFFFF" font-family="'Geist Mono', monospace" font-weight="bold">1 of 5 layers native</text>

  <!-- Uncoil box -->
  <rect x="630" y="105" width="500" height="470" fill="#0a0a0a" stroke="#FFFF00" stroke-width="2"/>
  <text x="880" y="138" font-size="19" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil — integrated agent observability</text>
  <text x="880" y="159" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Traces, cost, evaluation, and experiments in one platform</text>

  <rect x="660" y="178" width="440" height="30" fill="#1a1a08"/>
  <text x="672" y="199" font-size="13" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ End-to-end traces (LLM + tool + retries)</text>

  <rect x="660" y="212" width="440" height="30" fill="#1a1a08"/>
  <text x="672" y="233" font-size="13" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Session &amp; multi-turn context chains</text>

  <rect x="660" y="246" width="440" height="30" fill="#1a1a08"/>
  <text x="672" y="267" font-size="13" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Automatic per-call, per-route cost breakdown</text>

  <rect x="660" y="280" width="440" height="30" fill="#1a1a08"/>
  <text x="672" y="301" font-size="13" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Native evaluation (LLM-as-judge, custom checks)</text>

  <rect x="660" y="314" width="440" height="30" fill="#1a1a08"/>
  <text x="672" y="335" font-size="13" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Experiment framework for prompt/model versions</text>

  <text x="880" y="370" font-size="12" fill="#777777" text-anchor="middle" font-family="'Geist Mono', monospace">quality-adjacent, not statistical drift</text>

  <rect x="660" y="384" width="440" height="30" fill="#1a0a0a" stroke="#552222" stroke-width="1"/>
  <text x="672" y="405" font-size="13" fill="#CC8888" font-family="'Geist Mono', monospace">✗ Feature-level statistical drift detection</text>

  <rect x="660" y="418" width="440" height="30" fill="#1a0a0a" stroke="#552222" stroke-width="1"/>
  <text x="672" y="439" font-size="13" fill="#CC8888" font-family="'Geist Mono', monospace">✗ Ground-truth cohort drift analysis</text>

  <rect x="660" y="500" width="440" height="56" fill="#1a1a08" stroke="#FFFF00" stroke-width="1"/>
  <text x="680" y="522" font-size="12" fill="#CCCCCC" font-family="'Geist Mono', monospace">Signal coverage for a full agent stack</text>
  <text x="680" y="545" font-size="20" fill="#FFFF00" font-family="'Geist Mono', monospace" font-weight="bold">5 of 5 layers native</text>

  <text x="600" y="620" font-size="13" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">
    WhyLabs goes deep on one layer (statistical model quality). Uncoil goes wide across the agent execution lifecycle.
  </text>
  <text x="600" y="650" font-size="12" fill="#777777" text-anchor="middle" font-family="'Geist Mono', monospace">
    Full scenario-by-scenario breakdown and worked costs are below.
  </text>
</svg>
