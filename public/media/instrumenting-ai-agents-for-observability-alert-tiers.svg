<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="instAlertTitle instAlertDesc">
  <title id="instAlertTitle">Three alerting tiers moving from a silent dashboard signal to a paged on-call engineer</title>
  <desc id="instAlertDesc">A black canvas shows three stacked horizontal lanes labeled watch, notify, and page, each with a cream condition box on the left and an acid-yellow response box on the right, with arrows showing that only sustained, user-visible degradation escalates from a dashboard watch to a paging alert, illustrating a tiered alerting strategy that resists noise.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="800" y="60" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">THREE ALERT TIERS</text>

  <g font-family="monospace" font-size="15">
    <rect x="120" y="140" width="420" height="150" fill="#f6f1e6"/>
    <text x="140" y="180" fill="#0a0a0a" font-weight="700" font-size="17">WATCH</text>
    <text x="140" y="212" fill="#0a0a0a" font-size="13">single-run anomaly</text>
    <text x="140" y="236" fill="#0a0a0a" font-size="13">one slow span, one retry</text>
    <text x="140" y="260" fill="#0a0a0a" font-size="13">visible on dashboard only</text>

    <line x1="540" y1="215" x2="700" y2="215" stroke="#f4d44d" stroke-width="4" marker-end="url(#arrow1)"/>
    <rect x="700" y="140" width="380" height="150" fill="#f4d44d"/>
    <text x="720" y="180" fill="#0a0a0a" font-weight="700" font-size="17">no interrupt</text>
    <text x="720" y="212" fill="#0a0a0a" font-size="13">logged for trend review</text>
    <text x="720" y="236" fill="#0a0a0a" font-size="13">rolled into weekly triage</text>

    <rect x="120" y="360" width="420" height="150" fill="#f6f1e6"/>
    <text x="140" y="400" fill="#0a0a0a" font-weight="700" font-size="17">NOTIFY</text>
    <text x="140" y="432" fill="#0a0a0a" font-size="13">sustained metric drift</text>
    <text x="140" y="456" fill="#0a0a0a" font-size="13">error rate above baseline</text>
    <text x="140" y="480" fill="#0a0a0a" font-size="13">15+ minutes, business hours</text>

    <line x1="540" y1="435" x2="700" y2="435" stroke="#f4d44d" stroke-width="4" marker-end="url(#arrow1)"/>
    <rect x="700" y="360" width="380" height="150" fill="#f4d44d"/>
    <text x="720" y="400" fill="#0a0a0a" font-weight="700" font-size="17">chat channel</text>
    <text x="720" y="432" fill="#0a0a0a" font-size="13">async acknowledgment</text>
    <text x="720" y="456" fill="#0a0a0a" font-size="13">owner has hours, not minutes</text>

    <rect x="120" y="580" width="420" height="150" fill="#f6f1e6"/>
    <text x="140" y="620" fill="#0a0a0a" font-weight="700" font-size="17">PAGE</text>
    <text x="140" y="652" fill="#0a0a0a" font-size="13">user-visible failure spike</text>
    <text x="140" y="676" fill="#0a0a0a" font-size="13">error budget burn breach</text>
    <text x="140" y="700" fill="#0a0a0a" font-size="13">crosses SLO threshold</text>

    <line x1="540" y1="655" x2="700" y2="655" stroke="#f4d44d" stroke-width="4" marker-end="url(#arrow1)"/>
    <rect x="700" y="580" width="380" height="150" fill="#f4d44d"/>
    <text x="720" y="620" fill="#0a0a0a" font-weight="700" font-size="17">on-call page</text>
    <text x="720" y="652" fill="#0a0a0a" font-size="13">acknowledge in minutes</text>
    <text x="720" y="676" fill="#0a0a0a" font-size="13">incident record opens</text>
  </g>

  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f4d44d"/>
    </marker>
  </defs>

  <text x="800" y="850" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="14">uncoil.dev · escalation should track user impact, not raw signal count</text>
</svg>
