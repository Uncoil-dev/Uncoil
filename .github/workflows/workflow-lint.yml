name: Workflow lint

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install zizmor
        run: pip install zizmor==1.5.2
      - name: Scan workflows
        env:
          GH_TOKEN: ${{ github.token }}
        # Report-only while existing findings are fixed in separate small PRs.
        # Remove --no-exit-codes once the report is clean so findings fail the check.
        run: zizmor --no-exit-codes --format plain --config .github/zizmor.yml .github/
