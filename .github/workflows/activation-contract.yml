name: Activation contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install application dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the canonical activation contract
        run: pnpm test:activation
      - name: Validate public content
        run: pnpm test:content
