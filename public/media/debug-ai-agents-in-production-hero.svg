<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Debug AI agents in production</title>
  <desc id="desc">Five connected steps: stabilize, reconstruct, compare, correct, and verify.</desc>
  <rect width="1200" height="630" fill="#eceae3"/>
  <rect x="0" y="0" width="1200" height="20" fill="#f4d44d"/>
  <text x="72" y="88" fill="#090909" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">UNCOIL / FIELD GUIDE 04</text>
  <text x="72" y="190" fill="#090909" font-family="Arial,sans-serif" font-size="64" font-weight="800">Find the first</text>
  <text x="72" y="265" fill="#090909" font-family="Arial,sans-serif" font-size="64" font-weight="800">bad step.</text>
  <text x="74" y="314" fill="#333333" font-family="Arial,sans-serif" font-size="22">A production debugging loop that ends with proof.</text>
  <rect x="72" y="360" width="1056" height="198" fill="#090909"/>
  <path d="M150 431H1049" stroke="#f4d44d" stroke-width="4"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="160" cy="431" r="23" fill="#f4d44d"/><text x="160" y="439" fill="#090909" font-size="18" font-weight="700">1</text>
    <circle cx="380" cy="431" r="23" fill="#f4d44d"/><text x="380" y="439" fill="#090909" font-size="18" font-weight="700">2</text>
    <circle cx="600" cy="431" r="23" fill="#f4d44d"/><text x="600" y="439" fill="#090909" font-size="18" font-weight="700">3</text>
    <circle cx="820" cy="431" r="23" fill="#f4d44d"/><text x="820" y="439" fill="#090909" font-size="18" font-weight="700">4</text>
    <circle cx="1040" cy="431" r="23" fill="#f4d44d"/><text x="1040" y="439" fill="#090909" font-size="18" font-weight="700">5</text>
    <g fill="#eceae3" font-size="17" font-weight="700" letter-spacing="1">
      <text x="160" y="493">STABILIZE</text><text x="380" y="493">RECONSTRUCT</text><text x="600" y="493">COMPARE</text><text x="820" y="493">CORRECT</text><text x="1040" y="493">VERIFY</text>
    </g>
  </g>
  <text x="72" y="598" fill="#555555" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">SYMPTOM → MECHANISM → REGRESSION CHECK</text>
</svg>
