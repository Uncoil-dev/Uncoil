<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>
  <defs>
    <marker id="arrowWhite" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <text x="600" y="42" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Two Observability Models</text>
  <text x="600" y="68" font-size="14" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Arize monitors what the model predicts. Uncoil traces what the agent does.</text>

  <line x1="600" y1="88" x2="600" y2="650" stroke="#333333" stroke-width="1" stroke-dasharray="6,6"/>

  <text x="300" y="108" font-size="17" font-weight="bold" fill="#FF8844" text-anchor="middle" font-family="'Geist Mono', monospace">ARIZE: MODEL QUALITY MONITORING</text>

  <rect x="130" y="128" width="340" height="72" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="300" y="158" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Predictions + Embeddings</text>
  <text x="300" y="180" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">logged for every inference call</text>

  <line x1="300" y1="200" x2="300" y2="238" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowWhite)"/>

  <rect x="130" y="240" width="340" height="72" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="300" y="270" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Ground Truth Labels</text>
  <text x="300" y="292" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">human review or downstream metric</text>

  <line x1="300" y1="312" x2="300" y2="350" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowWhite)"/>

  <rect x="130" y="352" width="340" height="72" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="300" y="382" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Statistical Drift Detection</text>
  <text x="300" y="404" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">feature, prediction, performance drift</text>

  <line x1="300" y1="424" x2="300" y2="462" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowWhite)"/>

  <rect x="130" y="464" width="340" height="72" fill="none" stroke="#FF8844" stroke-width="2"/>
  <text x="300" y="494" font-size="15" fill="#FF8844" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Quality Alert / Retrain</text>
  <text x="300" y="516" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">version rollback or retraining trigger</text>

  <text x="900" y="108" font-size="17" font-weight="bold" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace">UNCOIL: AGENT-CENTRIC OBSERVABILITY</text>

  <rect x="730" y="128" width="340" height="72" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="900" y="158" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Full Agent Trace</text>
  <text x="900" y="180" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">LLM calls, tool calls, retries, decisions</text>

  <line x1="900" y1="200" x2="900" y2="238" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowWhite)"/>

  <rect x="730" y="240" width="340" height="72" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="900" y="270" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Integrated Evaluation</text>
  <text x="900" y="292" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">test cases run against live traces</text>

  <line x1="900" y1="312" x2="900" y2="350" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowWhite)"/>

  <rect x="730" y="352" width="340" height="72" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="900" y="382" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Cost Attribution</text>
  <text x="900" y="404" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">per-call cost by model, provider, route</text>

  <line x1="900" y1="424" x2="900" y2="462" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowWhite)"/>

  <rect x="730" y="464" width="340" height="72" fill="none" stroke="#44FF44" stroke-width="2"/>
  <text x="900" y="494" font-size="15" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Production Confidence</text>
  <text x="900" y="516" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">minutes to first trace, hours to first eval</text>

  <rect x="100" y="566" width="1000" height="84" fill="none" stroke="#FFFF00" stroke-width="2"/>
  <text x="600" y="598" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Arize asks: "Did the model's predictions degrade from a known-good baseline?"</text>
  <text x="600" y="624" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil asks: "Did the agent complete the task, and what did that cost?"</text>
</svg>
