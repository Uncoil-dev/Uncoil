<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="42" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    One Team's First Year: Trace Volume Ramps, Bills Diverge
  </text>
  <text x="600" y="68" font-size="14" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">
    Monthly cost, log scale. Trace volume: 5M to 120M/month over 12 months.
  </text>

  <!-- Axes -->
  <line x1="140" y1="600" x2="1080" y2="600" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="140" y1="110" x2="140" y2="600" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Log gridlines: 100, 1K, 10K, 100K, 1M -->
  <line x1="140" y1="600" x2="1080" y2="600" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="140" y1="480" x2="1080" y2="480" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="140" y1="360" x2="1080" y2="360" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="140" y1="240" x2="1080" y2="240" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="140" y1="120" x2="1080" y2="120" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="125" y="605" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">$100</text>
  <text x="125" y="485" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">$1K</text>
  <text x="125" y="365" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">$10K</text>
  <text x="125" y="245" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">$100K</text>
  <text x="125" y="125" font-size="13" fill="#FFFFFF" text-anchor="end" font-family="'Geist Mono', monospace">$1M</text>

  <text x="60" y="360" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" transform="rotate(-90, 60, 360)">Monthly bill (log scale)</text>

  <!-- X labels -->
  <text x="200" y="628" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Day 0</text>
  <text x="200" y="644" font-size="11" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">5M traces/mo</text>

  <text x="460" y="628" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Month 3</text>
  <text x="460" y="644" font-size="11" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">25M traces/mo</text>

  <text x="720" y="628" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Month 6</text>
  <text x="720" y="644" font-size="11" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">60M traces/mo</text>

  <text x="980" y="628" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Month 12</text>
  <text x="980" y="644" font-size="11" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">120M traces/mo</text>

  <!-- LangSmith line -->
  <polyline points="200,358.9 460,288.4 720,227.5 980,186.8" stroke="#FF4444" stroke-width="3" fill="none"/>
  <circle cx="200" cy="358.9" r="5" fill="#FF4444"/>
  <circle cx="460" cy="288.4" r="5" fill="#FF4444"/>
  <circle cx="720" cy="227.5" r="5" fill="#FF4444"/>
  <circle cx="980" cy="186.8" r="5" fill="#FF4444"/>

  <text x="200" y="340" font-size="12" fill="#FF8888" text-anchor="middle" font-family="'Geist Mono', monospace">$10,217</text>
  <text x="460" y="270" font-size="12" fill="#FF8888" text-anchor="middle" font-family="'Geist Mono', monospace">$39,495</text>
  <text x="720" y="209" font-size="12" fill="#FF8888" text-anchor="middle" font-family="'Geist Mono', monospace">$127,193</text>
  <text x="980" y="168" font-size="12" fill="#FF8888" text-anchor="middle" font-family="'Geist Mono', monospace">$277,490</text>

  <!-- Uncoil line -->
  <polyline points="200,542.7 460,542.7 720,542.7 980,458.9" stroke="#44FF44" stroke-width="3" fill="none"/>
  <circle cx="200" cy="542.7" r="5" fill="#44FF44"/>
  <circle cx="460" cy="542.7" r="5" fill="#44FF44"/>
  <circle cx="720" cy="542.7" r="5" fill="#44FF44"/>
  <circle cx="980" cy="458.9" r="5" fill="#44FF44"/>

  <text x="200" y="562" font-size="12" fill="#88FF88" text-anchor="middle" font-family="'Geist Mono', monospace">$300</text>
  <text x="460" y="562" font-size="12" fill="#88FF88" text-anchor="middle" font-family="'Geist Mono', monospace">$300</text>
  <text x="720" y="562" font-size="12" fill="#88FF88" text-anchor="middle" font-family="'Geist Mono', monospace">$300</text>
  <text x="980" y="478" font-size="12" fill="#88FF88" text-anchor="middle" font-family="'Geist Mono', monospace">$1,500</text>

  <!-- Legend -->
  <rect x="760" y="130" width="300" height="90" fill="#111111" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="778" y1="155" x2="812" y2="155" stroke="#FF4444" stroke-width="3"/>
  <text x="824" y="160" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">LangSmith (overage-driven)</text>
  <line x1="778" y1="185" x2="812" y2="185" stroke="#44FF44" stroke-width="3"/>
  <text x="824" y="190" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">Uncoil (flat tier)</text>

  <!-- Callout -->
  <rect x="140" y="30" width="560" height="0" fill="none"/>
  <text x="140" y="695" font-size="13" fill="#FFFF00" text-anchor="start" font-family="'Geist Mono', monospace">
    Year-1 actual spend (stepped model): LangSmith ~$912,294 vs Uncoil ~$7,200 -- a ~127x gap before month 12's run-rate even hits.
  </text>
</svg>
