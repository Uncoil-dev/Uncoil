<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="42" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Decision framework: drift-detection need vs integrated observability need
  </text>
  <text x="600" y="66" font-size="13" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    Plot your team against both axes to find the honest recommendation
  </text>

  <!-- Axes -->
  <line x1="180" y1="600" x2="1050" y2="600" stroke="#666666" stroke-width="1.5"/>
  <line x1="180" y1="600" x2="180" y2="110" stroke="#666666" stroke-width="1.5"/>

  <text x="615" y="638" font-size="14" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">Integrated observability need (tracing + cost + evaluation) →</text>
  <text x="150" y="360" font-size="14" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace" transform="rotate(-90 150 360)">Statistical drift-detection need →</text>

  <!-- Quadrant divider lines (dashed) -->
  <line x1="615" y1="110" x2="615" y2="600" stroke="#333333" stroke-width="1" stroke-dasharray="6,6"/>
  <line x1="180" y1="355" x2="1050" y2="355" stroke="#333333" stroke-width="1" stroke-dasharray="6,6"/>

  <!-- Quadrant: bottom-left, low/low -->
  <rect x="200" y="375" width="390" height="205" fill="#0a0a0a" stroke="#444444" stroke-width="1"/>
  <text x="395" y="405" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Low / Low</text>
  <text x="395" y="430" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Single model, early-stage product,</text>
  <text x="395" y="448" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">low call volume</text>
  <text x="395" y="482" font-size="16" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Open-source logging</text>
  <text x="395" y="504" font-size="12" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">Neither platform is justified yet;</text>
  <text x="395" y="520" font-size="12" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">revisit at production scale</text>

  <!-- Quadrant: bottom-right, low drift / high integrated -->
  <rect x="635" y="375" width="395" height="205" fill="#1a1a08" stroke="#FFFF00" stroke-width="2"/>
  <text x="832" y="405" font-size="15" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Low drift / High integrated</text>
  <text x="832" y="430" font-size="12" fill="#CCCC88" text-anchor="middle" font-family="'Geist Mono', monospace">Multi-step agents, tool calls,</text>
  <text x="832" y="448" font-size="12" fill="#CCCC88" text-anchor="middle" font-family="'Geist Mono', monospace">cost and reliability are the risk</text>
  <text x="832" y="482" font-size="18" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil</text>
  <text x="832" y="504" font-size="12" fill="#CCCC88" text-anchor="middle" font-family="'Geist Mono', monospace">Traces, cost, evaluation, and</text>
  <text x="832" y="520" font-size="12" fill="#CCCC88" text-anchor="middle" font-family="'Geist Mono', monospace">experiments in one platform</text>

  <!-- Quadrant: top-left, high drift / low integrated -->
  <rect x="200" y="130" width="390" height="205" fill="#0a0a0a" stroke="#FFFFFF" stroke-width="2"/>
  <text x="395" y="160" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">High drift / Low integrated</text>
  <text x="395" y="185" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Single production model,</text>
  <text x="395" y="203" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">mature ground-truth pipeline</text>
  <text x="395" y="237" font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">WhyLabs</text>
  <text x="395" y="259" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Statistical drift, profiling, and</text>
  <text x="395" y="275" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">LLM text-quality heuristics</text>

  <!-- Quadrant: top-right, high/high -->
  <rect x="635" y="130" width="395" height="205" fill="#0a0a0a" stroke="#FFFF00" stroke-width="1"/>
  <text x="832" y="160" font-size="15" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">High / High</text>
  <text x="832" y="185" font-size="12" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">Regulated or high-volume agent</text>
  <text x="832" y="203" font-size="12" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">system with a mature data org</text>
  <text x="832" y="237" font-size="16" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Hybrid: WhyLabs + Uncoil</text>
  <text x="832" y="259" font-size="12" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">WhyLabs owns statistical drift;</text>
  <text x="832" y="275" font-size="12" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil owns agent execution</text>

  <text x="600" y="668" font-size="12" fill="#777777" text-anchor="middle" font-family="'Geist Mono', monospace">
    Most teams building agents land bottom-right; most teams operating a single statistical model land top-left
  </text>
</svg>
