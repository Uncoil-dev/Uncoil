<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="44" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Annual TCO — two scenarios, two winners
  </text>
  <text x="600" y="68" font-size="13" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    Platform cost + engineering time to reach the same bar (replayable sessions vs. evaluated, costed traces)
  </text>

  <!-- LEFT PANEL: Early-stage -->
  <text x="300" y="106" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Early-stage startup</text>
  <text x="300" y="126" font-size="11" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">5 engineers · 15k LLM calls/month · pre-PMF</text>

  <line x1="120" y1="580" x2="480" y2="580" stroke="#444444" stroke-width="1"/>
  <text x="105" y="584" font-size="10" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$0</text>
  <line x1="120" y1="440" x2="480" y2="440" stroke="#222222" stroke-width="1"/>
  <text x="105" y="444" font-size="10" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$2k</text>
  <line x1="120" y1="300" x2="480" y2="300" stroke="#222222" stroke-width="1"/>
  <text x="105" y="304" font-size="10" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$4k</text>
  <line x1="120" y1="160" x2="480" y2="160" stroke="#222222" stroke-width="1"/>
  <text x="105" y="164" font-size="10" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$6k</text>

  <!-- AgentOps early bar: $1,200 -->
  <rect x="170" y="538" width="110" height="42" fill="#FFFF00"/>
  <text x="225" y="524" font-size="16" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$1,200</text>
  <text x="225" y="602" font-size="12" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">AgentOps</text>
  <text x="225" y="620" font-size="10" fill="#AAAA66" text-anchor="middle" font-family="'Geist Mono', monospace">Paid tier, no eval build yet</text>

  <!-- Uncoil early bar: $4,200 -->
  <rect x="330" y="440" width="110" height="140" fill="#AAAAAA"/>
  <text x="385" y="426" font-size="16" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$4,200</text>
  <text x="385" y="602" font-size="12" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil</text>
  <text x="385" y="620" font-size="10" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">Eval + cost included, unused early</text>

  <text x="300" y="655" font-size="12" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">AgentOps ~3.5x cheaper pre-PMF</text>

  <!-- Divider -->
  <line x1="600" y1="90" x2="600" y2="640" stroke="#333333" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RIGHT PANEL: Production -->
  <text x="900" y="106" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Production scale</text>
  <text x="900" y="126" font-size="11" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">15 engineers · 100k LLM calls/month · quality gates required</text>

  <line x1="720" y1="580" x2="1080" y2="580" stroke="#444444" stroke-width="1"/>
  <text x="705" y="584" font-size="10" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$0</text>
  <line x1="720" y1="440" x2="1080" y2="440" stroke="#222222" stroke-width="1"/>
  <text x="705" y="444" font-size="10" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$40k</text>
  <line x1="720" y1="300" x2="1080" y2="300" stroke="#222222" stroke-width="1"/>
  <text x="705" y="304" font-size="10" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$80k</text>
  <line x1="720" y1="160" x2="1080" y2="160" stroke="#222222" stroke-width="1"/>
  <text x="705" y="164" font-size="10" fill="#777777" text-anchor="end" font-family="'Geist Mono', monospace">$120k</text>

  <!-- AgentOps production bar: $81,600 -->
  <rect x="770" y="163" width="110" height="417" fill="#FFFFFF"/>
  <text x="825" y="149" font-size="16" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$81,600</text>
  <text x="825" y="602" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">AgentOps</text>
  <text x="825" y="620" font-size="10" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">Platform + hand-built eval (0.4 FTE)</text>

  <!-- Uncoil production bar: $38,400 -->
  <rect x="930" y="382" width="110" height="198" fill="#FFFF00"/>
  <text x="985" y="368" font-size="16" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$38,400</text>
  <text x="985" y="602" font-size="12" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil</text>
  <text x="985" y="620" font-size="10" fill="#AAAA66" text-anchor="middle" font-family="'Geist Mono', monospace">All-in platform, ~0.1 FTE ops</text>

  <text x="900" y="655" font-size="12" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil ~2.1x cheaper once evaluation is required</text>

  <text x="600" y="685" font-size="11" fill="#777777" text-anchor="middle" font-family="'Geist Mono', monospace">
    The crossover is evaluation, not tracing. Full assumptions and per-line breakdown are in the article below.
  </text>
</svg>
