name: Checks

# Automatic checks on every pull request and on main.
# Each job is independent so one failure does not hide the others.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# One group per pull request, so a new push cancels that PR's older run.
# Pushes to main and merge queue runs get a unique group and are never cancelled.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs can be skipped, and lists them in `skipped` as ",a,b,".
  # - Push to main: if the same commit already passed this gate (the merge queue
  #   tests the exact commit that lands on main), every job is skipped.
  # - Pull request or merge queue: jobs are skipped only when the changed files
  #   cannot affect them (docs-only changes skip the app jobs, content-only changes skip
  #   types and lint; the SDK jobs run
  #   only for SDK or workflow changes).
  # Any lookup failure, or a file list too long to trust, skips nothing.
  # The gate below accepts a skipped job only if it is named here.
  precheck:
    name: Decide which checks to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      skipped: ${{ steps.plan.outputs.skipped }}
    steps:
      - name: Plan the run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          skipped=","
          add() { skipped="${skipped}$1,"; }
          known=false
          files=""

          if [ "$EVENT" = "push" ]; then
            passed=$(gh api "repos/$GH_REPO/commits/$SHA/check-runs?check_name=All%20checks%20passed&per_page=100" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length' || echo 0)
            if [ "${passed:-0}" -gt 0 ]; then
              for j in build static tests hygiene sdks; do add "$j"; done
            fi
          elif [ "$EVENT" = "pull_request" ]; then
            if files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
                --jq '.[] | .filename, (.previous_filename // empty)'); then
              [ "$(printf '%s\n' "$files" | wc -l)" -lt 2900 ] && known=true
            fi
          elif [ "$EVENT" = "merge_group" ]; then
            # A queue entry whose file tree is identical to the pull request
            # head that already passed this gate adds no new information, so
            # every job is skipped. Any other case (other pull requests ahead
            # in the group, or main moved) runs the full checks.
            pr=$(sed -nE 's#^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-.*#\1#p' <<< "$HEAD_REF")
            if [ -n "$pr" ]; then
              pr_head=$(gh api "repos/$GH_REPO/pulls/$pr" --jq .head.sha || echo "")
              if [ -n "$pr_head" ]; then
                queue_tree=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA" --jq .commit.tree.sha || echo a)
                pr_tree=$(gh api "repos/$GH_REPO/commits/$pr_head" --jq .commit.tree.sha || echo b)
                passed=$(gh api "repos/$GH_REPO/commits/$pr_head/check-runs?check_name=All%20checks%20passed&per_page=100" \
                  --jq '[.check_runs[] | select(.conclusion == "success")] | length' || echo 0)
                if [ "$queue_tree" = "$pr_tree" ] && [ "${passed:-0}" -gt 0 ]; then
                  for j in build static tests hygiene sdks; do add "$j"; done
                fi
              fi
            fi
            if files=$(gh api "repos/$GH_REPO/compare/$BASE_SHA...$HEAD_SHA" \
                --jq '.files[]? | .filename, (.previous_filename // empty)'); then
              [ "$(printf '%s\n' "$files" | wc -l)" -lt 290 ] && known=true
            fi
          fi

          if [ "$known" = true ]; then
            other=$(grep -Ev '^(docs/|[^/]+\.md$|LICENSE$|packages/python-sdk/)' <<< "$files" | grep -v '^$' || true)
            if [ -z "$other" ]; then
              for j in build static tests; do add "$j"; done
            fi
            # Blog and docs pointer bumps and media files hold no code, so types
            # and lint cannot change; the build and content tests still run.
            code=$(grep -Ev '^(docs/|content/|public/media/|[^/]+\.md$|LICENSE$|packages/python-sdk/)' <<< "$files" | grep -v '^$' || true)
            [ -z "$code" ] && add static
            grep -Eq '^(packages/(ts|python)-sdk/|\.github/)' <<< "$files" || add sdks
          fi

          echo "Skipped jobs: $skipped"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.site }})
    needs: [precheck]
    if: ${{ !contains(needs.precheck.outputs.skipped, ',build,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: [marketing, cloud]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_UNCOIL_DEPLOYMENT_KIND: ${{ matrix.site }}
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://example.convex.site
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ matrix.site }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ matrix.site }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - name: Scan browser bundles for server-only code
        run: |
          node --test scripts/scan-client-bundle.test.mjs
          node scripts/scan-client-bundle.mjs .next/static src convex

  # Types and lint share one install, so they use one runner slot.
  static:
    name: Code errors and style (types, lint)
    needs: [precheck]
    if: ${{ !contains(needs.precheck.outputs.skipped, ',static,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Ratchet: 22 warnings exist today. New warnings fail the job; lower
      # this number as existing ones are fixed, and drop to 0 when clear.
      - run: pnpm lint --max-warnings 0

  # Content, tool and unit tests share one install.
  tests:
    name: Tests (sites and unit)
    needs: [precheck]
    if: ${{ !contains(needs.precheck.outputs.skipped, ',tests,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:content
      - run: pnpm test:tools
      - run: pnpm test:ask-ai
      - run: pnpm test:activation
      - run: pnpm test:regions
      - run: pnpm test:consent
      - run: pnpm test:seo
      # The vitest half of `test:unit`; the node:test half (`test:tools`)
      # already ran above.
      - run: pnpm exec vitest run src

  # Checks that need no Node install: spelling and leaked keys.
  hygiene:
    name: Spelling and leaked keys
    needs: [precheck]
    if: ${{ !contains(needs.precheck.outputs.skipped, ',hygiene,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .codespellrc
      # Settings and the allow-word list live in .codespellrc.
      - run: pip install codespell==2.4.1
      - run: codespell
      - name: Scan with gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            ./gitleaks detect --source . --log-opts "$RANGE" --redact --verbose
          else
            ./gitleaks detect --source . --no-git --redact --verbose
          fi

  # Both SDKs in one job; it runs only for SDK or workflow changes.
  sdks:
    name: Tests (TypeScript and Python SDKs)
    needs: [precheck]
    if: ${{ !contains(needs.precheck.outputs.skipped, ',sdks,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/ts-sdk/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python-sdk/pyproject.toml
      - run: npm ci && npm run build && npm test
        working-directory: packages/ts-sdk
      - run: pip install -e ".[test]" && python -m pytest tests -q
        working-directory: packages/python-sdk

  # Single required check. The `needs` list below is the only place that
  # names the jobs to gate on; add any new job here.
  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [precheck, build, static, tests, hygiene, sdks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPED: ${{ needs.precheck.outputs.skipped }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "Skipped on purpose: $SKIPPED"
          # Failed and cancelled never pass. Skipped passes only for a job the
          # precheck named as safe to skip.
          if echo "$NEEDS" | jq -e --arg skipped "$SKIPPED" '
              to_entries | all(
                . as $e
                | $e.value.result == "success"
                or ($e.key != "precheck" and $e.value.result == "skipped"
                    and ($skipped | contains("," + $e.key + ",")))
              )' > /dev/null; then
            echo "All checks passed."
          else
            echo "One or more checks did not succeed."
            exit 1
          fi

  # Runs after the gate on pushes to main only. It reports the gate's result,
  # so it is not itself part of the gate's `needs` list.
  main-alert:
    name: Main failure alert
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [all-checks-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GATE_RESULT: ${{ needs.all-checks-passed.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Main checks failing
    steps:
      - name: Open, update or close the failure issue
        run: |
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "$GATE_RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Checks on main are passing again: $RUN_URL"
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing on commit $GITHUB_SHA: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The checks on main failed on commit $GITHUB_SHA: $RUN_URL"
          fi
