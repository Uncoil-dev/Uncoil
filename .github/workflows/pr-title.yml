name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check-title:
    name: Check PR title format
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'bot') }}
    steps:
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([^)]+\))?!?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must match type(scope): summary, where type is one of feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, security."
            echo "Got: $PR_TITLE"
            exit 1
          fi
