<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="45" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    LangWatch vs Uncoil
  </text>

  <!-- LangWatch panel: cost dashboard mock -->
  <rect x="80" y="90" width="480" height="480" fill="#0a0a0a" stroke="#8888FF" stroke-width="2"/>
  <text x="320" y="125" font-size="18" fill="#8888FF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">LangWatch — cost dashboard</text>

  <rect x="110" y="150" width="420" height="70" fill="#151530" stroke="#8888FF" stroke-width="1"/>
  <text x="130" y="175" font-size="12" fill="#AAAAFF" font-family="'Geist Mono', monospace">Monthly spend by model</text>
  <rect x="130" y="185" width="130" height="14" fill="#8888FF"/>
  <rect x="270" y="185" width="90" height="14" fill="#6666CC"/>
  <rect x="370" y="185" width="60" height="14" fill="#4444AA"/>

  <rect x="110" y="235" width="420" height="150" fill="#151530" stroke="#8888FF" stroke-width="1"/>
  <text x="130" y="260" font-size="12" fill="#AAAAFF" font-family="'Geist Mono', monospace">Cost trend (30 days)</text>
  <polyline points="130,370 180,350 230,355 280,330 330,320 380,300 430,295 480,280 510,270" stroke="#8888FF" stroke-width="2" fill="none"/>

  <rect x="110" y="400" width="420" height="150" fill="#151530" stroke="#8888FF" stroke-width="1"/>
  <text x="130" y="425" font-size="12" fill="#AAAAFF" font-family="'Geist Mono', monospace">Self-hosted infrastructure</text>
  <text x="130" y="450" font-size="11" fill="#CCCCFF" font-family="'Geist Mono', monospace">Docker · Postgres · Redis</text>
  <text x="130" y="470" font-size="11" fill="#CCCCFF" font-family="'Geist Mono', monospace">Open-source, full data control</text>
  <text x="130" y="500" font-size="24" fill="#8888FF" font-family="'Geist Mono', monospace" font-weight="bold">No evaluation layer</text>

  <!-- Uncoil panel: experiment tracking mock -->
  <rect x="640" y="90" width="480" height="480" fill="#0a0a0a" stroke="#44FF44" stroke-width="2"/>
  <text x="880" y="125" font-size="18" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil — experiment tracking</text>

  <rect x="670" y="150" width="420" height="90" fill="#0f1f0f" stroke="#44FF44" stroke-width="1"/>
  <text x="690" y="175" font-size="12" fill="#88FF88" font-family="'Geist Mono', monospace">Experiment: prompt v2 vs v3</text>
  <text x="690" y="200" font-size="12" fill="#CCFFCC" font-family="'Geist Mono', monospace">Quality: 94% → 97%  (+3pt)</text>
  <text x="690" y="220" font-size="12" fill="#CCFFCC" font-family="'Geist Mono', monospace">Cost/call: $0.014 → $0.011</text>

  <rect x="670" y="250" width="420" height="130" fill="#0f1f0f" stroke="#44FF44" stroke-width="1"/>
  <text x="690" y="275" font-size="12" fill="#88FF88" font-family="'Geist Mono', monospace">Evaluation scores</text>
  <rect x="690" y="290" width="380" height="12" fill="#224422"/>
  <rect x="690" y="290" width="330" height="12" fill="#44FF44"/>
  <rect x="690" y="310" width="380" height="12" fill="#224422"/>
  <rect x="690" y="310" width="360" height="12" fill="#44FF44"/>
  <rect x="690" y="330" width="380" height="12" fill="#224422"/>
  <rect x="690" y="330" width="300" height="12" fill="#44FF44"/>

  <rect x="670" y="395" width="420" height="155" fill="#0f1f0f" stroke="#44FF44" stroke-width="1"/>
  <text x="690" y="420" font-size="12" fill="#88FF88" font-family="'Geist Mono', monospace">Managed platform</text>
  <text x="690" y="445" font-size="11" fill="#CCFFCC" font-family="'Geist Mono', monospace">No infrastructure to operate</text>
  <text x="690" y="465" font-size="11" fill="#CCFFCC" font-family="'Geist Mono', monospace">Cost tracking + evaluation, unified</text>
  <text x="690" y="500" font-size="24" fill="#44FF44" font-family="'Geist Mono', monospace" font-weight="bold">Eval built in</text>

  <text x="600" y="630" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    Same cost-visibility goal, different trade-off: self-hosted control vs. managed evaluation
  </text>
</svg>