<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sT sD"><title id="sT">A staircase of 25 bars showing how many input tokens each model call re-reads in a looping run, growing from two thousand to one hundred forty-six thousand</title><desc id="sD">Twenty-five yellow bars climb from left to right. Call 1 reads 2,000 tokens, call 2 reads 8,000, call 10 reads 56,000 and call 25 reads 146,000. A thin cream line near the floor marks the 3,200 tokens a normal run reads at its last call. A label on the last bar says call 25 alone costs forty-four cents.</desc><rect width="1600" height="640" fill="#0a0a0a"/><text x="70" y="55" fill="#f4d44d" font-family="monospace" font-size="18" text-anchor="start" opacity="1" font-weight="normal" letter-spacing="2">WHY ONE LOOP GETS EXPENSIVE</text><text x="70" y="82" fill="#f6f1e6" font-family="monospace" font-size="13" text-anchor="start" opacity="0.6" font-weight="normal" letter-spacing="0">every call re-reads the whole conversation, including every error blob so far</text><rect x="100" y="515" width="44" height="5" fill="#f4d44d"/><text x="122.0" y="505.3424657534247" fill="#f4d44d" font-family="monospace" font-size="12" text-anchor="middle" opacity="1" font-weight="bold" letter-spacing="0">2k</text><text x="122.0" y="542" fill="#f6f1e6" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.7" font-weight="normal" letter-spacing="0">#1</text><rect x="156" y="501" width="44" height="19" fill="#f4d44d"/><text x="178.0" y="491.36986301369865" fill="#f4d44d" font-family="monospace" font-size="12" text-anchor="middle" opacity="1" font-weight="bold" letter-spacing="0">8k</text><rect x="212" y="487" width="44" height="33" fill="#f4d44d"/><rect x="268" y="473" width="44" height="47" fill="#f4d44d"/><rect x="324" y="459" width="44" height="61" fill="#f4d44d"/><text x="346.0" y="449.45205479452056" fill="#f4d44d" font-family="monospace" font-size="12" text-anchor="middle" opacity="1" font-weight="bold" letter-spacing="0">26k</text><text x="346.0" y="542" fill="#f6f1e6" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.7" font-weight="normal" letter-spacing="0">#5</text><rect x="380" y="445" width="44" height="75" fill="#f4d44d"/><rect x="436" y="432" width="44" height="88" fill="#f4d44d"/><rect x="492" y="418" width="44" height="102" fill="#f4d44d"/><rect x="548" y="404" width="44" height="116" fill="#f4d44d"/><rect x="604" y="390" width="44" height="130" fill="#f4d44d"/><text x="626.0" y="379.5890410958904" fill="#f4d44d" font-family="monospace" font-size="12" text-anchor="middle" opacity="1" font-weight="bold" letter-spacing="0">56k</text><text x="626.0" y="542" fill="#f6f1e6" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.7" font-weight="normal" letter-spacing="0">#10</text><rect x="660" y="376" width="44" height="144" fill="#f4d44d"/><rect x="716" y="362" width="44" height="158" fill="#f4d44d"/><rect x="772" y="348" width="44" height="172" fill="#f4d44d"/><rect x="828" y="334" width="44" height="186" fill="#f4d44d"/><rect x="884" y="320" width="44" height="200" fill="#f4d44d"/><text x="906.0" y="542" fill="#f6f1e6" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.7" font-weight="normal" letter-spacing="0">#15</text><rect x="940" y="306" width="44" height="214" fill="#f4d44d"/><rect x="996" y="292" width="44" height="228" fill="#f4d44d"/><text x="1018.0" y="281.7808219178082" fill="#f4d44d" font-family="monospace" font-size="12" text-anchor="middle" opacity="1" font-weight="bold" letter-spacing="0">98k</text><rect x="1052" y="278" width="44" height="242" fill="#e2694f"/><rect x="1108" y="264" width="44" height="256" fill="#e2694f"/><rect x="1164" y="250" width="44" height="270" fill="#e2694f"/><text x="1186.0" y="542" fill="#f6f1e6" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.7" font-weight="normal" letter-spacing="0">#20</text><rect x="1220" y="236" width="44" height="284" fill="#e2694f"/><rect x="1276" y="222" width="44" height="298" fill="#e2694f"/><rect x="1332" y="208" width="44" height="312" fill="#e2694f"/><rect x="1388" y="194" width="44" height="326" fill="#e2694f"/><rect x="1444" y="180" width="44" height="340" fill="#e2694f"/><text x="1466.0" y="170.0" fill="#e2694f" font-family="monospace" font-size="12" text-anchor="middle" opacity="1" font-weight="bold" letter-spacing="0">146k</text><text x="1466.0" y="542" fill="#f6f1e6" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.7" font-weight="normal" letter-spacing="0">#25</text><line x1="90" y1="520" x2="1500" y2="520" stroke="#f6f1e6" stroke-opacity="0.6" stroke-width="2"/><line x1="90" y1="513" x2="1500" y2="513" stroke="#f6f1e6" stroke-opacity="0.8" stroke-dasharray="5,5"/><text x="100" y="566" fill="#f6f1e6" font-family="monospace" font-size="12" text-anchor="start" opacity="0.8" font-weight="normal" letter-spacing="0">dashed line: a normal run never reads more than 3.2k tokens</text><text x="100" y="150" fill="#f6f1e6" font-family="monospace" font-size="12" text-anchor="start" opacity="0.7" font-weight="normal" letter-spacing="0">call 25 alone</text><text x="100" y="188" fill="#e2694f" font-family="monospace" font-size="30" text-anchor="start" opacity="1" font-weight="bold" letter-spacing="0">$0.44</text><text x="100" y="210" fill="#f6f1e6" font-family="monospace" font-size="12" text-anchor="start" opacity="0.7" font-weight="normal" letter-spacing="0">more than ten whole normal runs</text><text x="70" y="600" fill="#f6f1e6" font-family="monospace" font-size="11" text-anchor="start" opacity="0.45" font-weight="normal" letter-spacing="0">Model: 2,000 base tokens + 6,000 tokens of error payload added per loop, 150 output tokens per call, $3 / $15 per million tokens (illustrative).</text></svg>
