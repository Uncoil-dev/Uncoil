<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agChainTitle agChainDesc">
  <title id="agChainTitle">A nested tool-call chain across three delegated agents with per-hop cost and latency</title>
  <desc id="agChainDesc">A black canvas shows a root agent box on the left connecting through three nested tool-call hops to a sub-agent, then a second sub-agent, each hop annotated with latency and cost, illustrating how observability must sum cost and attribute failure across delegated hops, not just the root call.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="800" y="60" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">DELEGATED TOOL-CALL CHAIN</text>

  <g font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="80" y="380" width="240" height="100" fill="#f4d44d"/>
    <text x="200" y="425" fill="#0a0a0a">ROOT AGENT</text>
    <text x="200" y="450" fill="#0a0a0a" font-size="12">run_id: run_7c2</text>

    <line x1="320" y1="430" x2="440" y2="430" stroke="#f6f1e6" stroke-width="3"/>
    <text x="380" y="410" fill="#f6f1e6" font-size="11">210ms</text>

    <rect x="440" y="380" width="240" height="100" fill="#f6f1e6"/>
    <text x="560" y="425" fill="#0a0a0a">SUB-AGENT A</text>
    <text x="560" y="450" fill="#0a0a0a" font-size="12">$0.006</text>

    <line x1="680" y1="430" x2="800" y2="430" stroke="#f6f1e6" stroke-width="3"/>
    <text x="740" y="410" fill="#f6f1e6" font-size="11">640ms</text>

    <rect x="800" y="380" width="240" height="100" fill="#f6f1e6"/>
    <text x="920" y="425" fill="#0a0a0a">SUB-AGENT B</text>
    <text x="920" y="450" fill="#0a0a0a" font-size="12">$0.011</text>

    <line x1="1040" y1="430" x2="1160" y2="430" stroke="#e2543a" stroke-width="3" stroke-dasharray="6,6"/>
    <text x="1100" y="410" fill="#e2543a" font-size="11">timeout</text>

    <rect x="1160" y="380" width="280" height="100" fill="none" stroke="#e2543a" stroke-width="3"/>
    <text x="1300" y="420" fill="#e2543a">EXTERNAL TOOL</text>
    <text x="1300" y="445" fill="#f6f1e6" font-size="12">retries: 2 · failed</text>
    <text x="1300" y="465" fill="#f6f1e6" font-size="11">cost still attributed to root</text>
  </g>

  <text x="800" y="620" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="14">uncoil.dev · one root run_id, summed cost, and per-hop attribution across every delegated agent</text>
</svg>
