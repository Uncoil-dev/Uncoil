<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="46" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Monthly Observability Cost at Scale
  </text>
  <text x="600" y="74" font-size="14" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">
    Datadog per-span billing vs Uncoil per-trace billing, by monthly agent interaction volume
  </text>

  <!-- Axes -->
  <line x1="140" y1="600" x2="1120" y2="600" stroke="#555555" stroke-width="2"/>
  <line x1="140" y1="120" x2="140" y2="600" stroke="#555555" stroke-width="2"/>

  <!-- Y axis gridlines and labels ($0 to $16,000) -->
  <text x="120" y="605" font-size="12" fill="#888888" text-anchor="end" font-family="'Geist Mono', monospace">$0</text>
  <line x1="140" y1="500" x2="1120" y2="500" stroke="#222222" stroke-width="1"/>
  <text x="120" y="505" font-size="12" fill="#888888" text-anchor="end" font-family="'Geist Mono', monospace">$4,000</text>
  <line x1="140" y1="400" x2="1120" y2="400" stroke="#222222" stroke-width="1"/>
  <text x="120" y="405" font-size="12" fill="#888888" text-anchor="end" font-family="'Geist Mono', monospace">$8,000</text>
  <line x1="140" y1="300" x2="1120" y2="300" stroke="#222222" stroke-width="1"/>
  <text x="120" y="305" font-size="12" fill="#888888" text-anchor="end" font-family="'Geist Mono', monospace">$12,000</text>
  <line x1="140" y1="200" x2="1120" y2="200" stroke="#222222" stroke-width="1"/>
  <text x="120" y="205" font-size="12" fill="#888888" text-anchor="end" font-family="'Geist Mono', monospace">$16,000</text>

  <!-- Group 1: 100K interactions/month -->
  <text x="330" y="630" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">100K interactions/mo</text>

  <!-- Datadog bar: midpoint $1,750 -> height 43.75px (scale: 400px = $16,000, 0.025px/$) -->
  <rect x="230" y="556" width="80" height="44" fill="#FF6B6B" opacity="0.85"/>
  <text x="270" y="546" font-size="13" fill="#FF6B6B" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$1,500-2,000</text>

  <!-- Uncoil bar: midpoint $400 -> height 10px -->
  <rect x="350" y="590" width="80" height="10" fill="#44FF44" opacity="0.85"/>
  <text x="390" y="580" font-size="13" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$300-500</text>

  <!-- Group 2: 1M interactions/month -->
  <text x="830" y="630" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">1M interactions/mo</text>

  <!-- Datadog bar: midpoint $11,500 -> height 287.5px -->
  <rect x="730" y="313" width="80" height="287" fill="#FF6B6B" opacity="0.85"/>
  <text x="770" y="303" font-size="13" fill="#FF6B6B" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$8,000-15,000</text>

  <!-- Uncoil bar: midpoint $3,000 -> height 75px -->
  <rect x="850" y="525" width="80" height="75" fill="#44FF44" opacity="0.85"/>
  <text x="890" y="515" font-size="13" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">$2,000-4,000</text>

  <!-- Legend -->
  <rect x="140" y="130" width="18" height="18" fill="#FF6B6B" opacity="0.85"/>
  <text x="166" y="144" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">Datadog (per-span billing)</text>
  <rect x="400" y="130" width="18" height="18" fill="#44FF44" opacity="0.85"/>
  <text x="426" y="144" font-size="13" fill="#FFFFFF" font-family="'Geist Mono', monospace">Uncoil (per-trace billing)</text>

  <!-- Bottom insight strip -->
  <rect x="140" y="655" width="980" height="34" fill="#1a1a1a" stroke="#FFFF00" stroke-width="1"/>
  <text x="600" y="677" font-size="13" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    The gap widens with volume: roughly 3-4x at 100K interactions, 4-5x at 1M interactions/month
  </text>
</svg>
