<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="48" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Langfuse vs Uncoil — stack and setup time
  </text>
  <text x="600" y="76" font-size="14" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    Self-hosted control vs. a managed platform you don't operate
  </text>

  <!-- Langfuse stack: self-hosted, stacked boxes -->
  <rect x="70" y="110" width="480" height="430" fill="#0a0a0a" stroke="#FFFFFF" stroke-width="2"/>
  <text x="310" y="142" font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Langfuse — self-hosted stack</text>
  <text x="310" y="163" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Runs inside your VPC</text>

  <rect x="100" y="185" width="420" height="52" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="120" y="216" font-size="14" fill="#FFFFFF" font-family="'Geist Mono', monospace">Ingestion servers (Kubernetes)</text>

  <rect x="100" y="247" width="420" height="52" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="120" y="278" font-size="14" fill="#FFFFFF" font-family="'Geist Mono', monospace">Postgres (primary + replica)</text>

  <rect x="100" y="309" width="420" height="52" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="120" y="340" font-size="14" fill="#FFFFFF" font-family="'Geist Mono', monospace">Redis cache</text>

  <rect x="100" y="371" width="420" height="52" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="120" y="402" font-size="14" fill="#FFFFFF" font-family="'Geist Mono', monospace">Evaluation: external scripts + glue code</text>

  <rect x="100" y="440" width="420" height="80" fill="#151515" stroke="#FFFF00" stroke-width="1"/>
  <text x="120" y="466" font-size="12" fill="#CCCCCC" font-family="'Geist Mono', monospace">Setup time to first trace</text>
  <text x="120" y="496" font-size="26" fill="#FFFF00" font-family="'Geist Mono', monospace" font-weight="bold">2-3 weeks</text>

  <!-- Uncoil stack: one managed box -->
  <rect x="650" y="110" width="480" height="430" fill="#0a0a0a" stroke="#FFFF00" stroke-width="2"/>
  <text x="890" y="142" font-size="18" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil — managed platform</text>
  <text x="890" y="163" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">You operate nothing</text>

  <rect x="680" y="185" width="420" height="236" fill="#1a1a08" stroke="#FFFF00" stroke-width="1"/>
  <text x="700" y="212" font-size="14" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Tracing + spans + sessions</text>
  <text x="700" y="242" font-size="14" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Native evaluation + LLM-as-judge</text>
  <text x="700" y="272" font-size="14" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Automatic per-call cost tracking</text>
  <text x="700" y="302" font-size="14" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Experiment framework</text>
  <text x="700" y="332" font-size="14" fill="#FFFF00" font-family="'Geist Mono', monospace">✓ Multi-turn session rollups</text>
  <text x="700" y="392" font-size="12" fill="#CCCCCC" font-family="'Geist Mono', monospace">Infrastructure, scaling, backups: managed</text>

  <rect x="680" y="440" width="420" height="80" fill="#1a1a08" stroke="#FFFF00" stroke-width="1"/>
  <text x="700" y="466" font-size="12" fill="#CCCCCC" font-family="'Geist Mono', monospace">Setup time to first trace</text>
  <text x="700" y="496" font-size="26" fill="#FFFF00" font-family="'Geist Mono', monospace" font-weight="bold">~15 minutes</text>

  <!-- Bottom stat strip -->
  <rect x="70" y="560" width="1060" height="105" fill="#0a0a0a" stroke="#666666" stroke-width="1"/>
  <text x="600" y="588" font-size="13" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Time to production-ready evaluation (100k calls/month, 12-engineer team)</text>

  <text x="310" y="622" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Langfuse self-hosted: 9 weeks</text>
  <rect x="130" y="632" width="360" height="14" fill="#222222"/>
  <rect x="130" y="632" width="330" height="14" fill="#FFFFFF"/>

  <text x="890" y="622" font-size="15" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil: 2-3 days</text>
  <rect x="710" y="632" width="360" height="14" fill="#222222"/>
  <rect x="710" y="632" width="16" height="14" fill="#FFFF00"/>

  <text x="600" y="685" font-size="12" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    Full worked cost comparison and scenario detail in the article below
  </text>
</svg>
