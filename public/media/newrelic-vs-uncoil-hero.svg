<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="45" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Full-Stack Pyramid vs. Agent-Native Funnel
  </text>

  <!-- New Relic pyramid -->
  <text x="300" y="90" font-size="17" fill="#8888FF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">New Relic</text>

  <polygon points="300,110 180,180 420,180" fill="#151530" stroke="#8888FF" stroke-width="2"/>
  <text x="300" y="160" font-size="11" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">LLM monitoring</text>
  <text x="300" y="173" font-size="9" fill="#AAAAFF" text-anchor="middle" font-family="'Geist Mono', monospace">(bolted on, 2024+)</text>

  <polygon points="180,180 420,180 460,270 140,270" fill="#151530" stroke="#8888FF" stroke-width="2"/>
  <text x="300" y="220" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">APM</text>
  <text x="300" y="240" font-size="10" fill="#AAAAFF" text-anchor="middle" font-family="'Geist Mono', monospace">services, transactions</text>

  <polygon points="140,270 460,270 510,380 90,380" fill="#151530" stroke="#8888FF" stroke-width="2"/>
  <text x="300" y="320" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Infrastructure</text>
  <text x="300" y="340" font-size="10" fill="#AAAAFF" text-anchor="middle" font-family="'Geist Mono', monospace">hosts, containers, k8s</text>
  <text x="300" y="360" font-size="10" fill="#AAAAFF" text-anchor="middle" font-family="'Geist Mono', monospace">logs, metrics, traces</text>

  <text x="300" y="420" font-size="12" fill="#8888FF" text-anchor="middle" font-family="'Geist Mono', monospace">Billing: per-GB ingest</text>
  <text x="300" y="438" font-size="12" fill="#8888FF" text-anchor="middle" font-family="'Geist Mono', monospace">+ per-user seat</text>

  <!-- Uncoil funnel -->
  <text x="900" y="90" font-size="17" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil</text>

  <polygon points="780,110 1020,110 960,220 840,220" fill="#0f1f0f" stroke="#44FF44" stroke-width="2"/>
  <text x="900" y="150" font-size="12" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Agent traces</text>
  <text x="900" y="170" font-size="11" fill="#88FF88" text-anchor="middle" font-family="'Geist Mono', monospace">tool calls, LLM calls,</text>
  <text x="900" y="188" font-size="11" fill="#88FF88" text-anchor="middle" font-family="'Geist Mono', monospace">multi-turn sessions</text>

  <polygon points="840,220 960,220 930,300 870,300" fill="#0f1f0f" stroke="#44FF44" stroke-width="2"/>
  <text x="900" y="255" font-size="11" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Cost + eval</text>
  <text x="900" y="272" font-size="10" fill="#88FF88" text-anchor="middle" font-family="'Geist Mono', monospace">native, automatic</text>

  <polygon points="870,300 930,300 910,380 890,380" fill="#0f1f0f" stroke="#44FF44" stroke-width="2"/>

  <text x="900" y="420" font-size="12" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace">Billing: per-interaction</text>
  <text x="900" y="438" font-size="12" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace">flat tier</text>

  <rect x="100" y="500" width="1000" height="120" fill="none" stroke="#FFFF00" stroke-width="2" rx="4"/>
  <text x="600" y="530" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">
    New Relic's LLM layer sits on top of infrastructure billing designed for a different shape of workload.
  </text>
  <text x="600" y="555" font-size="13" fill="#CCCC00" text-anchor="middle" font-family="'Geist Mono', monospace">
    An agent call that spans 8-12 spans (LLM calls, tool calls, retries) gets billed as 8-12 ingest events.
  </text>
  <text x="600" y="580" font-size="13" fill="#CCCC00" text-anchor="middle" font-family="'Geist Mono', monospace">
    Uncoil was built agent-first: one interaction, one price, evaluation and cost attached natively.
  </text>
  <text x="600" y="603" font-size="12" fill="#999900" text-anchor="middle" font-family="'Geist Mono', monospace">
    Neither approach is wrong — they were optimized for different questions.
  </text>
</svg>