<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">A ledger card with a fixed token allowance split into lines and a yellow reserve line</title><desc id="d">A cream card lists five prompt lines as black bars and a separate yellow bar for the reserved answer below a dashed divider.</desc><rect width="1600" height="760" fill="#0a0a0a"/><g font-family="monospace"><rect x="460" y="70" width="680" height="620" fill="#f6f1e6" stroke="#0a0a0a" stroke-width="3"/><text x="500" y="125" fill="#0a0a0a" font-size="22" letter-spacing="3">TOKEN ALLOWANCE</text><text x="500" y="192" fill="#0a0a0a" font-size="17">system</text><rect x="660" y="170" width="155" height="30" fill="#0a0a0a"/><text x="500" y="252" fill="#0a0a0a" font-size="17">tools</text><rect x="660" y="230" width="207" height="30" fill="#0a0a0a"/><text x="500" y="312" fill="#0a0a0a" font-size="17">history</text><rect x="660" y="290" width="440" height="30" fill="#0a0a0a"/><text x="500" y="372" fill="#0a0a0a" font-size="17">retrieved</text><rect x="660" y="350" width="284" height="30" fill="#0a0a0a"/><text x="500" y="432" fill="#0a0a0a" font-size="17">user</text><rect x="660" y="410" width="103" height="30" fill="#0a0a0a"/><line x1="500" y1="490" x2="1100" y2="490" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="8 6"/><text x="500" y="545" fill="#0a0a0a" font-size="17">reserved answer</text><rect x="660" y="520" width="300" height="38" fill="#f4d44d" stroke="#0a0a0a" stroke-width="2"/><text x="500" y="640" fill="#0a0a0a" font-size="17">ceiling = min(window - reserve, cap)</text></g></svg>