<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pT pD"><title id="pT">Two views of one weekend: almost every run costs about four cents, ninety runs cost over five dollars each and make up two thirds of the spend</title><desc id="pD">Left: a histogram with one tall yellow pile of 5,910 normal runs near four cents and a short red pile of 90 looping runs near five dollars sixty, with a long empty gap between. Right: a single bar of the weekend spend, thirty-two percent from normal runs and sixty-eight percent from the looping runs.</desc><rect width="1600" height="640" fill="#0a0a0a"/><text x="70" y="55" fill="#f4d44d" font-family="monospace" font-size="18" text-anchor="start" opacity="1" font-weight="normal" letter-spacing="2">ONE WEEKEND, 6,000 RUNS</text><text x="70" y="82" fill="#f6f1e6" font-family="monospace" font-size="13" text-anchor="start" opacity="0.6" font-weight="normal" letter-spacing="0">the pile and the tail — the average describes neither</text><line x1="90" y1="470" x2="980" y2="470" stroke="#f6f1e6" stroke-opacity="0.6" stroke-width="2"/><rect x="110" y="180" width="70" height="290" fill="#f4d44d"/><text x="145" y="170" fill="#f4d44d" font-family="monospace" font-size="14" text-anchor="middle" opacity="1" font-weight="bold" letter-spacing="0">5,910 runs</text><text x="145" y="494" fill="#f6f1e6" font-family="monospace" font-size="14" text-anchor="middle" opacity="1" font-weight="normal" letter-spacing="0">$0.04</text><rect x="840" y="448" width="70" height="22" fill="#e2694f"/><text x="875" y="436" fill="#e2694f" font-family="monospace" font-size="14" text-anchor="middle" opacity="1" font-weight="bold" letter-spacing="0">90 runs</text><text x="875" y="494" fill="#f6f1e6" font-family="monospace" font-size="14" text-anchor="middle" opacity="1" font-weight="normal" letter-spacing="0">$5.61</text><line x1="200" y1="360" x2="820" y2="360" stroke="#f6f1e6" stroke-opacity="0.35" stroke-dasharray="6,6"/><text x="515.0" y="346" fill="#f6f1e6" font-family="monospace" font-size="13" text-anchor="middle" opacity="0.55" font-weight="normal" letter-spacing="0">nothing in between</text><line x1="145" y1="510" x2="145" y2="532" stroke="#f6f1e6" stroke-width="2"/><text x="145" y="552" fill="#f6f1e6" font-family="monospace" font-size="12" text-anchor="middle" opacity="1" font-weight="normal" letter-spacing="0">median $0.0402</text><line x1="420" y1="410" x2="420" y2="470" stroke="#f4d44d" stroke-width="2" stroke-dasharray="4,4"/><text x="428" y="404" fill="#f4d44d" font-family="monospace" font-size="12" text-anchor="start" opacity="1" font-weight="normal" letter-spacing="0">mean $0.1237 — matches no real run</text><text x="690" y="552" fill="#f6f1e6" font-family="monospace" font-size="11" text-anchor="start" opacity="0.45" font-weight="normal" letter-spacing="0">cost per run (not to scale)</text><text x="1040" y="170" fill="#f4d44d" font-family="monospace" font-size="13" text-anchor="start" opacity="1" font-weight="normal" letter-spacing="1">WHERE THE MONEY WENT</text><rect x="1060" y="200" width="60" height="190" fill="#e2694f"/><rect x="1060" y="390" width="60" height="90" fill="#f4d44d"/><text x="1136" y="289.2" fill="#e2694f" font-family="monospace" font-size="28" text-anchor="start" opacity="1" font-weight="bold" letter-spacing="0">68%</text><text x="1136" y="311.2" fill="#f6f1e6" font-family="monospace" font-size="14" text-anchor="start" opacity="1" font-weight="normal" letter-spacing="0">$504.56</text><text x="1136" y="329.2" fill="#f6f1e6" font-family="monospace" font-size="12" text-anchor="start" opacity="0.7" font-weight="normal" letter-spacing="0">from 90 looping runs</text><text x="1136" y="437.2" fill="#f4d44d" font-family="monospace" font-size="22" text-anchor="start" opacity="1" font-weight="bold" letter-spacing="0">32%</text><text x="1136" y="457.2" fill="#f6f1e6" font-family="monospace" font-size="12" text-anchor="start" opacity="0.7" font-weight="normal" letter-spacing="0">$237.58 · 5,910 runs</text><text x="1040" y="530" fill="#f6f1e6" font-family="monospace" font-size="14" text-anchor="start" opacity="1" font-weight="normal" letter-spacing="0">total $742.14</text><text x="70" y="615" fill="#f6f1e6" font-family="monospace" font-size="11" text-anchor="start" opacity="0.45" font-weight="normal" letter-spacing="0">Demo data generated by the cost model in this article. No customer, no real invoices.</text></svg>
