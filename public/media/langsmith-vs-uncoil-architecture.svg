<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="42" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Where the Bill Gets Decided: Two Ingestion Paths
  </text>
  <text x="600" y="66" font-size="14" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">
    A quota gate sits inside one pipeline. It does not exist in the other.
  </text>

  <!-- LangSmith column -->
  <text x="300" y="105" font-size="18" fill="#FF4444" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">LangSmith</text>

  <rect x="150" y="125" width="300" height="55" fill="#1a1a1a" stroke="#FFFFFF" stroke-width="1"/>
  <text x="300" y="148" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Your app</text>
  <text x="300" y="166" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">LangChain / LCEL (best fit)</text>

  <line x1="300" y1="180" x2="300" y2="205" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="300,213 294,203 306,203" fill="#FFFFFF"/>

  <rect x="150" y="215" width="300" height="50" fill="#1a1a1a" stroke="#FFFFFF" stroke-width="1"/>
  <text x="300" y="245" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">LangSmith SDK / tracer</text>

  <line x1="300" y1="265" x2="300" y2="290" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="300,298 294,288 306,288" fill="#FFFFFF"/>

  <rect x="150" y="300" width="300" height="70" fill="#3a1414" stroke="#FF4444" stroke-width="2"/>
  <text x="300" y="325" font-size="13" fill="#FF8888" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Quota gate</text>
  <text x="300" y="343" font-size="11" fill="#FFCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">included traces vs. plan cap</text>
  <text x="300" y="359" font-size="11" fill="#FFCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">over cap -&gt; $2.50 / 1K billed</text>

  <line x1="300" y1="370" x2="300" y2="395" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="300,403 294,393 306,393" fill="#FFFFFF"/>

  <rect x="150" y="405" width="300" height="55" fill="#1a1a1a" stroke="#FFFFFF" stroke-width="1"/>
  <text x="300" y="428" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">LangSmith Cloud</text>
  <text x="300" y="446" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">(or negotiated on-prem)</text>

  <line x1="300" y1="460" x2="300" y2="485" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="300,493 294,483 306,483" fill="#FFFFFF"/>

  <rect x="150" y="495" width="300" height="60" fill="#1a1a1a" stroke="#FFFFFF" stroke-width="1"/>
  <text x="300" y="518" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Trace store + prompt hub</text>
  <text x="300" y="536" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">versioning, playground, evals</text>

  <rect x="150" y="575" width="300" height="45" fill="none" stroke="#FF4444" stroke-width="2"/>
  <text x="300" y="602" font-size="13" fill="#FF4444" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Invoice = base + overage</text>

  <!-- Divider -->
  <line x1="600" y1="90" x2="600" y2="630" stroke="#333333" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Uncoil column -->
  <text x="900" y="105" font-size="18" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil</text>

  <rect x="750" y="125" width="300" height="55" fill="#1a1a1a" stroke="#FFFFFF" stroke-width="1"/>
  <text x="900" y="148" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Your app</text>
  <text x="900" y="166" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">any framework or raw SDK calls</text>

  <line x1="900" y1="180" x2="900" y2="205" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="900,213 894,203 906,203" fill="#FFFFFF"/>

  <rect x="750" y="215" width="300" height="50" fill="#1a1a1a" stroke="#FFFFFF" stroke-width="1"/>
  <text x="900" y="245" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil SDK (OpenTelemetry)</text>

  <line x1="900" y1="265" x2="900" y2="290" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="900,298 894,288 906,288" fill="#FFFFFF"/>

  <rect x="750" y="300" width="300" height="70" fill="#0f2a0f" stroke="#44FF44" stroke-width="2"/>
  <text x="900" y="325" font-size="13" fill="#88FF88" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Ingest API -&gt; Inngest</text>
  <text x="900" y="343" font-size="11" fill="#CCFFCC" text-anchor="middle" font-family="'Geist Mono', monospace">no quota check, no per-trace meter</text>
  <text x="900" y="359" font-size="11" fill="#CCFFCC" text-anchor="middle" font-family="'Geist Mono', monospace">every trace passes through</text>

  <line x1="900" y1="370" x2="900" y2="395" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="900,403 894,393 906,393" fill="#FFFFFF"/>

  <rect x="750" y="405" width="300" height="55" fill="#1a1a1a" stroke="#FFFFFF" stroke-width="1"/>
  <text x="900" y="424" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Tinybird + Convex + Redis</text>
  <text x="900" y="442" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">spans, run metadata, API cache</text>

  <line x1="900" y1="460" x2="900" y2="485" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="900,493 894,483 906,483" fill="#FFFFFF"/>

  <rect x="750" y="495" width="300" height="60" fill="#1a1a1a" stroke="#FFFFFF" stroke-width="1"/>
  <text x="900" y="518" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Dashboard + evals + cost views</text>
  <text x="900" y="536" font-size="11" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">full-fidelity, no sampling default</text>

  <rect x="750" y="575" width="300" height="45" fill="none" stroke="#44FF44" stroke-width="2"/>
  <text x="900" y="602" font-size="13" fill="#44FF44" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Invoice = flat tier, period.</text>

  <text x="600" y="670" font-size="12" fill="#888888" text-anchor="middle" font-family="'Geist Mono', monospace">
    The quota gate is a pricing decision, not a technical requirement -- both pipelines can capture 100% of traces.
  </text>
</svg>
