<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Illustrative cost of one 12-step agent run under six changes, as horizontal bars</title><desc id="d">A yellow baseline bar for 27 cents is the longest. Shorter cream bars show the same run with lean tool results, a cached prefix, trimmed history, trimming plus caching, and stopping at six steps, which is the shortest at about 9 cents.</desc><rect width="1600" height="760" fill="#0a0a0a"/><g font-family="monospace"><text x="70" y="100" fill="#f6f1e6" font-size="22" letter-spacing="3">ONE RUN, SIX CHANGES (ILLUSTRATIVE PLACEHOLDER RATES)</text><text x="70" y="200" fill="#f6f1e6" font-size="19">baseline, 12 steps</text><rect x="400" y="170" width="760" height="44" fill="#f4d44d"/><text x="1176" y="200" fill="#f6f1e6" font-size="19">$0.2712</text><text x="70" y="286" fill="#f6f1e6" font-size="19">lean tool results</text><rect x="400" y="256" width="464" height="44" fill="#f6f1e6"/><text x="880" y="286" fill="#f6f1e6" font-size="19">$0.1656</text><text x="70" y="372" fill="#f6f1e6" font-size="19">cached prefix</text><rect x="400" y="342" width="598" height="44" fill="#f6f1e6"/><text x="1014" y="372" fill="#f6f1e6" font-size="19">$0.2135</text><text x="70" y="458" fill="#f6f1e6" font-size="19">trim to 4 steps</text><rect x="400" y="428" width="572" height="44" fill="#f6f1e6"/><text x="988" y="458" fill="#f6f1e6" font-size="19">$0.2040</text><text x="70" y="544" fill="#f6f1e6" font-size="19">trim + cache</text><rect x="400" y="514" width="410" height="44" fill="#f6f1e6"/><text x="826" y="544" fill="#f6f1e6" font-size="19">$0.1462</text><text x="70" y="630" fill="#f6f1e6" font-size="19">stop at 6 steps</text><rect x="400" y="600" width="259" height="44" fill="#f6f1e6"/><text x="675" y="630" fill="#f6f1e6" font-size="19">$0.0924</text><text x="70" y="720" fill="#f6f1e6" font-size="16">input $2, cached input $0.50, output $8 per million tokens; 3,500 base, 1,200 added per step</text></g></svg>