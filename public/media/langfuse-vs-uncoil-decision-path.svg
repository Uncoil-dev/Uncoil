<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="46" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Decision path: which way do you branch?
  </text>

  <!-- Start node -->
  <rect x="470" y="80" width="260" height="64" fill="#151515" stroke="#FFFFFF" stroke-width="2"/>
  <text x="600" y="107" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Must production data stay</text>
  <text x="600" y="126" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">inside your VPC?</text>

  <!-- Line to YES (left) -->
  <line x1="530" y1="144" x2="330" y2="210" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="410" y="180" font-size="12" fill="#FFFF00" font-family="'Geist Mono', monospace">yes</text>

  <!-- Line to NO (right) -->
  <line x1="670" y1="144" x2="870" y2="210" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="770" y="180" font-size="12" fill="#FFFF00" font-family="'Geist Mono', monospace">no</text>

  <!-- Left branch: Langfuse self-hosted -->
  <rect x="150" y="212" width="360" height="66" fill="#0a0a0a" stroke="#FFFFFF" stroke-width="2"/>
  <text x="330" y="240" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Langfuse, self-hosted</text>
  <text x="330" y="260" font-size="12" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">Only path that satisfies data residency</text>

  <line x1="330" y1="278" x2="330" y2="330" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="150" y="332" width="360" height="72" fill="#0a0a0a" stroke="#666666" stroke-width="1"/>
  <text x="330" y="358" font-size="12" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">Budget 0.5-1.5 FTE ops</text>
  <text x="330" y="378" font-size="12" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">Build evaluation tooling yourself</text>
  <text x="330" y="396" font-size="12" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">~9 weeks to production gate</text>

  <!-- Right branch: second question -->
  <rect x="690" y="212" width="360" height="66" fill="#0a0a0a" stroke="#FFFF00" stroke-width="2"/>
  <text x="870" y="240" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Is evaluation velocity or</text>
  <text x="870" y="260" font-size="14" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">cost visibility the blocker?</text>

  <line x1="800" y1="278" x2="700" y2="330" stroke="#FFFF00" stroke-width="1.5"/>
  <text x="720" y="310" font-size="12" fill="#FFFF00" font-family="'Geist Mono', monospace">yes</text>

  <line x1="940" y1="278" x2="1040" y2="330" stroke="#FFFF00" stroke-width="1.5"/>
  <text x="960" y="310" font-size="12" fill="#FFFF00" font-family="'Geist Mono', monospace">no</text>

  <!-- Sub-branch: Uncoil -->
  <rect x="520" y="332" width="360" height="72" fill="#1a1a08" stroke="#FFFF00" stroke-width="2"/>
  <text x="700" y="358" font-size="13" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Uncoil</text>
  <text x="700" y="378" font-size="12" fill="#CCCC88" text-anchor="middle" font-family="'Geist Mono', monospace">Tracing + eval + cost, day 2-3</text>
  <text x="700" y="396" font-size="12" fill="#CCCC88" text-anchor="middle" font-family="'Geist Mono', monospace">0.1 FTE ongoing, no infra</text>

  <!-- Sub-branch: Langfuse Cloud -->
  <rect x="900" y="332" width="300" height="72" fill="#0a0a0a" stroke="#AAAAAA" stroke-width="1"/>
  <text x="1050" y="358" font-size="13" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Langfuse Cloud</text>
  <text x="1050" y="378" font-size="11" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">Managed tracing, DIY eval</text>
  <text x="1050" y="396" font-size="11" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">Fine if eval isn't urgent</text>

  <!-- reversibility note -->
  <rect x="150" y="470" width="900" height="150" fill="#0a0a0a" stroke="#444444" stroke-width="1"/>
  <text x="600" y="500" font-size="14" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">Migration is asymmetric</text>
  <text x="200" y="530" font-size="12" fill="#FFFF00" font-family="'Geist Mono', monospace">Langfuse → Uncoil</text>
  <text x="200" y="550" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">Run both SDKs in parallel 2-4 weeks.</text>
  <text x="200" y="568" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">Rollback within 24 hours. Low risk.</text>

  <text x="700" y="530" font-size="12" fill="#FFFFFF" font-family="'Geist Mono', monospace">Uncoil → Langfuse</text>
  <text x="700" y="550" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">Export, replay, rebuild eval logic by hand.</text>
  <text x="700" y="568" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">No automated tooling. 4-6 weeks, moderate risk.</text>

  <text x="600" y="600" font-size="11" fill="#777777" text-anchor="middle" font-family="'Geist Mono', monospace">Decide the residency question first — it determines which migration direction you can afford to reverse</text>
</svg>
