<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Twelve bars of growing height, one per agent step, each a cream base topped by a taller yellow history block</title><desc id="d">On a black field, twelve bars stand side by side. Each has the same cream base for the fixed prompt, and a yellow block of re-sent history that grows with every step, while a thin grey strip below each bar marks the small output.</desc><rect width="1600" height="760" fill="#0a0a0a"/><g font-family="monospace"><text x="140" y="92" fill="#f6f1e6" font-size="22" letter-spacing="3">INPUT TOKENS SENT AT EACH STEP</text><rect x="140" y="580" width="82" height="60" fill="#f6f1e6"/><rect x="140" y="640" width="82" height="8" fill="#6b6b6b"/><text x="181.0" y="676" fill="#f6f1e6" font-size="16" text-anchor="middle">1</text><rect x="238" y="580" width="82" height="60" fill="#f6f1e6"/><rect x="238" y="556" width="82" height="24" fill="#f4d44d"/><rect x="238" y="640" width="82" height="8" fill="#6b6b6b"/><text x="279.0" y="676" fill="#f6f1e6" font-size="16" text-anchor="middle">2</text><rect x="336" y="580" width="82" height="60" fill="#f6f1e6"/><rect x="336" y="532" width="82" height="48" fill="#f4d44d"/><rect x="336" y="640" width="82" height="8" fill="#6b6b6b"/><text x="377.0" y="676" fill="#f6f1e6" font-size="16" text-anchor="middle">3</text><rect x="434" y="580" width="82" height="60" fill="#f6f1e6"/><rect x="434" y="508" width="82" height="72" fill="#f4d44d"/><rect x="434" y="640" width="82" height="8" fill="#6b6b6b"/><text x="475.0" y="676" fill="#f6f1e6" font-size="16" text-anchor="middle">4</text><rect x="532" y="580" width="82" height="60" fill="#f6f1e6"/><rect x="532" y="484" width="82" height="96" fill="#f4d44d"/><rect x="532" y="640" width="82" height="8" fill="#6b6b6b"/><text x="573.0" y="676" fill="#f6f1e6" font-size="16" text-anchor="middle">5</text><rect x="630" y="580" width="82" height="60" fill="#f6f1e6"/><rect x="630" y="4