<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="40" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Decision Framework: Complexity vs Scope
  </text>
  <text x="600" y="64" font-size="13" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">
    The two axes that actually predict which platform fits
  </text>

  <!-- plot area border -->
  <rect x="150" y="110" width="950" height="470" fill="none" stroke="#333333" stroke-width="1"/>

  <!-- quadrant fills -->
  <rect x="150" y="110" width="475" height="235" fill="#FF8844" opacity="0.10"/>
  <rect x="625" y="110" width="475" height="235" fill="#FFFF00" opacity="0.08"/>
  <rect x="150" y="345" width="475" height="235" fill="#FFFFFF" opacity="0.05"/>
  <rect x="625" y="345" width="475" height="235" fill="#FFFF00" opacity="0.16"/>

  <!-- center cross -->
  <line x1="625" y1="110" x2="625" y2="580" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="150" y1="345" x2="1100" y2="345" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- axis labels -->
  <text x="625" y="615" font-size="14" font-weight="bold" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">
    Observability scope
  </text>
  <text x="290" y="600" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">
    Evaluation only
  </text>
  <text x="960" y="600" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace">
    Eval + tracing + cost + experiments
  </text>

  <text x="70" y="345" font-size="14" font-weight="bold" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace" transform="rotate(-90, 70, 345)">
    Evaluation complexity
  </text>
  <text x="105" y="140" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace" transform="rotate(-90, 105, 140)">
    Deep / domain-specific
  </text>
  <text x="105" y="550" font-size="11" fill="#CCCCCC" text-anchor="middle" font-family="'Geist Mono', monospace" transform="rotate(-90, 105, 550)">
    Standard patterns
  </text>

  <!-- Quadrant: top-left = high complexity, narrow scope -->
  <text x="387" y="180" font-size="16" font-weight="bold" fill="#FF8844" text-anchor="middle" font-family="'Geist Mono', monospace">BRAINTRUST</text>
  <text x="387" y="203" font-size="11" fill="#DDDDDD" text-anchor="middle" font-family="'Geist Mono', monospace">Custom scorers, legal/clinical</text>
  <text x="387" y="219" font-size="11" fill="#DDDDDD" text-anchor="middle" font-family="'Geist Mono', monospace">rules, no tracing need yet</text>

  <!-- Quadrant: top-right = high complexity, broad scope -->
  <text x="862" y="180" font-size="16" font-weight="bold" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">HYBRID</text>
  <text x="862" y="203" font-size="11" fill="#DDDDDD" text-anchor="middle" font-family="'Geist Mono', monospace">Braintrust scores, Uncoil</text>
  <text x="862" y="219" font-size="11" fill="#DDDDDD" text-anchor="middle" font-family="'Geist Mono', monospace">carries trace + cost + exp.</text>

  <!-- Quadrant: bottom-left = low complexity, narrow scope -->
  <text x="387" y="450" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">EITHER</text>
  <text x="387" y="473" font-size="11" fill="#DDDDDD" text-anchor="middle" font-family="'Geist Mono', monospace">Native evaluators cover it;</text>
  <text x="387" y="489" font-size="11" fill="#DDDDDD" text-anchor="middle" font-family="'Geist Mono', monospace">pick whichever you run today</text>

  <!-- Quadrant: bottom-right = low complexity, broad scope -->
  <text x="862" y="450" font-size="18" font-weight="bold" fill="#FFFF00" text-anchor="middle" font-family="'Geist Mono', monospace">UNCOIL</text>
  <text x="862" y="474" font-size="11" fill="#DDDDDD" text-anchor="middle" font-family="'Geist Mono', monospace">Standard scoring + you need</text>
  <text x="862" y="490" font-size="11" fill="#DDDDDD" text-anchor="middle" font-family="'Geist Mono', monospace">cost + tracing + experiments</text>

  <!-- marker dot for a worked example (Scenario 2: multi-model routing) -->
  <circle cx="930" cy="470" r="9" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="930" y="510" font-size="10" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">Scenario 2</text>
  <text x="930" y="524" font-size="10" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">(routing + cost)</text>

  <!-- marker dot for Scenario 1 (support-ticket summarizer, domain rules) -->
  <circle cx="340" cy="195" r="9" fill="#FF8844" stroke="#000000" stroke-width="2"/>
  <text x="340" y="235" font-size="10" fill="#FF8844" text-anchor="middle" font-family="'Geist Mono', monospace">Scenario 1</text>
  <text x="340" y="249" font-size="10" fill="#FF8844" text-anchor="middle" font-family="'Geist Mono', monospace">(liability rules)</text>

  <text x="600" y="668" font-size="12" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace" font-style="italic">
    Plot your own system on these two axes before reading the decision table below.
  </text>
</svg>
