name: Playwright adapter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/playwright/package-lock.json
      - run: npm ci
      - run: npm test
