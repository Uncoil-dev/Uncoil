<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estWkTitle estWkDesc">
  <title id="estWkTitle">Estimated and measured values compared for calls per run, retries and tokens per call in week one</title>
  <desc id="estWkDesc">Three groups of bars compare an estimate with a measured median and a measured 90th percentile. The measured 90th percentile bar is longest in each group.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <g font-family="monospace">
    <text x="100" y="90" fill="#f4d44d" font-size="20" opacity="1" text-anchor="start" letter-spacing="2" >WEEK ONE: ESTIMATE VS MEASURED</text>
    <text x="100" y="122" fill="#f6f1e6" font-size="14" opacity="0.6" text-anchor="start" letter-spacing="0" >illustrative numbers</text>
    <text x="560" y="185" fill="#f6f1e6" font-size="14" opacity="0.7" text-anchor="start" letter-spacing="0" >estimate</text>
    <text x="790" y="185" fill="#f4d44d" font-size="14" opacity="1" text-anchor="start" letter-spacing="0" >measured median</text>
    <text x="1020" y="185" fill="#e06a5a" font-size="14" opacity="1" text-anchor="start" letter-spacing="0" >measured 90th pct</text>
    <text x="100" y="246" fill="#f6f1e6" font-size="16" opacity="0.9" text-anchor="start" letter-spacing="0" >CALLS PER RUN</text>
    <rect x="560" y="210" width="156" height="34" fill="#2a2a2a" stroke="#f6f1e6" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="560" y="254" width="156" height="34" fill="#f4d44d" stroke="#f4d44d" stroke-width="2" stroke-opacity="1"/>
    <rect x="560" y="298" width="442" height="34" fill="#e06a5a" stroke="#e06a5a" stroke-width="2" stroke-opacity="1"/>
    <text x="100" y="436" fill="#f6f1e6" font-size="16" opacity="0.9" text-anchor="start" letter-spacing="0" >RETRY RATE %</text>
    <rect x="560" y="400" width="208" height="34" fill="#2a2a2a" stroke="#f6f1e6" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="560" y="444" width="572" height="34" fill="#f4d44d" stroke="#f4d44d" stroke-width="2" stroke-opacity="1"/>
    <rect x="560" y="488" width="572" height="34" fill="#e06a5a" stroke="#e06a5a" stroke-width="2" stroke-opacity="1"/>
    <text x="100" y="626" fill="#f6f1e6" font-size="16" opacity="0.9" text-anchor="start" letter-spacing="0" >TOKENS PER CALL (K)</text>
    <rect x="560" y="590" width="104" height="34" fill="#2a2a2a" stroke="#f6f1e6" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="560" y="634" width="130" height="34" fill="#f4d44d" stroke="#f4d44d" stroke-width="2" stroke-opacity="1"/>
    <rect x="560" y="678" width="234" height="34" fill="#e06a5a" stroke="#e06a5a" stroke-width="2" stroke-opacity="1"/>
    <text x="100" y="830" fill="#f6f1e6" font-size="14" opacity="0.6" text-anchor="start" letter-spacing="0" >The average can match while the tail runs far beyond the estimate.</text>

  </g>
</svg>
