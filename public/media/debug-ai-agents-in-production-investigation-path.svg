<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
  <title id="title">AI agent incident investigation path</title>
  <desc id="desc">Follow a report through the affected run to its first divergence, name the mechanism, make a bounded correction, and verify it against a regression case.</desc>
  <rect width="1100" height="590" fill="#eceae3"/>
  <text x="48" y="62" fill="#090909" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">INVESTIGATION MAP</text>
  <text x="48" y="105" fill="#090909" font-family="Arial,sans-serif" font-size="31" font-weight="700">Follow evidence to a testable mechanism</text>
  <g font-family="Arial,sans-serif">
    <rect x="48" y="157" width="166" height="110" fill="#090909"/><text x="68" y="192" fill="#f4d44d" font-size="13" font-weight="700" letter-spacing="2">01</text><text x="68" y="224" fill="#eceae3" font-size="19" font-weight="700">User effect</text><text x="68" y="249" fill="#c9c7c1" font-size="13">What failed?</text>
    <path d="M214 212H244" stroke="#090909" stroke-width="3"/><path d="M244 212l-9-7v14z" fill="#090909"/>
    <rect x="248" y="157" width="166" height="110" fill="#090909"/><text x="268" y="192" fill="#f4d44d" font-size="13" font-weight="700" letter-spacing="2">02</text><text x="268" y="224" fill="#eceae3" font-size="19" font-weight="700">Failed run</text><text x="268" y="249" fill="#c9c7c1" font-size="13">Which version?</text>
    <path d="M414 212H444" stroke="#090909" stroke-width="3"/><path d="M444 212l-9-7v14z" fill="#090909"/>
    <rect x="448" y="157" width="166" height="110" fill="#f4d44d"/><text x="468" y="192" fill="#090909" font-size="13" font-weight="700" letter-spacing="2">03</text><text x="468" y="224" fill="#090909" font-size="19" font-weight="700">First divergence</text><text x="468" y="249" fill="#333333" font-size="13">Where did it split?</text>
    <path d="M614 212H644" stroke="#090909" stroke-width="3"/><path d="M644 212l-9-7v14z" fill="#090909"/>
    <rect x="648" y="157" width="166" height="110" fill="#090909"/><text x="668" y="192" fill="#f4d44d" font-size="13" font-weight="700" letter-spacing="2">04</text><text x="668" y="224" fill="#eceae3" font-size="19" font-weight="700">Mechanism</text><text x="668" y="249" fill="#c9c7c1" font-size="13">What allowed it?</text>
    <path d="M814 212H844" stroke="#090909" stroke-width="3"/><path d="M844 212l-9-7v14z" fill="#090909"/>
    <rect x="848" y="157" width="204" height="110" fill="#090909"/><text x="868" y="192" fill="#f4d44d" font-size="13" font-weight="700" letter-spacing="2">05</text><text x="868" y="224" fill="#eceae3" font-size="19" font-weight="700">Verified change</text><text x="868" y="249" fill="#c9c7c1" font-size="13">What proves it?</text>
    <rect x="48" y="316" width="1004" height="2" fill="#b8b6af"/>
    <text x="48" y="360" fill="#555555" font-size="13" font-weight="700" letter-spacing="2">KEEP THE CONTEXT WITH THE RUN</text>
    <g fill="#090909" font-size="17"><text x="48" y="406">release + prompt versions</text><text x="386" y="406">retrieved evidence</text><text x="670" y="406">tool inputs + results</text><text x="48" y="456">retry and approval path</text><text x="386" y="456">user-visible outcome</text><text x="670" y="456">expected behavior</text></g>
    <rect x="48" y="510" width="1004" height="40" fill="#f4d44d"/><text x="66" y="536" fill="#090909" font-size="16" font-weight="700">Do not patch the symptom until you can state what evidence would disprove your hypothesis.</text>
  </g>
</svg>
