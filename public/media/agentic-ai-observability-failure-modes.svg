<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agFailTitle agFailDesc">
  <title id="agFailTitle">Four autonomy failure modes mapped against detection difficulty and blast radius</title>
  <desc id="agFailDesc">A black canvas shows a two-axis grid with detection difficulty on the vertical axis and blast radius on the horizontal axis, plotting four failure modes as cream and acid-yellow dots: tool misuse, planning drift, silent looping, and cascading delegation, with cascading delegation in the hardest-to-detect, largest-blast-radius corner.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="800" y="60" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">AUTONOMY FAILURE MODES</text>

  <line x1="220" y1="780" x2="220" y2="130" stroke="#f6f1e6" stroke-width="2"/>
  <line x1="220" y1="780" x2="1420" y2="780" stroke="#f6f1e6" stroke-width="2"/>
  <text x="130" y="140" fill="#f6f1e6" font-family="monospace" font-size="14">hard to</text>
  <text x="130" y="158" fill="#f6f1e6" font-family="monospace" font-size="14">detect</text>
  <text x="130" y="770" fill="#f6f1e6" font-family="monospace" font-size="14">easy</text>
  <text x="1300" y="810" fill="#f6f1e6" font-family="monospace" font-size="14">large blast radius</text>
  <text x="230" y="810" fill="#f6f1e6" font-family="monospace" font-size="14">small</text>

  <g font-family="monospace" font-size="14" font-weight="700">
    <circle cx="450" cy="650" r="16" fill="#f6f1e6"/>
    <text x="480" y="655" fill="#f6f1e6">TOOL MISUSE</text>

    <circle cx="750" cy="450" r="16" fill="#f6f1e6"/>
    <text x="780" y="455" fill="#f6f1e6">PLANNING DRIFT</text>

    <circle cx="600" cy="300" r="16" fill="#f4d44d"/>
    <text x="630" y="305" fill="#f4d44d">SILENT LOOPING</text>

    <circle cx="1150" cy="220" r="20" fill="#e2543a"/>
    <text x="1190" y="200" fill="#e2543a">CASCADING</text>
    <text x="1190" y="222" fill="#e2543a">DELEGATION</text>
  </g>

  <text x="800" y="850" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="14">uncoil.dev · the failures that matter most are the hardest to see in a final-answer-only log</text>
</svg>
