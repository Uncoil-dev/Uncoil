<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#000000"/>

  <text x="600" y="46" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">
    Illustrative monthly cost: self-hosted OpenObserve vs managed Uncoil
  </text>
  <text x="600" y="70" font-size="13" fill="#AAAAAA" text-anchor="middle" font-family="'Geist Mono', monospace">
    OpenObserve total = infrastructure + operator time at a blended $75/hr. Modeled ranges, not vendor quotes.
  </text>

  <!-- Axis -->
  <line x1="130" y1="590" x2="1120" y2="590" stroke="#555555" stroke-width="1"/>
  <line x1="130" y1="120" x2="130" y2="590" stroke="#555555" stroke-width="1"/>
  <text x="70" y="130" font-size="11" fill="#777777" font-family="'Geist Mono', monospace">$/mo</text>

  <!-- Gridlines -->
  <g stroke="#222222" stroke-width="1">
    <line x1="130" y1="490" x2="1120" y2="490"/>
    <line x1="130" y1="390" x2="1120" y2="390"/>
    <line x1="130" y1="290" x2="1120" y2="290"/>
    <line x1="130" y1="190" x2="1120" y2="190"/>
  </g>
  <g font-size="11" fill="#666666" font-family="'Geist Mono', monospace">
    <text x="100" y="594" text-anchor="end">$0</text>
    <text x="100" y="494" text-anchor="end">$1,000</text>
    <text x="100" y="394" text-anchor="end">$2,000</text>
    <text x="100" y="294" text-anchor="end">$3,500</text>
    <text x="100" y="194" text-anchor="end">$5,000</text>
  </g>

  <!-- scale: 0.083 px per $, baseline y=590 -->
  <!-- Tier 1: 250K traces/month -->
  <text x="270" y="612" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">250K traces/mo</text>

  <!-- OpenObserve stacked bar: infra 120 -> 10px/100 approx; ops 375 -->
  <!-- scale factor: 400px total range covers $0-5000 => 0.08px/$ -->
  <rect x="200" y="580.4" width="60" height="9.6" fill="#FFD400"/>
  <rect x="200" y="550.4" width="60" height="30" fill="#B89400"/>
  <text x="230" y="540" font-size="11" fill="#FFD400" text-anchor="middle" font-family="'Geist Mono', monospace">$495</text>
  <text x="230" y="632" font-size="10" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">O2 self-host</text>

  <rect x="300" y="554.4" width="60" height="35.6" fill="#FFFFFF"/>
  <text x="330" y="544" font-size="11" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">$450</text>
  <text x="330" y="632" font-size="10" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil</text>

  <!-- Tier 2: 1M traces/month -->
  <text x="600" y="612" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">1M traces/mo</text>

  <rect x="530" y="567.6" width="60" height="22.4" fill="#FFD400"/>
  <rect x="530" y="507.6" width="60" height="60" fill="#B89400"/>
  <text x="560" y="497" font-size="11" fill="#FFD400" text-anchor="middle" font-family="'Geist Mono', monospace">$1,030</text>
  <text x="560" y="632" font-size="10" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">O2 self-host</text>

  <rect x="630" y="478.8" width="60" height="111.2" fill="#FFFFFF"/>
  <text x="660" y="469" font-size="11" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">$1,400</text>
  <text x="660" y="632" font-size="10" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil</text>

  <!-- Tier 3: 5M traces/month -->
  <text x="930" y="612" font-size="13" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace" font-weight="bold">5M traces/mo</text>

  <rect x="860" y="518" width="60" height="72" fill="#FFD400"/>
  <rect x="860" y="410" width="60" height="108" fill="#B89400"/>
  <text x="890" y="400" font-size="11" fill="#FFD400" text-anchor="middle" font-family="'Geist Mono', monospace">$2,250</text>
  <text x="890" y="632" font-size="10" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">O2 self-host</text>

  <rect x="960" y="230" width="60" height="360" fill="#FFFFFF"/>
  <text x="990" y="220" font-size="11" fill="#FFFFFF" text-anchor="middle" font-family="'Geist Mono', monospace">$4,500</text>
  <text x="990" y="632" font-size="10" fill="#999999" text-anchor="middle" font-family="'Geist Mono', monospace">Uncoil</text>

  <!-- legend -->
  <rect x="150" y="655" width="14" height="14" fill="#B89400"/>
  <text x="172" y="666" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">operator time (upgrades, scaling, on-call)</text>
  <rect x="560" y="655" width="14" height="14" fill="#FFD400"/>
  <text x="582" y="666" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">infrastructure (compute + object storage)</text>
  <rect x="900" y="655" width="14" height="14" fill="#FFFFFF"/>
  <text x="922" y="666" font-size="11" fill="#CCCCCC" font-family="'Geist Mono', monospace">Uncoil managed subscription</text>
</svg>
